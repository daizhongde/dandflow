<!DOCTYPE html>
<html>
<head>
<!-- 以表格的形式展示（本页面是子页面，打开时需传入实例ID）
主记录：正在运行的叶子任务
列表：实例名｜叶子任务名称｜正在运行的叶子任务数量｜耗时｜启动时间
 -->
<meta charset="UTF-8">
<title>监控某个实例正在运行的叶子任务数量</title>
<style type="text/css">  

    </style>  
  
    <script src="../scripts/websocket/sockjs.min.js"></script>  
  
    <script type="text/javascript">  
    var websocket = null;  
//     var username = localStorage.getItem("name");  
	var username = "daizd";
      
    //判断当前浏览器是否支持WebSocket  
    if ('WebSocket' in window) {
    	var url = "ws://" + document.location.host + "/migration/websocket/runningIns/" + username + "/";
    	console.log(url);
        websocket = new WebSocket(url);  
    } else {  
        alert('当前浏览器 Not support websocket')  
    }  
      
    //连接发生错误的回调方法  
    websocket.onerror = function() {  
        setMessageInnerHTML("WebSocket连接发生错误");  
    };  
      
    //连接成功建立的回调方法  
    websocket.onopen = function() {  
        setMessageInnerHTML("WebSocket连接成功");  
    }  
      
    //接收到消息的回调方法  
    websocket.onmessage = function(event) {  
        setMessageInnerHTML(event.data);  
    }  
      
    //连接关闭的回调方法  
    websocket.onclose = function() {  
        setMessageInnerHTML("WebSocket连接关闭");  
    }  
      
    //监听窗口关闭事件，当窗口关闭时，主动去关闭websocket连接，防止连接还没断开就关闭窗口，server端会抛异常。  
    window.onbeforeunload = function() {  
        closeWebSocket();  
    }
    function setMessageInnerHTML(msg){
    	var v = document.getElementById("chatlog").value;
    	document.getElementById("chatlog").innerHTML = v+"\n"+msg;
    };
    //关闭WebSocket连接  
    function closeWebSocket() {
        websocket.close();  
    }

    function postToServer() {    
    	websocket.send(document.getElementById("msg").value);    
        document.getElementById("msg").value = "";    
    }    
    function closeConnect() {    
    	websocket.close();    
    }    
    
    </script>  
</head>  
<body>  
 	<textarea id="chatlog" rows="10" cols="40"></textarea>  
    <br />  
    <input id="msg" type="text" />  
    <button type="submit" id="sendButton" onClick="postToServer()">Send!</button>  
    <button type="submit" id="sendButton" onClick="closeConnect();">End</button>  
</body>  
</html>
