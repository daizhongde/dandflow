<script type="text/javascript">
var query = VIRTUE.query;
var OPE = VIRTUE.operator;

var tableName = "mig_ins_quartz";

var domains = ajaxReqRespText("/cbb/dicCBBgetDicByType.action?dicType=Busi-Domain");
domains = eval("(" + domains + ")");

function enterKeyDown(event)
{
    if(event.keyCode==13)
    {
    	submitForm();
	}
};

/** validate and assign value **/
function PackingParameter(){	
	var formData = $('#s_form').form( 'getData');
	query.init();
	for (var field in formData) {
		if( formData[field] !== "" ){
			query.jdata.condition[field] = formData[field];
			query.jdata.operator[field] = OPE.CONTAIN;
		}
	}
// 	alert( $.toJSON(query.jdata.condition) );
	return true;
};

/** search data ,reload data  **/
function submitForm(){
   	if(!PackingParameter()){
   		return;
   	}
   	$('#grid').datagrid( 'reload', {
   		tableName : tableName,
   		jdata: encodeURI( $.toJSON( query.jdata ) ) 
   	} );
};
/**  清空  **/
function clearForm(){
	$('#s_form').form('clear');
};

function newRecord(){  //使用一个window
	$('#win').window('open').window('setTitle', 'New');
	$('#win').window("refresh", "migInsQuartz_add.html");
}

var read = {};
read.jdata = { act: "read",condition: {faudit_id: ""}, operator : {faudit_id:1} };
function editRecord() {
	var row = $('#grid').datagrid('getSelected');
	if (row) {
		read.jdata.condition.faudit_id = row.faudit_id;
		$('#win').window('open').window('setTitle', 'Edit');
		$('#win').window("refresh", getContextPath()+"/curd/migInsQuartzCURDinitModify.action?tableName="+tableName+"&jdata="+encodeURI($.toJSON( read.jdata )));
	}
}

function browseRecord() {
	var row = $('#grid').datagrid('getSelected');
	if (row) {
		$('#win').window('open').window('setTitle', 'View');
		read.jdata.condition.faudit_id = row.faudit_id;
		$('#win').window("refresh", getContextPath()+"/curd/migInsQuartzCURDbrowse.action?tableName="+tableName+"&jdata="+encodeURI($.toJSON( read.jdata )));
	}
}

var del = {};
del.jdata = {act: "del",condition: { id: "" },operator : {id : 1} };
function destroyRecord(){
	var row = $('#grid').datagrid('getSelected');
	if (row){
		$.messager.confirm('Comfirm','Comfirm Remove?',function(r){
			if (r){
				del.jdata.condition.id = row.id;
				$.post( getContextPath()+"/curd/migInsQuartzCURDdelete.action", {
					tableName : tableName,
					jdata: encodeURI($.toJSON( del.jdata )) 
				}, function(result, status){
					alert(result.msg);
					if (result.success){
						$('#grid').datagrid('reload',{
							tableName : tableName,
							jdata: encodeURI( $.toJSON( query.jdata ) )
						} );	// reload data
					}
				});
			}
		});
	}
};

var toolbar = [{
	text:'New Record',
	iconCls:'icon-add',
	handler:function(){
		newRecord();
	}
},{
	text:'Edit Record',
	iconCls:'icon-edit',
	handler:function(){
		editRecord();
	}
},{
	text:'Remove Record',
	iconCls:'icon-remove',
	handler:function(){
		destroyRecord();
	}
},{
	text:'View Record',
	iconCls:'icon-search',
	handler:function(){ 
		browseRecord(); 
	}
}];

$(function(){
	$('#grid').datagrid({
// 		title : 'Search Result',
		toolbar : toolbar,
		width : 938,
		height : 720,
		nowrap : true,
		striped : true,
		fit : true,
		collapsible : true,
		url: getContextPath()+"/query/migInsQuartzJEasyUIQUERYdfind.action",
		idField : "id",
		remoteSort: true,
		multiSort : false,
		singleSelect : true,
		columns : [ [
			{ title : 'Key', field : 'id', width : 90, hidden:true, sortable: true },
			{ title : 'Instance ID', field : 'case_id', width : 120, hidden:true, sortable: true },
			{ title : 'Instance Name', field : 'insname',  width : 220 },
			{ title : 'jobGroup', field : 'jobgroup',  width : 120 },
			{ title : 'jobName', field : 'jobname',  width : 220 },
			{ title : 'cronExpression', field : 'cronexpression',  width : 120 },
			{ title : 'Author', field : 'author',  width : 120 },
			{ title : 'Description', field : 'remark',  width : 300 },
			{ title : 'Create Time', field : 'createtime',  width : 130 }
		] ],
		pagination : true,
		rownumbers : false,
		queryParams : {
			tableName : tableName,
			jdata: encodeURI( $.toJSON( query.jdata ) ) 
		}
	});
});
//92px  118px

                    <td>
                        <input class="easyui-combobox" 
		                        id='jobgroup' name="jobgroup" value="" 
		                        data-options="valueField:'code', textField:'value',
		                        editable:false,
								data: domains,
                        onChange: function(newValue, oldValue){
                        	submitForm();
                        }"/>
                    </td>
                    <td>Ins Name:</td>
                    <td>
                        <input id="job_ins_name" name="t2.job_ins_name" value="" onkeydown="enterKeyDown(event)">
                    </td>
                    <td>Job Name:</td>
                    <td>
                        <input id="jobname" name="jobname" value="" onkeydown="enterKeyDown(event)">
                    </td>
                </tr>
            </table>

        <table width="100%" border="0" align="center">

				<td height="23"><div align="center"><!-- default height='21'  -->
					<a class="easyui-linkbutton" data-options="iconCls:'icon-search'" href="javascript:void(0)" 
               		onclick="submitForm()" style="width:80px">Submit</a>&nbsp;&nbsp;
               		<a class="easyui-linkbutton" data-options="iconCls:'icon-clear'" href="javascript:void(0)" 
               		onclick="clearForm()" style="width:80px">Clear</a>
				</div></td>
			</tr>
		</table>
		</form>

    <div data-options="region:'center', border:false" title="Search Result" style="overflow:hidden;" noheader="true">
