<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">

</head>
<body>
<div class="easyui-layout" data-options="fit:true">
	<div data-options="region:'center',border:false" title="" noheader="true">
		<div style="padding:10px 0 10px 30px">
		    <form id="c_form" method="post" action="" style="margin:0;padding:0;">
		    	<table align="center">
		    		<tr>
		    			<td>Job Group:</td>
		    			<td>
		    				<input class="easyui-combobox" 
			                        id='domain_C' name="jobgroup" value=""
			                        data-options="valueField:'code', textField:'value',
			                        editable:false,
			                        required: true,
									data: domains" />

					<tr>

							<input id='case_id' name='case_id' />
						</td>
		    		</tr>
		    		<tr>
		    			<td>Job Name:</td>
		    			<td><input class="easyui-validatebox" type="text" id="jobname" name="jobname" data-options="required:true"></input></td>
		    		</tr>
		    		<tr>
		    			<td>Description:</td>
		    			<td><textarea id="remark" name="remark" style="height:30px;width:160px;font-size: 12px;"></textarea></td>
		    		</tr>
		    	</table>
		    </form>
		</div>
    </div>
<script type="text/javascript">
var add = VIRTUE.add;

add.submitForm = function (){
	if( ! $('#c_form').form("validate") )
	{
		return;
	}
	
	var formData = $('#c_form').form( 'getData');
	add.init();
	for (var field in formData) {
		add.jdata.data[field] = formData[field];
	}
	
	jQuery.post( getContextPath()+"/curd/migAuditfMainCURDadd.action", 
		{
			tableName : tableName,
			jdata : encodeURI($.toJSON( add.jdata )) 
		},
		function(oResponse, status){
			alert(oResponse.msg);

			if(oResponse.success == true){
				$('#grid').datagrid('reload',{
					tableName : tableName,
					jdata: encodeURI($.toJSON( query.jdata ) ) 
				} );
				$('#win').window('close');
			}
	});
};
add.clearForm = function (){
	$('#c_form').form('clear');
};

$(function(){
	$('#case_id').combogrid({
		url : getContextPath()+"/query/commonCBBQUERYdfind.action",
		panelWidth : 500,
		panelHeight : 200,
		idField : 'job_ins_id',
		textField : 'job_ins_name',
		editable: true,
		pagination : true,
		fitColumns : false,
		required : true,
		rownumbers : true,
		mode : 'remote',
		delay : 500,
		sortName : 'job_ins_name',
		sortOrder : 'asc',
		pageSize : 5,
		pageList : [ 5, 10 ],
		queryParams : {
			tableName : "mig_job_ins",
			columns: "job_ins_name"
		},
		columns : [ [ {
			field : 'dryrun_id',
			title : 'dryrun_id',
			width : 60,
			sortable : true
		},{
			field : 'job_ins_name',
			title : 'job_ins_name',
			width : 200,
			sortable : true
		},{
			field : 'type',
			title : 'type',
			width : 50,
			sortable : true
		}, {
			field : 'author',
			title : 'author',
			width : 60,
			sortable : true
		}, {
			field : 'remark',
			title : 'remark',
			width : 220,
			sortable : false
		}, {
			field : 'mtime',
			title : 'Create Time',
			width : 130,
			sortable : true
		} ] ]
	});

});
</script>
	<div data-options="region:'south',border:false" style="text-align:right;padding:5px 5px 5px 0;background:#F4F4F4;">

		<a class="easyui-linkbutton" data-options="iconCls:'icon-cancel'" href="javascript:void(0)" onclick="javascript:$('#win').dialog('close');" style="width:80px">Cancel</a>
	</div>
	
	
</div>
