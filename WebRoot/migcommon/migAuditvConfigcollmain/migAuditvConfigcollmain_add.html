<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<title>新建</title>
</head>
<body rightmargin="0" bottommargin="0" leftmargin="0" topmargin="0" class="easyui-layout">
<div data-options="region:'center',border:false" title="" style="overflow:hidden;" noheader="true">
	<div style="padding:10px 0 10px 60px">
	    <form id="c_form" method="post" action="">
	    	<table align="center">
	    		<tr>
	    			<td>配置集合名称:</td>
	    			<td><input class="easyui-validatebox" type="text" id="name_C" name="name" data-options="required:true"></input></td>
	    		</tr>
	    		<tr>
	    			<td>备注:</td>
	    			<td><textarea id="remark_C" name="remark" style="height:60px;font-size: 12px;"></textarea></td>
	    		</tr>
	    	</table>
	    </form>
	</div>
    <div style="text-align:center;padding:5px">
    	<input type='button' onclick="add.submitForm()" value='提 交'/>&nbsp;
		<input type='button' onclick="add.clearForm()" value='清 空'/>
    </div>
<script type="text/javascript">
var add = VIRTUE.add;

add.submitForm = function (){
	if( ! $('#c_form').form("validate") )
	{
		return;
	}
	
	var formData = $('#c_form').form( 'getData');
	add.init();
	for (var field in formData) {
		add.jdata.data[field] = formData[field];
	}

	jQuery.post( getContextPath()+"/curd/commonCURDaddWithId.action", 
		{
			tableName : tableName,
			jdata : encodeURI($.toJSON( add.jdata )) 
		},
		function(oResponse, status){
			alert(oResponse.msg);

			if(oResponse.success == true){
				$('#grid').datagrid('reload',{
					tableName : tableName,
					jdata: encodeURI($.toJSON( query.jdata ) ) 
				} );
				$('#win').window('close');
			}
	});
};
add.clearForm = function (){
	$('#c_form').form('clear');
};
</script>
</div>
</body>
</html>
