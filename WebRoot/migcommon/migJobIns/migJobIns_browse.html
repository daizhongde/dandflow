<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
<title>实例配置</title>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

</head>
<body>
	<div class="easyui-layout" fit="true">
	<form id="viewJobIns_form" method="post" style="margin:0;padding:0;">
		<div data-options="region:'north'" style="height:50px">
			<table id="ujobTable0" width="100%" cellpadding="2">
				<tr>
					<td style='width:130px'></td>
					<td><input id="ujobId" class="easyui-validatebox"
						data-options="required: true" type="hidden" name="jobInsId"
						style='width:90%;' value="" /></td>
				</tr>
				<tr>
					<td style='width:130px'>Instance Name</td>
					<td><input id="ujobName" class="easyui-validatebox"
						data-options="required: true" type="text" name="jobInsName"
						style='width:90%;' value="" /></td>
				</tr>
			</table>
		</div>
		<div data-options="region:'center',border:false" title=""
			style="overflow:hidden" noheader="true">
			<div class="easyui-tabs" fit="true" >
				<div title="Job specification" style="padding:10px">
					<table id="ujobTable1" width="100%" cellpadding="2">
						
						<tr>
							<td style='width:120px'>Author</td>
							<td><input id="ujobAuthor" class="easyui-validatebox"
								data-options="required : false" type="text" name="author"
								style='width:90%;' value="" readonly="readonly" /></td>
						</tr>
						<tr>
							<td style='width:120px'>Remark</td>
							<td><textarea id="ujobRemark" rows="5" style='width:90%;'
									name="remark"></textarea></td>
						</tr>
						<tr>
							<td style='width:120px'>Last Update Time</td>
							<td><input id="ujobUpdate" class="easyui-validatebox"
								data-options="required : false" type="text" name="mtime"
								style='width:90%;' value="" readonly="readonly" /></td>
						</tr>
					</table>
				</div>
				<div title="Variables" style="padding:10px">
					<table id="jobinsparam_grid"></table>
				</div>
			</div>
		</div>
	</form>
	</div>
<script type="text/javascript">
jQuery(document).ready(function() {
	$("#viewJobIns_form").form("load", pojo);
});

/** 作业参数信息工具栏信息 */
app.jobparam_toolbar = [ {
	text : 'New',
	disabled: false,
	iconCls : 'icon-add',
	handler : function() {
		jobparam_append();
		return false;
	}
}, '-', {
	text : 'Remove',
	disabled: false,
	iconCls : 'icon-remove',
	handler : function() {
		jobparam_removeit();
		return false;
	}
} , '-', {
	text : 'Save',
	disabled: false,
	iconCls : 'icon-save',
	handler : function() {
		jobparam_accept();
		return false;
	}
}, '-', {
	text : 'Cancel',
	disabled: false,
	iconCls : 'icon-undo',
	handler : function() {
		jobparam_reject();
		return false;
	}
}];
app.jobparaloaded=false;
// 作业参数-表格
$('#jobinsparam_grid').datagrid({
	title : '',
	toolbar : app.jobparam_toolbar,
	width : 938,
	height : 720,
	nowrap : true,
	striped : true,
	fit : true,
	collapsible : true,
	url: getContextPath()+"/query/migInsParaJEasyUIQUERYdfind.action",
	idField : "nodeId",
	multiSort : true,
	singleSelect : true,
	onClickCell : jobparam_onClickRow,
	onLoadSuccess: function(){
		app.jobparaloaded=true;
	},
	columns : [ [ 
		{ title : 'ID', field : 'nodeId', hidden: true }, 
		{ title : 'Variable', field : 'para', editor : { type : 'text'}, width : 90 }, 
		{ title : 'Value', field : 'paraValue', editor : { type : 'text'}, width : 90 }, 
		{ title : 'Type', field : 'paraType', editor : { type : 'text'}, width : 90 }, 
		{ title : 'Chinese Name', field : 'paraName', editor : { type : 'text'}, width : 90 } 
	] ],
	pagination : false,
	rownumbers : false,
	queryParams : {
		jdata : encodeURI($.toJSON({ act: VIRTUE.act.QUERY, condition: {nodeId: app.currentJobId, jobInsId: pojo.jobInsId  }, operator : {} })),
	}
});
		
/** 作业参数表格编辑 */
var jobparam_editIndex = undefined;
function jobparam_endEditing() {
	if (jobparam_editIndex == undefined) 
	{
		return true
	}
	if ($('#jobinsparam_grid').datagrid('validateRow', jobparam_editIndex)) 
	{
		$('#jobinsparam_grid').datagrid('endEdit', jobparam_editIndex);
		jobparam_editIndex = undefined;
		return true;
	}
	else 
	{
		return false;
	}
};
function jobparam_onClickRow(index) {
	if (jobparam_editIndex != index) {
		if (jobparam_endEditing()) {
			$('#jobinsparam_grid').datagrid('selectRow', index).datagrid('beginEdit', index);
			jobparam_editIndex = index;
		} else {
			$('#jobinsparam_grid').datagrid('selectRow', jobparam_editIndex);
		}
	}
};

function jobparam_append() {
	if (jobparam_endEditing()) {
		$('#jobinsparam_grid').datagrid('appendRow', { nodeId: pojo.jobId });
		jobparam_editIndex = $('#jobinsparam_grid').datagrid('getRows').length - 1;
		$('#jobinsparam_grid').datagrid('selectRow', jobparam_editIndex).datagrid('beginEdit',
				jobparam_editIndex);
	}
};
function jobparam_removeit() {
	if (jobparam_editIndex == undefined) {return}
	$('#jobinsparam_grid').datagrid('cancelEdit', jobparam_editIndex).datagrid('deleteRow', jobparam_editIndex)
	jobparam_editIndex = undefined;
};
function jobparam_accept() {
	if (jobparam_endEditing()) {
		$('#jobinsparam_grid').datagrid('acceptChanges');
	}
};
function jobparam_reject() {
	$('#jobinsparam_grid').datagrid('rejectChanges');
	jobparam_editIndex = undefined;
};

</script>
</body>
</html>
