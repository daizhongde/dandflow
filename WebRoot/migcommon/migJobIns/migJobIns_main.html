<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
<title>作业实例管理TreeGrid</title>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<link rel="stylesheet" type="text/css" href="../../scripts/jquery-easyui/1.4.1/themes/default/easyui.css"/>
<link rel="stylesheet" type="text/css" href="../../scripts/jquery-easyui/1.4.1/themes/icon.css"/>
<script type="text/javascript" src="../../scripts/jquery-easyui/1.4.1/jquery.min.js"></script>

<script type="text/javascript" src="../../scripts/jquery-easyui/1.4.1/jquery.easyui.min.js"></script>
<!-- <script type="text/javascript" src="../../scripts/jquery-easyui/1.4.1/locale/easyui-lang-zh_CN.js"></script> -->
<script type="text/javascript" src="../../scripts/json/jquery.json-2.2.min.js"></script>
<script type="text/javascript" src="../../scripts/virtue/virtue.js"></script>
<script type="text/javascript" src="../../scripts/const/const.js"></script>
<script type="text/javascript" src="../../scripts/utils/commonUtil.js"></script>

<script type="text/javascript">
var noquery = VIRTUE.noquery;
var query = VIRTUE.query;
var OPE = VIRTUE.operator;
var del = VIRTUE.del;

var app={};
app.selectedRow = {};//记录数据表格中选择中的行

var jobType = ajaxReqRespText("/cbb/dicCBBgetDicByType.action?dicType=job_type" );
jobType = eval ("(" + jobType + ")");

function enterKeyDown(event)
{
    if(event.keyCode==13)
    {
    	submitForm();
	}
};

/** validate and assign value **/
function PackingParameter(){
// 	console.log("1");
	var dryrun_id = $("#dryrunId").combogrid('getValue');
	var job_ins_name = $('#jinsname').val();
	var type = $('#jtype').combobox("getValue");
	var author = $('#jauthor').val();
	var status = $('#jstatus').combobox('getValue');
// 	console.log("2");
	
	query.init();
	if(dryrun_id != ""){
		query.jdata.condition.dryrun_id = dryrun_id;
		query.jdata.operator.dryrun_id = OPE.EQUAL;
	}
	if(job_ins_name != ""){
		query.jdata.condition.job_ins_name = job_ins_name;
		query.jdata.operator.job_ins_name = OPE.CONTAIN;
	}
	if(type != "" && type != null){
		query.jdata.condition.type = type;
		query.jdata.operator.type = OPE.EQUAL;
	}
	if(author != ""){
		query.jdata.condition.author = author;
		query.jdata.operator.author = OPE.CONTAIN;
	}
	if(status != ""){
		query.jdata.condition["status"] = status;
		query.jdata.operator["status"] = OPE.EQUAL;
	}
// 	console.log("3");
	return true;
};

/** search data ,reload data  **/
function submitForm(){
   	if(!PackingParameter()){
   		return;
   	}
//    	console.log("4");
//  jdata = { act: 'query',condition: {'t1.nmlevel': [0,1,2,3]},operator : {'t1.nmlevel' : 13} };
   	$('#grid').treegrid( 'reload', { jdata: encodeURI( $.toJSON( query.jdata ) ) } );
};
/**  清空  **/
function clearForm(){
	$('#form').form('clear');
};

/** format status **/
function fmtStatus( n ){
	n = new String(n);
	if(n=='0'){
		return JSTATENAME[n]==undefined ? n : JSTATENAME[n];
	}else{
		return "<img src='../../images/job/"+PSTATEICON[n]+"'  alt='alt' />"+(JSTATENAME[n]==undefined ? n : JSTATENAME[n]);
	}
};

/** 启动作业  **/
function startJob(){
	var rows = $('#grid').datagrid('getSelections');
	if(rows.length!=1){
		alert("Please select one row!");
		return false;
	};
	var row = $('#grid').datagrid('getSelected');
	var index = $('#grid').datagrid('getRowIndex', row);

	if (row && ( row.status == JSTATE.UNEXECUTE || row.status == JSTATE.PAUSE ) ) {
		app.selectedRow = row;
		
		var jdata = { jobId: row.job_id, job_ins_id: row.job_ins_id };
		$.ajax({
		   type: "POST",
		   url: "../../busi/migJobProcessBUSIstartJob.action",
		   async: false,
		   data: {
			   jdata: encodeURI( $.toJSON( jdata ) )
		   },
		   success: function(oResponse){
			   oResponse = eval("("+oResponse+")");
				alert( oResponse.msg );
				if (oResponse.success){
					$('#grid').datagrid('reload',{jdata: encodeURI( $.toJSON( query.jdata ) ) } );	// reload data
				}
		   }
		});
	}
};
/** 暂停作业  **/
function pauseJob(){
	var rows = $('#grid').datagrid('getSelections');
	if(rows.length!=1){
		alert("Please select one row!");
		return false;
	};
	var row = $('#grid').datagrid('getSelected');
	if (row && row.status == JSTATE.EXECUTING ) {
		app.selectedRow = row;
		
		var jdata = { jobId: row.job_id, job_ins_id: row.job_ins_id };
		$.ajax({
		   type: "POST",
		   url: "../../busi/migJobProcessBUSIpauseJob.action",
		   async: false,
		   data: {
			   jdata: encodeURI( $.toJSON( jdata ) )
		   },
		   success: function(oResponse){
			   oResponse = eval("("+oResponse+")");
				alert( oResponse.msg );
				if (oResponse.success){
					$('#grid').datagrid('reload',{jdata: encodeURI( $.toJSON( query.jdata ) ) } );	// reload data
				}
		   }
		});
	}
};

/** 重置作业  **/
function resetJob(){
	var rows = $('#grid').datagrid('getSelections');
	if(rows.length!=1){
		alert("Please select one row!");
		return false;
	};
	var row = $('#grid').datagrid('getSelected');
	if (row ) {
		app.selectedRow = row;
		
		var jdata = { jobId: row.job_id, job_ins_id: row.job_ins_id };
		$.ajax({
		   type: "POST",
		   url: "../../busi/migJobInsBUSImodifyJobStatus2init.action",
		   async: false,
		   data: {
			   jdata: encodeURI( $.toJSON( jdata ) )
		   },
		   success: function(oResponse){
			   oResponse = eval("("+oResponse+")");
				alert( oResponse.msg );
				if (oResponse.success){
					$('#grid').datagrid('reload',{jdata: encodeURI( $.toJSON( query.jdata ) ) } );	// reload data
				}
		   }
		});
	}
};
/** 监控*/
function monitor(index, row){
	app.selectedRow = row;
	window.location.href="../../busi/migJobProcessBUSImonitor.action?id="+row.job_ins_id+"&jid="+row.job_id;
	return false;//to support IE6
};
function removeInstance(){
// 	var row = $('#grid').datagrid('getSelected');
	var rows = $('#grid').datagrid('getSelections');
	
	if (rows.length != 0 ) {
		$.messager.confirm('Confirm', 'Confirm Remove?', function(r) {
			if (r) {
				var job_ins_id = new Array();
				for(var i=0; i<rows.length; i++ ){
					job_ins_id.push(rows[i].job_ins_id);
				}
				
				var jdata = { job_ins_id: job_ins_id };
				$.ajax({
				   type: "POST",
				   url: "../../busi/migJobInsBUSIremoveInstance.action",
				   async: false,
				   data: {
					   jdata: encodeURI( $.toJSON( jdata ) )
				   },
				   success: function(oResponse){
					   oResponse = eval("("+oResponse+")");
						alert( oResponse.msg );
						if (oResponse.success){
							$('#grid').datagrid('reload',{jdata: encodeURI( $.toJSON( query.jdata ) ) } );	// reload data
						}
				   }
				});
			}
		});
	}
};

var toolbar = [{
	text:'Monitor',
	iconCls:'icon-monitor',
	handler: function(){
		var rows = $('#grid').datagrid('getSelections');
		if(rows.length!=1){
			alert("Please select one row!");
			return false;
		};
		
		var row = $('#grid').datagrid('getSelected');
		var index = $('#grid').datagrid('getRowIndex', row);
		
		monitor(index, row );
		return false;//to support IE6
	}
},{
	text:'Start',
	iconCls:'icon-run',
	handler: function(){
		startJob(); 
	}
},{
	text:'Pause',
	iconCls:'icon-pause',
	handler: function(){
		pauseJob();
	}
},{
	text:'Reset',
	iconCls:'icon-back',
	handler: function(){
		resetJob();
	}
},{
	text:'Remove',
	iconCls:'icon-remove',
	handler: function(){
		removeInstance();
	}
}];
//program component
$(function(){
	$('#grid').treegrid({
		title: 'Search Result',
		//iconCls:'icon-reload',
// 		toolbar: toolbar,
		width: 938,
		height: 720,
		nowrap: true,
		striped: true,
		fit: true,
// 		collapsible: true,
		url: "../../tree/migJobInsTREEquery_JEasyUI_TreeGrid_Async.action",
		idField: "id",
		treeField: "text",
		remoteSort: true,
		sortName:"totalTime",
		sortOrder:"desc",
		singleSelect: true,
		columns: [[
            {title:'ID',field:"id", hidden: true},
		    {title:'Name',field:"text", width:280, sortable: true},
		    {title:'Begin Time',field:"beginTime",width:130, sortable: true },
		    {title:'End Time',field:"endTime",width:130, sortable: true },
		    {title:'Time(Second)',field:"totalTime",width:130, align: 'right', sortable: true,formatter:function(value){
		    	if( isNvl(value) ){
		    		return "";
		    	}else if(value.length==19){
		    		return value.substr(11,8);
		    	}else{
		    		return value;
		    	}
		    } },

		    {title : 'Dryrun',field : "dryrun", width : 120, sortable: true },
		    {title : 'Instance Type',field:"type", width:120, sortable: true },// instance type ,process is control type
		    {title : 'Status',field:"status",width:80, formatter: fmtStatus,sortable: true },
		    {title : 'Author',field:"author",width:80, sortable: true  },
		    {title : 'Remark',field:"note",width:280 }
		]],
		rownumbers:true,
		pagination:true,
		pageSize: 20,
		queryParams:{
			jdata: encodeURI($.toJSON( noquery.jdata )) 
		},
		onDblClickRow: monitor
	});

	$('#dryrunId').combogrid({
		url : getContextPath()+"/query/commonCBBQUERYdfind.action",
		queryParams : {
			tableName : "v_dryrun_config",
			columns: "mig_dryrun_name"
		},
		editable: true,
		panelWidth : 500,
		panelHeight : 200,
		idField : 'mig_dryrun_id',
		textField : 'mig_dryrun_name',
		pagination : true,
		fitColumns : false,
		required : true,
		rownumbers : true,
		mode : 'remote',
		delay : 500,
		sortName : 'mig_dryrun_id',
		sortOrder : 'desc',
		pageSize : 5,
		pageList : [ 5, 10 ],
		columns : [ [
			{ title : 'ID', field : 'mig_dryrun_id',width : 90, sortable: true }, 
			{ title : 'Dry Run名称', field : 'mig_dryrun_name', width : 120, sortable: true }, 
			{ title : '备注', field : 'remark',  width : 300 } 
		] ],
        onChange: function(newValue, oldValue){
        	submitForm();
        }
	});
});
</script>
</head>
<body rightmargin="0" bottommargin="0" leftmargin="0" topmargin="0" class="easyui-layout">
    <div data-options="region:'north',border:true,split:true" style="height:95px;background:#B3DFDA;" title="DR RUNNING KPI--Search Condition" >
        <div style="padding:0px 0 0px 15px">  
        <form id="form" method="post">  
            <table>  
                <tr>
                	<td>Dryrun:</td>
					<td>
						<input id='dryrunId' name='dryrunId' />
					</td>
                    <td>Instance Name:</td>
                    <td>
                        <input id="jinsname" name="ins_name" value="" 
                        onkeydown="enterKeyDown(event)" style="width:100px;">
                    </td>
                    <td>Author:</td>
                    <td>
                        <input id="jauthor" name="author" value="" onkeydown="enterKeyDown(event)" style="width:100px;">
                    </td>
                	<td></td>
				</tr>
				<tr>
                    <td>Instance Status:</td>
                    <td>
                        <input class="easyui-combobox" 
		                        id='jstatus' name="status" value="" editable="false"
		                        data-options="valueField:'code', textField:'value',url:'../../cbb/dicCBBgetDicByType.action?dicType=job_status',
		                        method:'post',
        onChange: function(newValue, oldValue){
        	submitForm();
        }" 
		                        style="width:100px;">
                    </td>
                    <td>Instance Type:</td>
                    <td>
                    	<input class="easyui-combobox" 
	                        id='jtype' name="type" value="" editable="false"
	                        data-options="valueField:'code', textField:'value',
	                        data: jobType,
        onChange: function(newValue, oldValue){
        	submitForm();
        }"/>
                    </td>
                    <td></td>
                	<td></td>
                    <td>
                    	<div style="padding:0px 0 0px 15px">
                        	<a href="javascript:void(0)" class="easyui-linkbutton" iconCls="icon-search" onclick="submitForm()">Search</a>
                        	<a href="javascript:void(0)" class="easyui-linkbutton" iconCls="icon-clear" onclick="clearForm()">Clear</a>
                        </div>
                    </td>
                </tr>
            </table>
        </form>
        </div>
    </div>
    
    <div data-options="region:'center',border:false" title="" style="overflow:hidden;" noheader="true">
		<table id="grid"></table>
	</div>
</body>
</html>
