//连接发生错误的回调方法  
websocket.onerror = function() {  
	console.log("WebSocket连接发生错误");

websocket.onopen = function() {  
	console.log("WebSocket连接成功");

// 	console.log("yes!");

/** validate and assign value **/
function PackingParameter(){
	var dryrun_id = $("#dryrunId").combogrid('getValue');
	var job_ins_name = $('#jinsname').val();
	var type = $('#jtype').combobox("getValue");
	var author = $('#jauthor').val();
	var status = $('#jstatus').combobox('getValue');
	
	query.init();
	if(dryrun_id != ""){
		query.jdata.condition.dryrun_id = dryrun_id;
		query.jdata.operator.dryrun_id = OPE.EQUAL;
	}
	if(job_ins_name != ""){
		query.jdata.condition.job_ins_name = job_ins_name;
		query.jdata.operator.job_ins_name = OPE.CONTAIN;
	}
	if(type != "" && type != null){
		query.jdata.condition.type = type;
		query.jdata.operator.type = OPE.EQUAL;
	}
	if(author != ""){
		query.jdata.condition.author = author;
		query.jdata.operator.author = OPE.CONTAIN;
	}
	if(status != ""){
		query.jdata.condition["status"] = status;
		query.jdata.operator["status"] = OPE.EQUAL;
	}
	return true;
};

/** 启动作业  **/
function startJob(){
	var rows = $('#grid').datagrid('getSelections');
	if(rows.length!=1){
		alert("Please select one row!");
		return false;
	};
	var row = $('#grid').datagrid('getSelected');

	if (row && ( row.status == JSTATE.UNEXECUTE || row.status == JSTATE.PAUSE ) ) {
		app.selectedRow = row;
		
		var jdata = { jobId: row.job_id, job_ins_id: row.job_ins_id };
		$.ajax({
		   type: "POST",
		   url: "../../busi/migJobProcessBUSIstartJob.action",
		   async: false,
		   data: {
			   jdata: encodeURI( $.toJSON( jdata ) )
		   },
		   success: function(oResponse){
			   oResponse = eval("("+oResponse+")");
				alert( oResponse.msg );
				if (oResponse.success){
					$('#grid').datagrid('reload',{jdata: encodeURI( $.toJSON( query.jdata ) ) } );	// reload data
				}
		   }
		});
	}
};
