<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
<title>合法性稽核配置集合明细</title>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<link rel="stylesheet" type="text/css" href="../../scripts/jquery-easyui/1.4.1/themes/default/easyui.css"/>
<link rel="stylesheet" type="text/css" href="../../scripts/jquery-easyui/1.4.1/themes/icon.css"/>
<script type="text/javascript" src="../../scripts/jquery-easyui/1.4.1/jquery.min.js"></script>
<script type="text/javascript" src="../../scripts/jquery-easyui/1.4.1/jquery.easyui.min.js"></script>
<!-- <script type="text/javascript" src="../../scripts/jquery-easyui/1.4.1/locale/easyui-lang-zh_CN.js"></script> -->
<script type="text/javascript" src="../../scripts/json/jquery.json-2.2.min.js"></script>

<script type="text/javascript" src="../../scripts/jquery-easyui/1.4.1/plugins/easyuiExtends.js"></script>
<script type="text/javascript" src="../../scripts/virtue/virtue.js"></script>
<script type="text/javascript" src="../../scripts/utils/commonUtil.js"></script>

<script type="text/javascript">
var app = {};
var query = VIRTUE.query;
var noquery = VIRTUE.noquery;
var OPE = VIRTUE.operator;

var tableName = "mig_auditv_configcolldetail";

/** validate and assign value **/
function PackingParameter(){
	var formData = $('#s_form').form( 'getData');
	query.init();
	for (var field in formData) {
		if( formData[field] !== "" ){
			query.jdata.condition[field] = formData[field];
			query.jdata.operator[field] = OPE.CONTAIN;
		}
	}
	return true;
};

/** search data ,reload data  **/
function submitForm(){
   	if(!PackingParameter()){
   		return;
   	}
   	$('#grid').datagrid( 'reload', {
   		tableName : tableName,
   		jdata: encodeURI( $.toJSON( query.jdata ) ) 
   	} );
};
/**  清空  **/
function clearForm(){
	$('#s_form').form('clear');
};

function newRecord(){  //使用一个window
	var main_id = $('#main_id').combogrid('getValue');
	app.main_id = main_id;
	if(main_id==""){
		alert("请先在查询条件中选择配置集合！");
		return;
	}
	$('#win').dialog('open').dialog('setTitle', '添加');
	$('#win').dialog("refresh", "migAuditvConfig_main.html");
};

var del = {};
del.jdata = {act: "del",condition: { detail_id: "" },operator : {detail_id : 1} };
function destroyRecord(){
	var row = $('#grid').datagrid('getSelected');
	if (row){
		$.messager.confirm('确认','确认删除吗?',function(r){
			if (r){
				del.jdata.condition.detail_id = row.detail_id;
				$.post( getContextPath()+"/curd/commonCURDdelete.action", {
					tableName : tableName,
					jdata: encodeURI($.toJSON( del.jdata )) 
				}, function(result, status){
					alert(result.msg);
					if (result.success){
						$('#grid').datagrid('reload',{
							tableName : tableName,
							jdata: encodeURI( $.toJSON( query.jdata ) )
						} );	// reload data
					}
				});
			}
		});
	}
};

var toolbar = [{
	text:'添加',
	iconCls:'icon-add',
	handler:function(){
		newRecord();
	}
},{
	text:'删除',
	iconCls:'icon-remove',
	handler:function(){
		destroyRecord();
	}
}];

$(function(){
	$('#grid').datagrid({
		title : '',
		toolbar : toolbar,
		width : 938,
		height : 720,
		nowrap : true,
		striped : true,
		fit : true,
		collapsible : true,
		url: getContextPath()+"/query/migAuditvConfigJEasyUIQUERYdfind2.action",
		idField : "detail_id",
		remoteSort: true,
		multiSort : false,
		singleSelect : true,
		columns : [ [ 
			{ title : 'ID', field : 'detail_id',width : 90, sortable: true, hidden: true },
			{ title : '稽核code', field : 'audit_code', width : 120, sortable: true },
			{ title : '稽核项', field : 'audit_name', width : 120, sortable: true  },
			{ title : '域名', field : 'domain', width : 80, sortable: true }, 
			{ title : '表名称', field : 'table_name', width : 120, sortable: true  },
			{ title : '稽核源sql', field : 'src_audit_sql', width : 120  },
			{ title : '期望值', field : 'audit_value', width : 120  },
			{ title : '无效sql', field : 'invalid_data_sql', width : 120  },
			{ title : '操作符', field : 'operator', width : 120  },
			{ title : '稽核者', field : 'audit_author', width : 60  },
			{ title : '源连接串', field : 'src_db_connect', width : 120  }
		] ],
		pagination : true,
		rownumbers : false,
		queryParams : {
			tableName : tableName,
			jdata: encodeURI( $.toJSON( noquery.jdata ) ) 
		}
	});
	
	$('#main_id').combogrid({
		url : "../../query/commonCBBQUERYdfind.action",
		queryParams : {
			tableName : "mig_auditv_configcollmain",
			columns: "name"
		},
		panelWidth : 500,
		panelHeight : 200,
		idField : 'main_id',
		textField : 'name',
		pagination : true,
		fitColumns : false,
		required : true,
		rownumbers : true,
		mode : 'remote',
		delay : 500,
		sortName : 'name',
		sortOrder : 'asc',
		pageSize : 5,
		pageList : [ 5, 10 ],
		onSelect: function(index,row){
			submitForm();
		},
		columns : [ [
			{ title : 'ID', field : 'main_id',width : 90, sortable: true, hidden:true }, 
			{ title : '配置集合名称', field : 'name', width : 120, sortable: true }, 
			{ title : '备注', field : 'remark',  width : 300 } 
		] ]
	});
});

</script>
</head>
<body rightmargin="0" bottommargin="0" leftmargin="0" topmargin="0" class="easyui-layout">
    <div data-options="region:'north',border:true,split:true" style="height:66px;background:#B3DFDA;" title="查询条件" >  
        <div style="padding:0px 0 0px 15px">  
        <form id="s_form" method="post">  
            <table>  
                <tr>
                    <td>配置集合:</td>
                    <td>
                        <input id="main_id" name="main_id" value="">
                    </td>
                    <td>
                    	<div style="padding:0px 0 0px 15px">
                    		<input id='btnSearch' type='button' onclick="submitForm()" value='查 询'/>&nbsp;
							<input type='button' onclick="clearForm()" value='清 空'/>
                        </div>
                    </td>
                </tr>
            </table>
        </form>
        </div>
    </div>
    <div data-options="region:'center', border:false" title="" style="overflow:hidden;" noheader="true">
		<table id="grid"></table>
	</div>
	
	<div id="win" class="easyui-dialog" title="添加" style="width:800px;height:400px"  
        data-options="modal:true,closed:true,resizable:true,buttons: '#dlg-buttons'">
	</div>
	<div id="dlg-buttons">
		<a href="javascript:void(0)" class="easyui-linkbutton" onclick="javascript:alert('save')">Save</a>
		<a href="javascript:void(0)" class="easyui-linkbutton" onclick="javascript:$('#dlg').dialog('close')">Close</a>
	</div>
</body>
</html>
