		    			<td><input class="easyui-validatebox" type="text" id="faudit_dst_field_C" name="faudit_dst_field" data-options="required:true"></input></td>
		    		</tr>
		    		<tr>

		                        method:'post'">
		    			</td>
		    		</tr>
		    		<tr>
		    			<td>Status:</td>

		    				<select class="easyui-combobox" id="faudit_status_C" name="faudit_status" data-options="required:true">
	                        	<option value="0">Invalid</option>
	                        	<option value="1" selected="selected">Valid</option>
	                        </select>

		    </form>
		</div>
    </div>
<script type="text/javascript">
$(function(){
	$('#faudit_main_id_C').combogrid({
		url : "../../query/migAuditfMainCBBQUERYdfind.action",
		panelWidth : 500,
		panelHeight : 200,
		idField : 'faudit_id',
		textField : 'faudit_name',
		value : app.faudit_id,
		pagination : true,
		fitColumns : false,
		required : true,
		editable : false,
		rownumbers : true,
		mode : 'remote',
		delay : 500,
		sortName : 'faudit_name',
		sortOrder : 'asc',
		pageSize : 5,
		pageList : [ 5, 10 ],
		onLoadSuccess : function() {
			//注释掉，解决IE9下不显示的问题
// 			var g = $('#faudit_main_id_C').combogrid('grid');	// get datagrid object

// 			console.log(selrow);
// 			if(selrow==null){
// 				g.datagrid('insertRow',{
// 					index: 0,	// index start with 0
// 					row: app.auditMainRow
// 				});
// 			}
		},
		frozenColumns: [[ {
   			field : 'faudit_id',
   			title : 'ID',
   			width : 100,
   			hidden : true
   		}, {
   			field : 'faudit_name',
   			title : 'Audit Item',
   			width : 100,
   			sortable : true
	   	}]],
		columns : [ [ {
			field : 'faudit_srctable_name',
			title : 'Source Table',
			width : 100,
			sortable : true
		}, {
			field : 'faudit_dsttable_name',
			title : 'Target Table',
			width : 100,
			sortable : true
		}, {
			field : 'faudit_type',
			title : 'Audit Type',
			width : 100,
			sortable : true
		}, {
			field : 'faudit_group',
			title : 'Audit Group',
			width : 100,
			sortable : true
		}, {
			field : 'faudit_bussiness_cluster',
			title : 'Business Type',
			width : 100,
			sortable : true
		}, {
			field : 'faudit_status',
			title : 'Status',
			width : 100,
			sortable : true
		} ] ]
	});
});

var add = VIRTUE.add;

add.submitForm = function (){
	if( ! $('#c_form').form("validate") )
	{
		return;
	}
	
	var formData = $('#c_form').form( 'getData');
	add.init();
	for (var field in formData) {
		add.jdata.data[field] = formData[field];
	}

	jQuery.post( getContextPath()+"/curd/migAuditfSubCURDadd.action", 
		{
			tableName : tableName,
			jdata : encodeURI($.toJSON( add.jdata )) 
		},
		function(oResponse, status){
			alert(oResponse.msg);

			if(oResponse.success == true){
				$('#grid').datagrid('reload',{
					tableName : tableName,
					jdata: encodeURI($.toJSON( query.jdata ) ) 
				} );
				$('#win').window('close');
			}
	});
};
add.clearForm = function (){
	$('#c_form').form('clear');
};
</script>
	<div data-options="region:'south',border:false" style="text-align:right;padding:5px 5px 5px 0;background:#F4F4F4;">
		<a class="easyui-linkbutton" data-options="iconCls:'icon-ok'" href="javascript:void(0)" onclick="javascript:add.submitForm()" style="width:80px">Submit</a>
		<a class="easyui-linkbutton" data-options="iconCls:'icon-cancel'" href="javascript:void(0)" onclick="javascript:$('#win').dialog('close');" style="width:80px">Cancel</a>
