var query = VIRTUE.query;

var tableName = "MIG_AUDITF_MAIN";

var fAuditOpt = ajaxReqRespText("/cbb/dicCBBgetDic2ByType.action?dicType=opt" );
fAuditOpt = eval ("(" + fAuditOpt + ")");

var domains = ajaxReqRespText("/cbb/dicCBBgetDicByType.action?dicType=Busi-Domain");
	domains = eval("(" + domains + ")");

/** format field audit type **/
function fmtIsKey(n){
// 	n = new Number(n);
	switch(n){
		case 0: return 'N'; break;
		case 1: return 'Y'; break;
		default: return n;
	}
};
/** format field audit type **/
function fmtAuditStatus(n){
// 	n = new Number(n);
	switch(n){
		case 0: return 'Invalid'; break;
		case 1: return 'Valid'; break;
		default: return n;
	}
};

function enterKeyDown(event)
{
    if(event.keyCode==13)
    {
    	submitForm();
	}
};

/** validate and assign value **/
function PackingParameter(){	
	var formData = $('#s_form').form( 'getData');
	query.init();
	for (var field in formData) {
		if( formData[field] !== "" ){
			query.jdata.condition[field] = formData[field];
			if(field=="faudit_main_id"){
				query.jdata.operator[field] = OPE.EQUAL;
			}else{
				query.jdata.operator[field] = OPE.CONTAIN;
			}
		}
	}
	return true;
};

/** search data ,reload data  **/
function submitForm(){
   	if(!PackingParameter()){
   		return;
   	}
   	$('#grid').datagrid( 'reload', {
   		tableName : tableName,
   		jdata: encodeURI( $.toJSON( query.jdata ) ) 
   	} );
};
/**  清空  **/
function clearForm(){
	$('#s_form').form('clear');
};

function newRecord(){//使用一个window
	var faudit_main_id = $('#faudit_main_id').combogrid('getValue');
	app.faudit_id = faudit_main_id;
	if(faudit_main_id==""){
		alert("Please Select Audit Item First！");
		return;
	}
	$('#win').window('open').window('setTitle', 'New');
	$('#win').window("refresh", "migAuditfSub_add.html");
}

var read = {};
read.jdata = { act: "read",
		condition: {faudit_main_id: "", faudit_sub_index: ""}, 
		operator : {faudit_main_id : OPE.EQUAL, faudit_sub_index : OPE.EQUAL} 
	};
function editRecord() {
	var row = $('#grid').datagrid('getSelected');
	if (row) {
		read.jdata.condition.faudit_main_id = row.faudit_main_id;
		read.jdata.condition.faudit_sub_index = row.faudit_sub_index;
		$('#win').window('open').window('setTitle', 'Eidt');
		$('#win').window("refresh", getContextPath()+"/curd/migAuditfSubCURDinitModify.action?tableName="+tableName+"&jdata="+encodeURI($.toJSON( read.jdata )));
	}
}

function browseRecord() {
	var row = $('#grid').datagrid('getSelected');
	if (row) {
		$('#win').window('open').window('setTitle', 'View');
		read.jdata.condition.faudit_main_id = row.faudit_main_id;
		read.jdata.condition.faudit_sub_index = row.faudit_sub_index;
		$('#win').window("refresh", getContextPath()+"/curd/migAuditfSubCURDbrowse.action?tableName="+tableName+"&jdata="+encodeURI($.toJSON( read.jdata )));
	}
}

var del = {};
del.jdata = {act: "del",
		condition: {faudit_main_id: "", faudit_sub_index: ""}, 
		operator : {faudit_main_id : OPE.EQUAL, faudit_sub_index : OPE.EQUAL} 
	};
function destroyRecord(){
	var row = $('#grid').datagrid('getSelected');
	if (row){
		$.messager.confirm('Comfirm','Comfirm Remove?',function(r){
			if (r){
				del.jdata.condition.faudit_main_id = row.faudit_main_id;
				del.jdata.condition.faudit_sub_index = row.faudit_sub_index;
				$.post( getContextPath()+"/curd/migAuditfSubCURDdelete.action", {
					tableName : tableName,
					jdata: encodeURI($.toJSON( del.jdata )) 
				}, function(result, status){
					alert(result.msg);
					if (result.success){
						$('#grid').datagrid('reload',{
							tableName : tableName,
							jdata: encodeURI( $.toJSON( query.jdata ) )
						} );	// reload data
					}
				});
			}
		});
	}
};

var toolbar = [{
	text:'New Config',
	iconCls:'icon-add',
	handler:function(){
		newRecord();
	}
},{
	text:'Edit Config',
	iconCls:'icon-edit',
	handler:function(){
		editRecord();
	}
},{
	text:'Remove Config',
	iconCls:'icon-remove',
	handler:function(){
		destroyRecord();
	}
},{
	text:'View Config',
	iconCls:'icon-search',
	handler:function(){ 
		browseRecord(); 
	}
}];

	$('#grid').datagrid({
		title : 'Search Result',
		toolbar : toolbar,
		width : 938,

		nowrap : true,
		striped : true,
		fit : true,

		url: getContextPath()+"/query/migAuditfSubJEasyUIQUERYdfind.action",
		idField : "faudit_sub_index",
		remoteSort: true,
		multiSort : false,
		singleSelect : true,
		columns : [ [ 
			{ title : 'ID', field : 'faudit_main_id', width : 90, hidden: true }, 
			{ title : 'Index', field : 'faudit_sub_index', width : 60, sortable: true }, 
			{ title : 'Source Field', field : 'faudit_src_field',  width : 120, sortable: true },
			{ title : 'Target Field', field : 'faudit_dst_field',  width : 120, sortable: true },
			{ title : 'isKey', field : 'faudit_iskey',  width : 120, formatter: fmtIsKey },
			{ title : 'Fields Correlation', field : 'faudit_opt',  width : 120, formatter: function(value,row, index ){
// 				for(var el in fAuditOpt){
				for(var i=0, j=fAuditOpt.length; i<j; i++){
// 					console.log(fAuditOpt[i].code +"=="+ value+"?")
					if( fAuditOpt[i].code == value ){
						return fAuditOpt[i].value
					}
				}
			} },
			{ title : 'Create Time', field : 'faudit_createtime',  width : 130 },
			{ title : 'Last Modify Time', field : 'faudit_modifytime',  width : 130 },
			{ title : 'Status', field : 'faudit_status',  width : 120, formatter: fmtAuditStatus }
		] ],
		pagination : true,
		rownumbers : false,
		queryParams : {
			tableName : tableName,
			jdata: encodeURI( $.toJSON( noquery.jdata ) ) 
		}
	});
	
	$('#faudit_main_id').combogrid({

		panelWidth : 500,
		panelHeight : 200,
		idField : 'faudit_id',
		textField : 'faudit_name',
		pagination : true,
		fitColumns : false,
		required : true,
// 		editable : false,
		rownumbers : true,
		mode : 'remote',
		delay : 500,
		multiSort : true,
		sortName : 'domain,faudit_name',
		sortOrder : 'asc,asc',
		pageSize : 5,
		pageList : [ 5, 10 ],
		onSelect: function(index,row){
// 			alert("newValue:"+newValue+",oldValue:"+oldValue);
			var g = $('#faudit_main_id').combogrid('grid');	// get datagrid object
			app.auditMainRow = g.datagrid('getSelected');	// get the selected row
// 			console.log($.toJSON(app.auditMainRow) );
			submitForm();
		},
// 		frozenColumns: [],
		columns : [ [ 
        {
   			field : 'faudit_id',
   			title : 'ID',
   			width : 100,
   			hidden : true
   		}, {
   			field : 'domain',
   			title : 'Domain',
   			width : 100,
   			sortable : true, formatter: function(value,row, index ){
				for(var i=0, j=domains.length; i<j; i++){
					if( domains[i].code == value ){
						return domains[i].value;
					}
				}
				return value;
			} 
   		}, {

   			width : 100,
   			sortable : true
   		},{
			field : 'faudit_srctable_name',
			title : 'Source Table',
			width : 100,
			sortable : true
		}, {
			field : 'faudit_dsttable_name',
			title : 'Target Table',
			width : 100,
			sortable : true
		} ] ],
        onChange: function(newValue, oldValue){
        	submitForm();
        }
	});
});
