<script type="text/javascript">
var noquery = VIRTUE.noquery;
var query = VIRTUE.query;
var exp = VIRTUE.exp;
var imp = VIRTUE.imp;
var del = VIRTUE.del;
var read = VIRTUE.read;

var OPE = VIRTUE.operator;

function enterKeyDown(event)
{
    if(event.keyCode==13)
    {
    	submitForm();
	}
};
var db_type = ajaxReqRespText("/cbb/dicCBBgetDicByType2.action?dicType=db-type");
db_type = eval("(" + db_type + ")");
var MIG_GROUP = ajaxReqRespText("/cbb/dicCBBgetDicByType2.action?dicType=MIG_GROUP");
MIG_GROUP = eval("(" + MIG_GROUP + ")");
var MIG_MODE = ajaxReqRespText("/cbb/dicCBBgetDicByType2.action?dicType=MIG_MODE");
MIG_MODE = eval("(" + MIG_MODE + ")");

fmtdb_type = function(value,row, index ){
	for(var i=0, j=db_type.length; i<j; i++){
		if( db_type[i].id == value ){
			return db_type[i].text
		}
	}
	return value;
};
fmtMIG_GROUP = function(value,row, index ){
	for(var i=0, j=MIG_GROUP.length; i<j; i++){
		if( MIG_GROUP[i].id == value ){
			return MIG_GROUP[i].text
		}
	}
	return value;
};
fmtMIG_MODE = function(value,row, index ){
	for(var i=0, j=MIG_MODE.length; i<j; i++){
		if( MIG_MODE[i].id == value ){
			return MIG_MODE[i].text
		}
	}
	return value;
};
/** validate and assign value **/
function PackingParameter(){
	var formData = $('#s_form').form( 'getData');
	query.init();
	for (var field in formData) {
		if( formData[field] !== "" ){
// 			if( field=="supervisor_id" || field == "organization_id" || field == "age"){
// 				query.jdata.condition[field] = formData[field];
// 				query.jdata.operator[field] = OPE.EQUAL;
// 			}else{
				query.jdata.condition[field] = formData[field];
				query.jdata.operator[field] = OPE.CONTAIN;
// 			}
		}
	}
	exp.jdata.condition = query.jdata.condition;
	exp.jdata.operator = query.jdata.operator;
	return true;
};

/** search data ,reload data  **/
function submitForm(){
   	if(!PackingParameter()){
   		return;
   	}
   	$('#grid').datagrid( 'reload', { jdata: encodeURI( $.toJSON( query.jdata ) ) } );
};

/**  清空  **/
function clearForm(){
	$('#s_form').form('clear');
};

/** wizard import function */
var WIF = {};

/** Get import file extension name */
WIF.getIMPFileType4Wizard = function()
{
 	return getRadioValue("IMPFileType4Wizard");
};

/** Wizard import data, don't search   **/
WIF.importByWizard = function()
{
	var fileType = WIF.getIMPFileType4Wizard();
	var form = document.getElementById("IMPdlgForm");
	
	if(fileType == "xls")
	{
		form.action = "../../imp/tbPayerCommiInfoIMPimportXLS.action?_="+(new Date).getTime();
	}
	else if(fileType == "txt")
	{
		form.action = "../../imp/tbPayerCommiInfoIMPimportTXT.action?_="+(new Date).getTime();
	}

  	var customColumns = getCustomIMPColumns();
  	PackingIMPOptions();
  	
  	var j = document.createElement("input");
    j.type = "hidden";
    j.name = "customColumns";
    j.value = encodeURI($.toJSON( customColumns ) );
    form.appendChild(j);
      
  	var k = document.createElement("input");
    k.type = "hidden";
    k.name = "options";
    k.value = encodeURI($.toJSON( imp.Options ) );
    form.appendChild(k);
    
//  一提交disable和show的效果立马就不见了哦
    form.submit();
};

/** Packing custom export options  */
customDefineIMPOptions = function ()
{	
	imp.Options = {};
	var DateOrder = "MDY";
	var DateDelimiter = "/";
	var ZeroPaddingDate = true;
	var TimeDelimiter = ":";
	var DateTimeOrder = "DT";
	
	imp.Options.DateOrder = DateOrder;
	imp.Options.DateDelimiter = DateDelimiter;
	imp.Options.ZeroPaddingDate = ZeroPaddingDate;
	imp.Options.TimeDelimiter = TimeDelimiter;
	imp.Options.DateTimeOrder = DateTimeOrder;
}

/** Import file by selected file extension name  */
function importSimply()
{
	var upload = document.getElementById("upload4Simplely");
	if(upload.value=="")
	{
		alert("请选择文件 !");
		return;
	}
	$('#IMPdlg').dialog('close');
// 	alert("Path:"+upload.value);
	
	var fileType = getRadioValue("IMPFileType4Simplely");
	console.log("fileType:"+fileType);
	
	var form = document.getElementById("IMPdlg4S_Form");
	
	customDefineIMPOptions();
  	var k = document.createElement("input");
    k.type = "hidden";
    k.name = "options";
    k.value = encodeURI($.toJSON( imp.Options ) );
    form.appendChild(k);
	
	if(fileType == "xls")
	{
		form.action = "../../imp/migSyncConfigIMPimportXLS.action?_="+(new Date).getTime();
	}
	else if(fileType == "txt")
	{
		form.action = "../../imp/migSyncConfigIMPimportTXT.action?_="+(new Date).getTime();
	}
//  一提交disable和show的效果立马就不见了哦
	form.submit();
};

function newModule(){  //使用一个window
	$('#win').window('open').window('setTitle', '添加模块');
	$('#win').window("refresh", "tAuthorityModule_add.html");
};

function editModule() {
	var row = $('#grid').datagrid('getSelected');
	if (row) {
		$('#win').window('open').window('setTitle', '编辑模块');
		$('#win').window("refresh", "../../curd/tAuthorityModuleCURDinitModify.action?pojo.NMid="+row.id);
	}
};

function browseModule() {
	var row = $('#grid').datagrid('getSelected');
	if (row) {
		$('#win').window('open').window('setTitle', '浏览模块');
		read.init();
		read.jdata.condition.id = row.id;
		read.jdata.operator.id = OPE.EQUAL;
		$('#win').window("refresh", "../../curd/tAuthorityModuleCURDbrowse.action?jdata="+encodeURI($.toJSON( read.jdata )));
	}
};

//del.jdata = {act: "del",condition: { id: "" },operator : {nmid : 1} };
function destroyModule(){
	var row = $('#grid').datagrid('getSelected');
	if (row){
		$.messager.confirm('确认','确认删除吗?',function(r){
			if (r){
				del.init();
				del.jdata.condition.id = row.id;
				del.jdata.operator.id = OPE.EQUAL;
				$.post("../../curd/tAuthorityModuleCURDdelete.action", { jdata: encodeURI($.toJSON( del.jdata )) }, function(result, status){
					alert(result.msg);
					if (result.success){
						$('#grid').datagrid('reload',{jdata: encodeURI( $.toJSON( query.jdata ) ) } );	// reload data
					}
				});
			}
		});
	}
};

var toolbar = [{
	text:'添加',
	iconCls:'icon-add',
	disabled: true,
	handler:function(){ newModule(); }
},{
	text:'编辑',
	iconCls:'icon-edit',
	disabled: true,
	handler:function(){ editModule(); }
},{
	text:'删除',
	iconCls:'icon-remove',
	disabled: true,
	handler:function(){ destroyModule(); }
},{
	text:'查看',
	iconCls:'icon-search',
	disabled: true,
	handler:function(){ browseModule(); }
},{
	text:'导入',
	iconCls:'icon-import',
	disabled: false,
	handler:function(){ $('#IMPdlg_S2').dialog('open'); }
},{
	text:'导入向导',
	iconCls:'icon-import',
	disabled: true,
	handler:function(){ $("#IMPdlg1").dialog("open"); }
}];
//program component
$(function(){
	$('#grid').datagrid({
// 		title: '配置信息',
		//iconCls:'icon-reload',
		toolbar: toolbar,
		width: 938,
		height: 720,
		nowrap: true,
		striped: true,
		fit: true,
		collapsible: true,
		url: "../../query/migSyncConfigJEasyUIQUERYdfind.action",
		idField: "id",
		remoteSort: true,
		sortName:"mig_group",
		sortOrder:"desc",
		multiSort:true,
		singleSelect: true,
		frozenColumns: [[
            {title:'ID',field:"config_id", width:60, sortable: false, hidden: true },
   		    {title:'分组',field:"mig_group", width:90, sortable: true, formatter: fmtMIG_GROUP },
   		    {title:'表名',field:"mig_table", width:200, sortable: true }
   		]],
   		columns:[[
   			{title:'作者',field:"mig_author", width:80, sortable: true },
   			{title:'源类型',field:"src_type", width:80, sortable: true, formatter: fmtdb_type },
   		    {title:'源IP',field:"src_ip", width:120, sortable: true},
   		    {title:'源端口',field:"src_port", width:80, sortable: false },
   		    {title:'源Schema',field:"src_schema", width:80, sortable: true  },
   			{title:'源用户名',field:"src_user", width:80, sortable: false  },
   		    {title:'源密码',field:"src_password", width:80, sortable: false },
   		    {title:'迁移模式',field:"mig_mode", width:80, sortable: true, formatter: fmtMIG_MODE },
   		    {title:'目标类型',field: "dst_type", width: 80, formatter: fmtdb_type },
   		    {title:'目标IP',field:"dst_ip", width:120, sortable: false },
   		    {title:'目标端口',field:"dst_port", width:80 },
   		    {title:'目标Schema',field:"dst_schema", width:80, sortable: false },
   		    {title:'目标用户名',field:"dst_user", width:80, sortable: false },
   		    {title:'目标密码',field:"dst_password", width:80, sortable: false },
   		    {title:'过滤条件',field:"mig_where", width:120, sortable: true },
   		    {title:'备注',field:"mig_desc", width:120, sortable: true, hidden: false },
   		    {title:'创建时间',field:"mtime", width:130, sortable: true, hidden: false }
   		]],
		pagination:true,
		rownumbers:true,
		pageNumber: 1,
		pageSize: query.pageSize,
		queryParams:{jdata: encodeURI($.toJSON( noquery.jdata )) },
		onBeforeLoad:function(param){
// 			$('#btnSearch').linkbutton('disable');
			document.getElementById('btnSearch').disabled=true;
		},
		onLoadSuccess:function(){
// 			$('#btnSearch').linkbutton('enable');
			document.getElementById('btnSearch').disabled=false;
		}
	});
	var p = $('#grid').datagrid('getPager');
	if (p){
		$(p).pagination({
			//total:50,
			pageSize: query.pageSize,
			pageNumber:1,
			//pageList: [10,20,50,100],
			onBeforeRefresh:function(){
				//alert('before refresh');
			},
			onSelectPage:function(pageNumber, pageSize){
				$('#grid').datagrid("options").pageNumber=pageNumber;
				$('#grid').datagrid("options").pageSize=pageSize;
				$('#grid').datagrid('reload',{ jdata: encodeURI( $.toJSON( query.jdata ) ) } );
			}
		});
	}
});
</script>
