<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
<title>控件业务参数配置_outdatabase</title>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<link rel="stylesheet" type="text/css" href="../../scripts/jquery-easyui/1.4.1/themes/default/easyui.css"/>
<link rel="stylesheet" type="text/css" href="../../scripts/jquery-easyui/1.4.1/themes/icon.css"/>
<script type="text/javascript" src="../../scripts/jquery-easyui/1.4.1/jquery.min.js"></script>
<script type="text/javascript" src="../../scripts/jquery-easyui/1.4.1/jquery.easyui.min.js"></script>
<!-- <script type="text/javascript" src="../../scripts/jquery-easyui/1.4.1/locale/easyui-lang-zh_CN.js"></script> -->
<script type="text/javascript" src="../../scripts/json/jquery.json-2.2.min.js"></script>

<script type="text/javascript" src="../../scripts/jquery-easyui/1.4.1/plugins/easyuiExtends.js"></script>
<script type="text/javascript" src="../../scripts/virtue/virtue.js"></script>
<script type="text/javascript" src="../../scripts/utils/commonUtil.js"></script>

<script type="text/javascript">
var query = VIRTUE.query;
var OPE = VIRTUE.operator;

var tableName = "mig_task_config";

var configType = ajaxReqRespText("/cbb/dicCBBgetDicByType.action?dicType=config_type" );
configType = eval ("(" + configType + ")");
var recordStatus = ajaxReqRespText("/cbb/dicCBBgetDicByType.action?dicType=record_status" );
recordStatus = eval ("(" + recordStatus + ")");
var domains = ajaxReqRespText("/cbb/dicCBBgetDicByType.action?dicType=Busi-Domain");
	domains = eval("(" + domains + ")");

VIRTUE.query.jdata = { act: VIRTUE.act.QUERY, condition:  {mig_config_type:4}, operator : {mig_config_type: OPE.EQUAL} };
VIRTUE.query.init = function(){
	VIRTUE.query.jdata = { act: VIRTUE.act.QUERY, condition: {mig_config_type:4}, operator : {mig_config_type: OPE.EQUAL} };
};

/** validate and assign value **/
function PackingParameter(){
	var formData = $('#s_form').form( 'getData');
	query.init();
	for (var field in formData) {
		if( formData[field] !== "" ){
			query.jdata.condition[field] = formData[field];
			query.jdata.operator[field] = OPE.CONTAIN;
		}
	}
	return true;
};

/** search data ,reload data  **/
function submitForm(){
   	if(!PackingParameter()){
   		return;
   	}
   	$('#grid').datagrid( 'reload', {
   		tableName : tableName,
   		jdata: encodeURI( $.toJSON( query.jdata ) ) 
   	} );
};
/**  清空  **/
function clearForm(){
	$('#s_form').form('clear');
};

function newRecord(){  //使用一个window
	$('#win').window('open').window('setTitle', 'New');
	$('#win').window("refresh", "migTaskConfig_add.html");
};

var read = {};
read.jdata = { act: "read",condition: {mig_config_id: ""}, operator : {mig_config_id:1} };
function editRecord() {
	var row = $('#grid').datagrid('getSelected');
	if (row) {
		read.jdata.condition.mig_config_id = row.mig_config_id;
		$('#win').window('open').window('setTitle', 'Edit');
		$('#win').window("refresh", getContextPath()+"/curd/commonCURDinitModify2.action?foldName=migTaskConfig_OutDataBase"
				+"&frontPageName=migTaskConfig_OutDataBase_modify&tableName="+tableName+"&jdata="+encodeURI($.toJSON( read.jdata )));
	}
};

function browseRecord() {
	var row = $('#grid').datagrid('getSelected');
	if (row) {
		$('#win').window('open').window('setTitle', 'View');
		read.jdata.condition.mig_config_id = row.mig_config_id;
		var readSQLName = "read_TaskConfig";
		$('#win').window("refresh", getContextPath()+"/curd/commonCURDbrowse2.action?foldName=migTaskConfig_OutDataBase"
				+"&frontPageName=migTaskConfig_OutDataBase_browse&tableName="+tableName+"&readSQLName="+readSQLName+"&jdata="+encodeURI($.toJSON( read.jdata )));
	}
};

var del = {};
del.jdata = {act: "del",condition: { mig_config_id: "" },operator : {mig_config_id : 1} };
function destroyRecord(){
	var row = $('#grid').datagrid('getSelected');
	if (row){
		$.messager.confirm('Confirm','Confirm Remove?',function(r){
			if (r){
				del.jdata.condition.mig_config_id = row.mig_config_id;
				$.post( getContextPath()+"/curd/commonCURDdelete.action", {
					tableName : tableName,
					jdata: encodeURI($.toJSON( del.jdata )) 
				}, function(result, status){
					alert(result.msg);
					if (result.success){
						$('#grid').datagrid('reload',{
							tableName : tableName,
							jdata: encodeURI( $.toJSON( query.jdata ) )
						} );	// reload data
					}
				});
			}
		});
	}
};

var toolbar = [{
	text:'New Config',
	iconCls:'icon-add',
	handler:function(){
		newRecord();
	}
},{
	text:'Edit Config',
	iconCls:'icon-edit',
	handler:function(){
		editRecord();
	}
},{
	text:'Remove Config',
	iconCls:'icon-remove',
	handler:function(){
		destroyRecord();
	}
},{
	text:'View Config',
	iconCls:'icon-search',
	handler:function(){ 
		browseRecord(); 
	}
}];

$(function(){
	$('#grid').datagrid({
		title : 'Search Result',
		toolbar : toolbar,
		width : 938,
		height : 720,
		nowrap : true,
		striped : true,
		fit : true,
		collapsible : true,
		url: getContextPath()+"/query/commonJEasyUIQUERYdfind.action",
		idField : "mig_config_id",
		remoteSort: true,
		multiSort : false,
		singleSelect : true,
		columns : [ [
			{ title : 'ID', field : 'mig_config_id',width : 90, sortable: true, hidden: true }, 
			{ title : 'Config Type', field : 'mig_config_type', width : 110, sortable: true, formatter: function(value,row, index ){
				for(var i=0, j=configType.length; i<j; i++){
					if( configType[i].code == value ){
						return configType[i].value
					}
				}
				return value;
			}, hidden: true },
			{ title : 'Domain', field : 'domain',  width :100, sortable: true, formatter: function(value,row, index ){
				for(var i=0, j=domains.length; i<j; i++){
					if( domains[i].code == value ){
						return domains[i].value;
					}
				}
				return value;
			} },
			{ title : 'Source Table Name', field : 'mig_src',  width : 160, sortable: true },
			{ title : 'Source DB Connection URL', field : 'mig_src_conn',  width : 300 },
			{ title : 'Filter Condition', field : 'mig_where',  width : 200 },
			{ title : 'Target Table Name', field : 'mig_dst',  width : 160 },
			{ title : 'Target DB Connection URL', field : 'mig_dst_conn',  width : 300 },
			{ title : 'Author', field : 'mig_author',  width : 80 },
			{ title : 'Description', field : 'mig_desc',  width : 130 },
			{ title : 'Last Update Time', field : 'mig_modifytime',  width : 130 },
			{ title : 'Record Status', field : 'mig_status',  width : 90, formatter: function(value,row, index ){
				for(var i=0, j=recordStatus.length; i<j; i++){
					if( recordStatus[i].code == value ){
						return recordStatus[i].value
					}
				}
				return value;
			}}
		] ],	  
		pagination : true,
		rownumbers : false,
		queryParams : {
			tableName : tableName,
			jdata: encodeURI( $.toJSON( query.jdata ) ) 
		}
	});
});

</script>
</head>
<!-- 92px 118px -->
<body rightmargin="0" bottommargin="0" leftmargin="0" topmargin="0" class="easyui-layout">
    <div data-options="region:'north',border:true,split:true" style="height:92px;background:#B3DFDA;" title="Search Condition" >  
        <form id="s_form" method="post" style="margin:0;padding:0;">
        <div style="padding:0px 0 0px 15px">
            <table width="100%">
                <tr>
                    <td>Config Type:</td>
                    <td>
                        <input class="easyui-combobox" 
		                        id='mig_config_type' name="mig_config_type"
		                        data-options="valueField:'code', textField:'value',
		                        value:4,readonly:true,
		                        editable:false,
								data:configType,
		                        method:'post'"/>
                    </td>
                    <td>Domain:</td>
                    <td>
                        <input class="easyui-combobox" 
		                        id='domain' name="domain" value="" 
		                        data-options="valueField:'code', textField:'value',
		                        editable:false,
								data: domains"/>
                    </td>
                    <td>Source File/Table:</td>
                    <td>
                        <input id="mig_src" name="mig_src" value="">
                    </td>
                    <td>Record Status:</td>
                    <td>
                        <input class="easyui-combobox" 
		                        id='mig_status' name="mig_status" value="" 
		                        data-options="valueField:'code', textField:'value',
		                        editable:false,
								data:recordStatus,
		                        method:'post'"/>
                    </td>
                </tr>
            </table>
        </div>
        <table width="100%" border="0" align="center">
			<tr bgcolor="#E2EEFE" valign="bottom">
				<td height="23"><div align="center"><!-- default height='21'  -->
					<a class="easyui-linkbutton" data-options="iconCls:'icon-search'" href="javascript:void(0)" 
               		onclick="submitForm()" style="width:80px">Submit</a>&nbsp;&nbsp;
<!--                		<a class="easyui-linkbutton" data-options="iconCls:'icon-clear'" href="javascript:void(0)"  -->
<!--                		onclick="clearForm()" style="width:80px">Clear</a> -->
				</div></td>
			</tr>
		</table>
		</form>
    </div>
    <div data-options="region:'center', border:false" title="" style="overflow:hidden;" noheader="true">
		<table id="grid"></table>
	</div>
	
	<div id="win" class="easyui-window" title="新建" style="width:600px;height:400px"  
        data-options="modal:true,closed:true">
	</div>
</body>
</html>
