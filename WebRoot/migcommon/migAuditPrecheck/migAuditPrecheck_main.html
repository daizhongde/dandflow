<head>

<script type="text/javascript">
var app = {};
				
var query = VIRTUE.query;
var exp = VIRTUE.exp;
var noquery = VIRTUE.noquery;
var OPE = VIRTUE.operator;

//actually this variable is not used in background. When we use common query interface, we need define this.
var tableName = "mig_data_precheck";

var dryrun = ajaxReqRespText2("/cbb/commonCBBdfind.action", { tableName : "v_dryrun_config",
	sort:"mig_dryrun_id",
	order:"desc"});
dryrun = eval ("(" + dryrun + ")");

var env = ajaxReqRespText("/cbb/dicCBBgetDicByType.action?dicType=DB-Env");
env = eval("(" + env + ")");

var auditType = ajaxReqRespText("/cbb/dicCBBgetDicByType.action?dicType=Audit-Type");
auditType = eval("(" + auditType + ")");

var auditMode = ajaxReqRespText("/cbb/dicCBBgetDicByType.action?dicType=Audit-Mode");
auditMode = eval("(" + auditMode + ")");

fmtDryrun = function(value,row, index ){
	for(var i=0, j=dryrun.length; i<j; i++){
		if( dryrun[i].mig_dryrun_id == value ){
			return dryrun[i].mig_dryrun_name
		}
	}
	return value;
};

fmtEnv = function(value,row, index ){
	for(var i=0, j=env.length; i<j; i++){
		if( env[i].code == value ){
			return env[i].value;
		}
	}
	return value;
};
fmtAuditType = function(value,row, index ){
	for(var i=0, j=auditType.length; i<j; i++){
		if( auditType[i].code == value ){
			return auditType[i].value
		}
	}
	return value;
};
fmtAuditMode = function(value,row, index ){
	for(var i=0, j=auditMode.length; i<j; i++){
		if( auditMode[i].code == value ){
			return auditMode[i].value
		}
	}
	return value;
};

function enterKeyDown(event)
{
    if(event.keyCode==13)
    {
    	submitForm();
	}
};

/**
 * @param value 34.34
 * @returns 34.34%

function fmtRate(value){
	if(isNvl(value)){
		return "";
	}
	return new String(value)+"%";
}; */

/** validate and assign value **/
function PackingParameter(){
	var formData = $('#s_form').form( 'getData');
	query.init();
	for (var field in formData) {
		if( formData[field] != "" ){
			query.jdata.condition[field] = formData[field];
			query.jdata.operator[field] = OPE.EQUAL;
			if(field=='audit_object'){
				query.jdata.operator[field] = OPE.CONTAIN;
			}
		}
	}
	exp.jdata.condition = query.jdata.condition;
	exp.jdata.operator = query.jdata.operator;
	return true;
};

/** search data ,reload data  **/
function submitForm(){
   	if(!PackingParameter()){
   		return;
   	}
   	$('#grid').datagrid( 'reload', {
//    		tableName : tableName,
   		jdata: encodeURI( $.toJSON( query.jdata ) ) 
   	} );
};
/**  清空  **/
function clearForm(){
	$('#s_form').form('clear');
};
/** Export file by selected file extension name  */
function exportSimply()
{
	//You must Packing parameter at last
	if(!PackingParameter()){
   		return;
   	}
	
	var form = document.createElement("form");
	form.action = "../../exp/migAuditPrecheckEXPexportXLS.action?_="+(new Date).getTime();
	
    document.body.appendChild(form);
    var i = document.createElement("input");
    i.type = "hidden";
    i.name = "jdata";
    i.value = encodeURI($.toJSON( exp.jdata ) );
    form.appendChild(i);

    form.method = "post";
    
//  一提交disable和show的效果立马就不见了哦
    form.submit();
};
var read = {};
read.jdata = { act: "read",
		condition: {faudit_main_id: "", faudit_sub_index: ""}, 
		operator : {faudit_main_id : OPE.EQUAL, faudit_sub_index : OPE.EQUAL} 
	};

function browseRecord() {
	var row = $('#grid').datagrid('getSelected');
	if (row) {
		$('#win').window('open').window('setTitle', 'View');
		read.jdata.condition.faudit_main_id = row.faudit_main_id;
		read.jdata.condition.faudit_sub_index = row.faudit_sub_index;
		$('#win').window("refresh", getContextPath()+"/curd/migAuditPrecheckCURDbrowse.action?jdata="+encodeURI($.toJSON( read.jdata )));
	}
};

var toolbar = [{
	text:'查看',
	iconCls:'icon-search',
	disabled: true,
	handler:function(){
		browseRecord(); 
	}
}];

$(function(){
	$('#grid').datagrid({
		title : 'Search Result',
// 		toolbar : toolbar,
		width : 938,
		height : 720,
		nowrap : true,
		striped : true,
		fit : true,
		collapsible : true,
		url: getContextPath()+"/query/migAuditPrecheckJEasyUIQUERYdfind.action",
		idField : "audit_id",
		remoteSort: true,
		multiSort : false,
		singleSelect : true,
		frozenColumns: [[
		  { field : 'audit_id', title : 'Audit Id', width : 60, hidden : true },
		  { field : 'audit_schema', title : 'Audit Schema', width : 60, sortable : true },
		  { field : 'audit_env', title : 'Environment', width : 80, sortable: true, formatter: fmtEnv },
		  { field : 'audit_type', title : 'Audit Type', width : 110, sortable : true, formatter: fmtAuditType }, 
		  { field : 'audit_mode', title : 'Compare Mode', width : 120, sortable: true, formatter: fmtAuditMode }, 
		  { field : 'audit_object', title : 'Audit Object', width : 200, sortable: true }
   		]],
		columns : [ [ //, formatter: fmtIsKey
		  { field : 'dryrun_front', title : 'Front Dryrun', width : 80, sortable : true, formatter: fmtDryrun },
		  { field : 'dryrun_back', title : 'Back Dryrun', width : 80, sortable : true, formatter: fmtDryrun },
		  { field : 'count_front', title : 'Front Count', width : 80, align: 'right', sortable : true },
		  { field : 'count_back', title : 'Back Count', width : 80, align: 'right', sortable : true },
		  { field : 'diff_ratio', title : 'Diff Ratio', width : 80, align: 'right',formatter: fmtRate, sortable : true },
		  { field : 'audit_date', title : 'Audit Date', width : 130, sortable : true }
		] ],
		pagination : true,
		rownumbers : false,
		queryParams : {
// 			tableName : tableName,
			jdata: encodeURI( $.toJSON( noquery.jdata ) ) 
		}
	});
	
	$('#dryrun_front').combogrid({
		url : "../../query/commonCBBQUERYdfind.action",
		queryParams : {
			tableName : "v_dryrun_config",
			columns: "mig_dryrun_name"
		},
		panelWidth : 500,
		panelHeight : 200,
		idField : 'mig_dryrun_id',
		textField : 'mig_dryrun_name',
		pagination : true,
		fitColumns : false,
		required : true,
		rownumbers : true,
		mode : 'remote',
		delay : 500,
		sortName : 'mig_dryrun_id',
		sortOrder : 'desc',
		pageSize : 5,
		pageList : [ 5, 10 ],
		onSelect: function(index,row){
			submitForm();
		},
		columns : [ [
			{ title : 'ID', field : 'mig_dryrun_id',width : 90, sortable: true }, 
			{ title : 'Dry Run', field : 'mig_dryrun_name', width : 120, sortable: true }, 
			{ title : 'Description', field : 'remark',  width : 300 } 
		] ],
        onChange: function(newValue, oldValue){
        	submitForm();
        }
	});
	$('#dryrun_back').combogrid({
		url : "../../query/commonCBBQUERYdfind.action",
		queryParams : {
			tableName : "v_dryrun_config",
			columns: "mig_dryrun_name"
		},
		panelWidth : 500,
		panelHeight : 200,
		idField : 'mig_dryrun_id',
		textField : 'mig_dryrun_name',
		pagination : true,
		fitColumns : false,
		required : true,
		rownumbers : true,
		mode : 'remote',
		delay : 500,
		sortName : 'mig_dryrun_id',
		sortOrder : 'desc',
		pageSize : 5,
		pageList : [ 5, 10 ],
		onSelect: function(index,row){
			submitForm();
		},
		columns : [ [
			{ title : 'ID', field : 'mig_dryrun_id',width : 90, sortable: true }, 
			{ title : 'Dry Run', field : 'mig_dryrun_name', width : 120, sortable: true }, 
			{ title : 'Description', field : 'remark',  width : 300 } 
		] ],
        onChange: function(newValue, oldValue){
        	submitForm();
        }
	});
});
</script>
</head>
<body rightmargin="0" bottommargin="0" leftmargin="0" topmargin="0" class="easyui-layout">
    <div data-options="region:'north',border:true,split:true" style="height:122px;background:#B3DFDA;" title="(CA)Audit Report--Search Condition" >  
        <form id="s_form" method="post" style="margin:0;padding:0;">
        <div style="padding:0px 0 0px 15px">
            <table width="100%"> 
                <tr>
                    <td>Front Dryrun:</td>
                    <td>
                        <input id="dryrun_front" name="dryrun_front" value="">
                    </td>
                    <td>Back Dryrun:</td>
                    <td>
                        <input id="dryrun_back" name="dryrun_back" value="">
                    </td>
                    <td>Environment:</td>
                    <td>
                    	<input class="easyui-combobox"
		                        id='audit_env' name="audit_env" value=""

								url:'../../cbb/dicCBBgetDicByType.action?dicType=DB-Env',
                        onChange: function(newValue, oldValue){
                        	submitForm();
                        }"/>
                    </td>
                    <td>Audit Type:</td>
                    <td>
                    	<input class="easyui-combobox"
		                        id='audit_type' name="audit_type" value="" 
		                        data-options="valueField:'code', textField:'value',
		                        editable:false,
								url:'../../cbb/dicCBBgetDicByType.action?dicType=Audit-Type',
                        onChange: function(newValue, oldValue){
                        	submitForm();
                        }"/>
                    </td>
                </tr>
                <tr>
                	<td>Audit Mode:</td>
                    <td>
                    	<input class="easyui-combobox"
		                        id='audit_mode' name="audit_mode" value="" 
		                        data-options="valueField:'code', textField:'value',
		                        editable:false,
								url:'../../cbb/dicCBBgetDicByType.action?dicType=Audit-Mode',
                        onChange: function(newValue, oldValue){
                        	submitForm();
                        }"/>
                    </td>
                    <td>Audit Object:</td>
                    <td>
                        <input id="audit_object" name="audit_object" value="" onkeydown="enterKeyDown(event)"/>
                    </td>
                    <!-- Add By Rita.Zhou -->
                    <td>Audit Schema:</td>
                    <td>
<!--                     <input class="easyui-combobox"  -->
<!-- 		                        id='audit_schema' name="audit_schema" value=""  -->
<!-- 		                        data-options="valueField:'id', textField:'text', -->
<!-- 		                        editable:false, -->
<!-- 		                        //url:'../../cbb/commonCBBdfind.action?columnNames=schema_name&tableName=INFORMATION_SCHEMA.SCHEMATA', -->
<!-- 		                        url:'../../cbb/dicCBBgetDicOfSchema.action', -->
<!--                         	onChange: function(newValue, oldValue){ -->
<!--                         	submitForm(); -->
<!--                         }"/> -->
                    	<input id="audit_schema" name="audit_schema" value="" onkeydown="enterKeyDown(event)"/>
                    </td>
                    <!-- ----- -->
                    <td></td>
                    <td>
                    </td>
                </tr>
            </table>
        </div>
        <table width="100%" border="0" align="center">
			<tr bgcolor="#E2EEFE" valign="bottom">
				<td height="23"><div align="center"><!-- default height='21'  -->
					<a class="easyui-linkbutton" data-options="iconCls:'icon-search'" href="javascript:void(0)" 
               		onclick="submitForm()" style="width:80px">Submit</a>&nbsp;&nbsp;
<!--                		<a class="easyui-linkbutton" data-options="iconCls:'icon-print'" href="javascript:void(0)"  -->
<!--                		onclick="PrintOneURL()" style="width:80px">Print</a>&nbsp;&nbsp; -->
               		
               		<a class="easyui-linkbutton" data-options="iconCls:'icon-export'" href="javascript:void(0)" 
               		onclick="exportSimply()" style="width:80px">Export</a>&nbsp;&nbsp;
               		<a class="easyui-linkbutton" data-options="iconCls:'icon-clear'" href="javascript:void(0)" 
               		onclick="clearForm()" style="width:80px">Clear</a>
				</div></td>
			</tr>
		</table>
		</form>
    </div>
    <div data-options="region:'center', border:false" title="" style="overflow:hidden;" noheader="true">
		<table id="grid"></table>
	</div>
	
	<div id="win" class="easyui-window" title="添加" style="width:600px;height:400px"  
        data-options="modal:true,closed:true">
	</div>
</body>
