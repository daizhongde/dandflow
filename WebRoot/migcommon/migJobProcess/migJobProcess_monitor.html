<script type="text/javascript">
var id = getUrlParam("id"), jid = getUrlParam("jid");
console.log("id:"+id+",jid:"+jid);
var interval = 3;// unit is second
/**       websocket js begin         */    
var websocket = null;  
var username = "daizd";
     
//判断当前浏览器是否支持WebSocket  
if ('WebSocket' in window) {
	var url = "ws://" + document.location.host + "/migration/websocket/runningTask/" + username + "/";
// 	console.log(url);
    websocket = new WebSocket(url);  
} else {  
    alert('当前浏览器 Not support websocket')  
}  
  
//连接发生错误的回调方法  
websocket.onerror = function() {  
	console.log("WebSocket连接发生错误");  
};  
  
//连接成功建立的回调方法  
websocket.onopen = function() {  
	console.log("WebSocket连接成功");
}

//接收到消息的回调方法  
websocket.onmessage = function(event) {
// 	console.log("yes!");
    setMessageInnerHTML(event.data);  
}

//连接关闭的回调方法  
websocket.onclose = function() {  
	console.log("WebSocket连接关闭");
}

//监听窗口关闭事件，当窗口关闭时，主动去关闭websocket连接，防止连接还没断开就关闭窗口，server端会抛异常。  
window.onbeforeunload = function() {  
    closeWebSocket();  
}
function setMessageInnerHTML(msg){
	 //do something
// 	 console.log("msg:"+jQuery.parseJSON( msg ));
	 $('#grid').datagrid( 'loadData', jQuery.parseJSON( msg ));
	 /* 页面间隔发起sendMessage 触发服务端推送 */
	 setTimeout("sendMessage()", interval*1000);
};
//关闭WebSocket连接  
function closeWebSocket() {
    websocket.close();  
}
function sendMessage() {
	var options = $('#grid').datagrid('options');
// 	var jdata  = options.queryParams.jdata;
// 	var page = options.pageNumber;
// 	var rows = options.pageSize;
// 	var sort = options.sortName;
// 	var order = options.sortOrder;
// 	console.log($.toJSON(options));
	websocket.send($.toJSON(options));  
}  
   
/**       websocket js end         */   
    
/** virtue js begin   */
var noquery = VIRTUE.noquery;
var query = VIRTUE.query;
var OPE = VIRTUE.operator;

var app={};
app.selectedRow = {};//记录数据表格中选择中的行

var jobType = ajaxReqRespText("/cbb/dicCBBgetDicByType.action?dicType=job_type" );
jobType = eval ("(" + jobType + ")");

var author = ajaxReqRespText("/common/commonCommoncurrentUserLogname.action");

/* instance type : general
 * status: not in init,finish, PAUSE
  		 	in  EXECUTING   PAUSING_MANUAL  ERROR
   */
query.jdata.condition["job_ins_id"] = id;
query.jdata.operator["job_ins_id"] = OPE.EQUAL;
	
query.jdata.condition["status"] = [JSTATE.EXECUTING, JSTATE.PAUSING_MANUAL, JSTATE.ERROR];
query.jdata.operator["status"] = OPE.IN;

query.jdata.condition["isleaf"] = 1;
query.jdata.operator["isleaf"] = OPE.EQUAL;

/** validate and assign value **/
function PackingParameter(){
	var isleaf = $('#isleaf').combobox("getValue");
	
	query.init();
	if(isleaf != "" && isleaf != null){
		query.jdata.condition.isleaf = isleaf;
		query.jdata.operator.isleaf = OPE.EQUAL;
	}
	query.jdata.condition["job_ins_id"] = id;
	query.jdata.operator["job_ins_id"] = OPE.EQUAL;
		
	query.jdata.condition["status"] = [JSTATE.EXECUTING, JSTATE.PAUSING_MANUAL, JSTATE.ERROR];
	query.jdata.operator["status"] = OPE.IN;
	

	
	return true;
};

/** search data ,reload data  **/
function submitForm(){
   	if(!PackingParameter()){
   		return;
   	}
   	$('#grid').datagrid( 'reload', { jdata: encodeURI( $.toJSON( query.jdata ) ) } );
};
/**  清空  **/
function clearForm(){
	$('#s_form').form('clear');
};

/** format level **/
function fmtStatus(n,row,index){
	n = new String(n);
	if(n=='0'){
		return JSTATENAME[n]==undefined ? n : JSTATENAME[n];
	}else{
		return "<img src='../../images/job/"+PSTATEICON[n]+"'  alt='alt' />"+(JSTATENAME[n]==undefined ? n : JSTATENAME[n]);
	}
};

//program component

	$('#grid').datagrid({

				return '<span class="tree-icon tree-folder '+clazz+'"></span><span class="tree-title">'+value+'</span>';

					//styler
					//return 'background-color:#ffee00;color:red;';
					// the function can return predefined css class and inline style
					// return {class:'c1',style:'color:red'}
			}},
		    {title :'Com ID',field:"com_id", width:120, sortable: true},
		    {title:'Status',field:"status",width:100, formatter: fmtStatus,sortable: true },
// 		    {title:'Instance Type',field:"type", width:120, sortable: true, formatter: function(value,row, index ){
// 				for(var i=0, j=jobType.length; i<j; i++){
// 					if( jobType[i].code == value ){

// 				}
// 			} },

			{title:'Node Desc',field:"node_remark",width:280 },
			{title:'Author',field:"author",width:80, sortable: true  },
		    {title:'Description',field:"remark",width:280 },
		    {title:'Begin Time',field:"begin_time",width:150, sortable: true }
		]],
		rownumbers:true,
		pagination:true,
		pageSize: 20,
		queryParams:{
			jdata: encodeURI($.toJSON( query.jdata )) 
		},
		onLoadSuccess: function(pageNumber, pageSize){
			$('#grid').datagrid('clearSelections');
		}
	});

});
