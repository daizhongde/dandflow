<script type="text/javascript">
var add = VIRTUE.add;

add.submitForm = function (){
	if( ! $('#c_form').form("validate") )
	{
		return;
	}
	
	var formData = $('#c_form').form( 'getData');
	add.init();
	for (var field in formData) {
		add.jdata.data[field] = formData[field];
	}
	
	jQuery.post( getContextPath()+"/curd/migAuditfMainCURDadd.action", 
		{
			tableName : tableName,

add.clearForm = function (){
	$('#c_form').form('clear');
};

add.open_dialog_srcconn = function(){
	var mig_src_conn = $('#faudit_srctable_conn_C').combo( 'getValue' );	
	if( mig_src_conn != '' ){
		var temp = mig_src_conn.split(/\|/);
		if(temp.length==5){
			$('#dbtype_C').combobox("setValue", temp[0] );
			$('#ip_C').textbox("setValue", temp[1]);
			$('#username_C').textbox("setValue", temp[2]);
			$('#password_C').textbox("setValue", temp[3]);
			$('#instance_C').textbox("setValue", temp[4]);
		}
	}
	$('#dlg-migsrcconn').dialog('open');
};
add.open_dialog_dstconn = function(){
	var mig_dst_conn = $('#faudit_dsttable_conn_C').combo( 'getValue' );	
	if( mig_dst_conn != '' ){
		var temp = mig_dst_conn.split(/\|/);
		if(temp.length==5){
			$('#dbtype2_C').combobox("setValue", temp[0] );
			$('#ip2_C').textbox("setValue", temp[1]);
			$('#username2_C').textbox("setValue", temp[2]);
