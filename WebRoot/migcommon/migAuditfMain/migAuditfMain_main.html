<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
<title>稽核项定义</title>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<link rel="stylesheet" type="text/css" href="../../scripts/jquery-easyui/1.4.1/themes/default/easyui.css"/>
<link rel="stylesheet" type="text/css" href="../../scripts/jquery-easyui/1.4.1/themes/icon.css"/>
<script type="text/javascript" src="../../scripts/jquery-easyui/1.4.1/jquery.min.js"></script>
<script type="text/javascript" src="../../scripts/jquery-easyui/1.4.1/jquery.easyui.min.js"></script>
<!-- <script type="text/javascript" src="../../scripts/jquery-easyui/1.4.1/locale/easyui-lang-zh_CN.js"></script> -->
<script type="text/javascript" src="../../scripts/json/jquery.json-2.2.min.js"></script>

<script type="text/javascript" src="../../scripts/jquery-easyui/1.4.1/plugins/easyuiExtends.js"></script>
<!-- <script type="text/javascript" src="../../scripts/jeasyui-extensions/jquery.jdirk.js"></script> -->
<!-- <script type="text/javascript" src="../../scripts/jeasyui-extensions/jeasyui.extensions.js"></script> -->
<!-- <script type="text/javascript" src="../../scripts/jeasyui-extensions/jeasyui.extensions.form.js"></script> -->
<script type="text/javascript" src="../../scripts/virtue/virtue.js"></script>
<script type="text/javascript" src="../../scripts/utils/commonUtil.js"></script>

<script type="text/javascript">
var query = VIRTUE.query;
var OPE = VIRTUE.operator;

var tableName = "MIG_AUDITF_MAIN";

var fAuditTypeData = ajaxReqRespText("/cbb/dicCBBgetDicByType.action?dicType=audit_type" );
fAuditTypeData = eval ("(" + fAuditTypeData + ")");

var fAuditStatusData = ajaxReqRespText("/cbb/dicCBBgetDicByType.action?dicType=audit_status" );
fAuditStatusData = eval ("(" + fAuditStatusData + ")");

var domains = ajaxReqRespText("/cbb/dicCBBgetDicByType.action?dicType=Busi-Domain");
	domains = eval("(" + domains + ")");


/** format field audit type **/
function fmtFauditType(n){
	for(var i=0, j=fAuditTypeData.length; i<j; i++ ){
		if( fAuditTypeData[i].code == new String(n) ){
			return fAuditTypeData[i].value;
		}
	}
};

/** format field audit status **/
function fmtFauditStatus(n){
	for(var i=0, j=fAuditStatusData.length; i<j; i++ ){
		if( fAuditStatusData[i].code == new String(n) ){
			return fAuditStatusData[i].value;
		}
	}
};

function enterKeyDown(event)
{
    if(event.keyCode==13)
    {
    	submitForm();
	}
};

/** validate and assign value **/
function PackingParameter(){
// 	var mig_dryrun_name = $('#mig_dryrun_name').val();
// 	query.init();
// 	if(mig_dryrun_name !== ""){
// 		query.jdata.condition.mig_dryrun_name = mig_dryrun_name;
// 		query.jdata.operator.mig_dryrun_name = OPE.CONTAIN;
// 	}
// 	return true;
	
	var formData = $('#s_form').form( 'getData');
	query.init();
	for (var field in formData) {
		if( formData[field] !== "" ){
			query.jdata.condition[field] = formData[field];
			query.jdata.operator[field] = OPE.CONTAIN;
		}
	}
// 	alert( $.toJSON(query.jdata.condition) );
	return true;
};

/** search data ,reload data  **/
function submitForm(){
   	if(!PackingParameter()){
   		return;
   	}
   	$('#grid').datagrid( 'reload', {
   		tableName : tableName,
   		jdata: encodeURI( $.toJSON( query.jdata ) ) 
   	} );
};
/**  清空  **/
function clearForm(){
	$('#s_form').form('clear');
};

function newRecord(){  //使用一个window
	$('#win').window('open').window('setTitle', 'New');
	$('#win').window("refresh", "migAuditfMain_add.html");
}

var read = {};
read.jdata = { act: "read",condition: {faudit_id: ""}, operator : {faudit_id:1} };
function editRecord() {
	var row = $('#grid').datagrid('getSelected');
	if (row) {
		read.jdata.condition.faudit_id = row.faudit_id;
		$('#win').window('open').window('setTitle', 'Edit');
		$('#win').window("refresh", getContextPath()+"/curd/migAuditfMainCURDinitModify.action?tableName="+tableName+"&jdata="+encodeURI($.toJSON( read.jdata )));
	}
}

function browseRecord() {
	var row = $('#grid').datagrid('getSelected');
	if (row) {
		$('#win').window('open').window('setTitle', 'View');
		read.jdata.condition.faudit_id = row.faudit_id;
		$('#win').window("refresh", getContextPath()+"/curd/migAuditfMainCURDbrowse.action?tableName="+tableName+"&jdata="+encodeURI($.toJSON( read.jdata )));
	}
}

var del = {};
del.jdata = {act: "del",condition: { faudit_id: "" },operator : {faudit_id : 1} };
function destroyRecord(){
	var row = $('#grid').datagrid('getSelected');
	if (row){
		$.messager.confirm('Comfirm','Comfirm Remove?',function(r){
			if (r){
				del.jdata.condition.faudit_id = row.faudit_id;
				$.post( getContextPath()+"/curd/migAuditfMainCURDdelete.action", {
					tableName : tableName,
					jdata: encodeURI($.toJSON( del.jdata )) 
				}, function(result, status){
					alert(result.msg);
					if (result.success){
						$('#grid').datagrid('reload',{
							tableName : tableName,
							jdata: encodeURI( $.toJSON( query.jdata ) )
						} );	// reload data
					}
				});
			}
		});
	}
};

var toolbar = [{
	text:'New Config',
	iconCls:'icon-add',
	handler:function(){
		newRecord();
	}
},{
	text:'Edit Config',
	iconCls:'icon-edit',
	handler:function(){
		editRecord();
	}
},{
	text:'Remove Config',
	iconCls:'icon-remove',
	handler:function(){
		destroyRecord();
	}
},{
	text:'View Config',
	iconCls:'icon-search',
	handler:function(){ 
		browseRecord(); 
	}
}];

$(function(){
	$('#grid').datagrid({
		title : 'Search Result',
		toolbar : toolbar,
		width : 938,
		height : 720,
		nowrap : true,
		striped : true,
		fit : true,
		collapsible : true,
		url: getContextPath()+"/query/migAuditfMainJEasyUIQUERYdfind.action",
		idField : "faudit_id",
		remoteSort: true,
		multiSort : false,
		singleSelect : true,
		frozenColumns: [[
				{ title : 'Key', field : 'faudit_id', width : 90, hidden:true, sortable: true },
				{ title : 'Domain', field : 'domain',  width :100, sortable: true, formatter: function(value,row, index ){
					for(var i=0, j=domains.length; i<j; i++){
						if( domains[i].code == value ){
							return domains[i].value;
						}
					}
					return value;
				} },
				{ title : 'Audit Item', field : 'faudit_name', width : 120, sortable: true }
   		]],
		columns : [ [
			{ title : 'Source Table', field : 'faudit_srctable_name',  width : 120 },
			{ title : 'Target Table', field : 'faudit_dsttable_name',  width : 120 },
			{ title : 'Source Connection URL', field : 'faudit_srctable_conn',  width : 220 },
			{ title : 'Target Connection URL', field : 'faudit_dsttable_conn',  width : 220 },
			{ title : 'Author', field : 'author',  width : 120 },
			{ title : 'Description', field : 'faudit_desc',  width : 120 },
			{ title : 'Create Time', field : 'faudit_createtime',  width : 130 }
		] ],
		pagination : true,
		rownumbers : false,
		queryParams : {
			tableName : tableName,
			jdata: encodeURI( $.toJSON( query.jdata ) ) 
		}
	});
});
//92px  118px
</script>
</head>
<body rightmargin="0" bottommargin="0" leftmargin="0" topmargin="0" class="easyui-layout">
    <div data-options="region:'north',border:true,split:true" style="height:92px;background:#B3DFDA;" title="Search Condition" >
    	<form id="s_form" method="post" style="margin:0;padding:0;">
        <div style="padding:0px 0 0px 15px">
            <table width="100%">
                <tr>
                	<td>Domain:</td>
                    <td>
                        <input class="easyui-combobox" 
		                        id='domain' name="domain" value="" 
		                        data-options="valueField:'code', textField:'value',
		                        editable:false,
								data: domains,
                        onChange: function(newValue, oldValue){
                        	submitForm();
                        }"/>
                    </td>
                    <td>Audit Item:</td>
                    <td>
                        <input id="faudit_name" name="faudit_name" value="" onkeydown="enterKeyDown(event)">
                    </td>
                    <td>Source Table:</td>
                    <td>
                        <input id="faudit_srctable_name" name="faudit_srctable_name" value="" onkeydown="enterKeyDown(event)">
                    </td>
                    <td>Target Table:</td>
                    <td>
                        <input id="faudit_dsttable_name" name="faudit_dsttable_name" value="" onkeydown="enterKeyDown(event)">
                    </td>
                </tr>
            </table>
        </div>
        <table width="100%" border="0" align="center">
			<tr bgcolor="#E2EEFE" valign="bottom">
				<td height="23"><div align="center"><!-- default height='21'  -->
					<a class="easyui-linkbutton" data-options="iconCls:'icon-search'" href="javascript:void(0)" 
               		onclick="submitForm()" style="width:80px">Submit</a>&nbsp;&nbsp;
               		<a class="easyui-linkbutton" data-options="iconCls:'icon-clear'" href="javascript:void(0)" 
               		onclick="clearForm()" style="width:80px">Clear</a>
				</div></td>
			</tr>
		</table>
		</form>
    </div>
    <div data-options="region:'center', border:false" title="" style="overflow:hidden;" noheader="true">
		<table id="grid"></table>
	</div>
	
	<div id="win" class="easyui-window" title="添加" style="width:600px;height:420px"  
        data-options="modal:true,closed:true">
	</div>
</body>
</html>
