var query = VIRTUE.query;
var OPE = VIRTUE.operator;

var tableName = "mig_task_config";

var configType = ajaxReqRespText("/cbb/dicCBBgetDicByType.action?dicType=config_type" );
configType = eval ("(" + configType + ")");
var recordStatus = ajaxReqRespText("/cbb/dicCBBgetDicByType.action?dicType=record_status" );
recordStatus = eval ("(" + recordStatus + ")");
var domains = ajaxReqRespText("/cbb/dicCBBgetDicByType.action?dicType=Busi-Domain");
	domains = eval("(" + domains + ")");

VIRTUE.query.jdata = { act: VIRTUE.act.QUERY, condition:  {mig_config_type:1}, operator : {mig_config_type: OPE.EQUAL} };
VIRTUE.query.init = function(){
	VIRTUE.query.jdata = { act: VIRTUE.act.QUERY, condition: {mig_config_type:1}, operator : {mig_config_type: OPE.EQUAL} };
};

function enterKeyDown(event)
{
    if(event.keyCode==13)
    {
    	submitForm();
	}
};

/** validate and assign value **/
function PackingParameter(){
	var formData = $('#s_form').form( 'getData');
	query.init();
	for (var field in formData) {
		if( formData[field] !== "" ){
			query.jdata.condition[field] = formData[field];
			query.jdata.operator[field] = OPE.CONTAIN;
		}
	}
	return true;
};

/** search data ,reload data  **/
function submitForm(){
   	if(!PackingParameter()){
   		return;
   	}
   	$('#grid').datagrid( 'reload', {
   		tableName : tableName,
   		jdata: encodeURI( $.toJSON( query.jdata ) ) 
   	} );
};
/**  清空  **/
function clearForm(){
	$('#s_form').form('clear');
};

function newRecord(){  //使用一个window
	$('#win').window('open').window('setTitle', 'New');
	$('#win').window("refresh", "migTaskConfig_add.html");
};
function newRecord1(){  //使用一个window
	$('#win').window('open').window('setTitle', 'New');
	$('#win').window("refresh", "migTaskConfig_add1.html");
};
function newRecord2(){  //使用一个window
	$('#win').window('open').window('setTitle', 'New');
	$('#win').window("refresh", "migTaskConfig_add2.html");
};
function newRecord3(){  //使用一个window
	$('#win').window('open').window('setTitle', 'New');
	$('#win').window("refresh", "migTaskConfig_add3.html");
};

var read = {};
read.jdata = { act: "read",condition: {mig_config_id: ""}, operator : {mig_config_id:1} };
function editRecord() {
	var row = $('#grid').datagrid('getSelected');
	if (row) {
		read.jdata.condition.mig_config_id = row.mig_config_id;
		$('#win').window('open').window('setTitle', 'Edit');
		//mig_dst mig_dst_conn mig_where
		if( row.mig_dst.replace(/ /g, "") != "" && row.mig_dst_conn.replace(/ /g, "") == "" && row.mig_where.replace(/ /g, "") == "" ){
			$('#win').window("refresh", getContextPath()+"/curd/commonCURDinitModify2.action?foldName=migTaskConfig_SplitFile"
					+"&frontPageName=migTaskConfig_SplitFile_modify1&tableName="+tableName+"&jdata="+encodeURI($.toJSON( read.jdata )));
		}else if( row.mig_dst.replace(/ /g, "") == "" && row.mig_dst_conn.replace(/ /g, "") != ""  ){//&& row.mig_where.replace(/ /g, "") != ""
			$('#win').window("refresh", getContextPath()+"/curd/commonCURDinitModify2.action?foldName=migTaskConfig_SplitFile"
					+"&frontPageName=migTaskConfig_SplitFile_modify2&tableName="+tableName+"&jdata="+encodeURI($.toJSON( read.jdata )));
		}else if( row.mig_dst.replace(/ /g, "") == "" && row.mig_dst_conn.replace(/ /g, "") == "" && row.mig_where.replace(/ /g, "") != "" ){
			$('#win').window("refresh", getContextPath()+"/curd/commonCURDinitModify2.action?foldName=migTaskConfig_SplitFile"
					+"&frontPageName=migTaskConfig_SplitFile_modify3&tableName="+tableName+"&jdata="+encodeURI($.toJSON( read.jdata )));
		}else{
			alert("Error! No this type config parameter!");
		}
	}
};

function browseRecord() {
	var row = $('#grid').datagrid('getSelected');
	if (row) {
		$('#win').window('open').window('setTitle', 'View');
		read.jdata.condition.mig_config_id = row.mig_config_id;
		var readSQLName = "read_TaskConfig";
		$('#win').window("refresh", getContextPath()+"/curd/commonCURDbrowse2.action?foldName=migTaskConfig_SplitFile"
				+"&frontPageName=migTaskConfig_SplitFile_browse&tableName="+tableName+"&readSQLName="+readSQLName+"&jdata="+encodeURI($.toJSON( read.jdata )));
	}
};

var del = {};
del.jdata = {act: "del",condition: { mig_config_id: "" },operator : {mig_config_id : 1} };
function destroyRecord(){
	var row = $('#grid').datagrid('getSelected');
	if (row){
		$.messager.confirm('Confirm','Confirm Remove?',function(r){
			if (r){
				del.jdata.condition.mig_config_id = row.mig_config_id;
				$.post( getContextPath()+"/curd/commonCURDdelete.action", {
					tableName : tableName,
					jdata: encodeURI($.toJSON( del.jdata )) 
				}, function(result, status){
					alert(result.msg);
					if (result.success){
						$('#grid').datagrid('reload',{
							tableName : tableName,
							jdata: encodeURI( $.toJSON( query.jdata ) )
						} );	// reload data
					}
				});
			}
		});
	}
};

var toolbar = [{
	text:'New Generate Rule',
	iconCls:'icon-add',
	handler:function(){
		newRecord1();
	}
},{
	text:'New Replace+Split',
	iconCls:'icon-add',
	handler:function(){
		newRecord2();
	}
},{
	text:'New Split Rule',
	iconCls:'icon-add',
	handler:function(){
		newRecord3();
	}
},{
	text:'Edit Config',
	iconCls:'icon-edit',
	handler:function(){
		editRecord();
	}
},{
	text:'Remove Config',
	iconCls:'icon-remove',
	handler:function(){
		destroyRecord();
	}
},{
	text:'View Config',
	iconCls:'icon-search',
	handler:function(){ 
		browseRecord(); 
	}
}];

$(function(){
	$('#grid').datagrid({
		title : 'Search Result',
		toolbar : toolbar,
		width : 938,
		height : 720,
		nowrap : true,
		striped : true,
		fit : true,
		collapsible : true,
		url: getContextPath()+"/query/commonJEasyUIQUERYdfind.action",
		idField : "mig_config_id",
		remoteSort: true,
		multiSort : false,
		singleSelect : true,
		columns : [ [
			{ title : 'ID', field : 'mig_config_id',width : 90, sortable: true, hidden: true }, 
			{ title : 'Config Type', field : 'mig_config_type', width : 80, sortable: true, formatter: function(value,row, index ){
				for(var i=0, j=configType.length; i<j; i++){
					if( configType[i].code == value ){
						return configType[i].value
					}
				}
				return value;
			}, hidden: true },
			{ title : 'Domain', field : 'domain',  width :100, sortable: true, formatter: function(value,row, index ){
				for(var i=0, j=domains.length; i<j; i++){
					if( domains[i].code == value ){
						return domains[i].value;
					}
				}
				return value;
			} },
			{ title : 'Pending Split File', field : 'mig_src',  width :360, sortable: true },
			{ title : 'Generate table I rule', field : 'mig_dst',  width : 180 },
// 			{ title : 'Source DB Connection URL', field : 'mig_src_conn',  width : 120 },
			{ title : 'ID Replacement Rule', field : 'mig_dst_conn',  width : 180 },
			{ title : 'Split Rule', field : 'mig_where',  width :200 },
			{ title : 'Author', field : 'mig_author',  width : 80 },
			{ title : 'Description', field : 'mig_desc',  width : 130 },
			{ title : 'Last Update Time', field : 'mig_modifytime',  width : 130 },
			{ title : 'Record Status', field : 'mig_status',  width : 90, formatter: function(value,row, index ){
				for(var i=0, j=recordStatus.length; i<j; i++){
					if( recordStatus[i].code == value ){
						return recordStatus[i].value
					}
				}
				return value;
			}}
		] ],	  
		pagination : true,
		rownumbers : false,
		queryParams : {
			tableName : tableName,
			jdata: encodeURI( $.toJSON( query.jdata ) ) 
		}
	});
});

<body rightmargin="0" bottommargin="0" leftmargin="0" topmargin="0" class="easyui-layout">

		                        id='domain' name="domain" value="" 
		                        data-options="valueField:'code', textField:'value',
		                        editable:false,

                        onChange: function(newValue, oldValue){
                        	submitForm();
                        }"/>
                    </td>
                    <td>Pending Split File:</td>
                    <td>
                        <input id="mig_src" name="mig_src" value="" onkeydown="enterKeyDown(event)">
                    </td>

		                        id='mig_status' name="mig_status" value=""
