<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<title>新建</title>
</head>
<body>
<div class="easyui-layout" data-options="fit:true">
	<div data-options="region:'center',border:false" title="" noheader="true">
	<div style="padding:10px 0 10px 5px">
	    <form id="c_form" method="post" action="" style="margin:0;padding:0;">
	    	<table align="center">
	    		<tr>
	    			<td>Config Type:</td>
	    			<td>
	    				<input class="easyui-combobox" 
		                        id='mig_config_type_C' name="mig_config_type"
		                        data-options="valueField:'code', textField:'value',
		                        value:1,
		                        editable:false,
		                        readonly: true,
								data:configType,
		                        required:true"/>
	    			</td>
	    		</tr>
	    		<tr>
	    		<tr>
	    			<td>Domain:</td>
	    			<td>
	    				<input class="easyui-combobox" 
		                        id='domain_C3' name="domain" value=""
		                        data-options="valueField:'code', textField:'value',
		                        editable:false,
		                        required: true,
								data: domains" />
	    			</td>
	    		</tr>
	    			<td>Pending Split File:</td>
	    			<td>
	    				<input id="mig_src_C" name="mig_src" class="easyui-validatebox"
						data-options="required: true" type="text" style='width:99%;' value="" />
	    			</td>
	    		</tr>
	    		<tr>
	    			<td>Split Rule:</td>
	    			<td>
	    				<textarea id="mig_where_C3" name="mig_where" style="font-size: 12px;" 
	    				rows="2" cols="60" onclick="add.open_dialog_migwhere()" readonly="readonly"></textarea>
	    			</td>
	    		</tr>
	    		<tr>
	    			<td>Description:</td>
	    			<td><textarea id="mig_desc_C" name="mig_desc" style="font-size: 12px;" rows="2" cols="60"></textarea></td>
	    		</tr>
	    	</table>			
	    </form>
	</div>
    </div>
<script type="text/javascript">
var add = VIRTUE.add;

app.splitfield_gridrow = [];

add.submitForm = function (){
	if( ! $('#c_form').form("validate") )
	{
		return;
	}
	
	var formData = $('#c_form').form( 'getData');
	if( formData["mig_where"].replace(/ /g, "")==""  ){
		alert("Split Rule is requird");
		return;
	}
	add.init();
	for (var field in formData) {
		add.jdata.data[field] = formData[field];
	}

	jQuery.post( getContextPath()+"/curd/migTaskConfigCURDadd.action", 
		{
			tableName : tableName,
			authorColumnName : "mig_author",
			jdata : $.toJSON( add.jdata )
		},
		function(oResponse, status){
			alert(oResponse.msg);

			if(oResponse.success == true){
				$('#grid').datagrid('reload',{
					tableName : tableName,
					jdata: encodeURI($.toJSON( query.jdata ) ) 
				} );
				$('#win').window('close');
			}
	});
};
add.clearForm = function (){
	$('#c_form').form('clear');
};
add.open_dialog_migwhere = function(){
	var mig_where = $('#mig_where_C3').val();
	if( mig_where != '' 
		&& mig_where.indexOf(':') !=-1 
		&& mig_where.indexOf('$') !=-1){
		mig_where = mig_where.substring(0,mig_where.length-1);
		
		var temp = mig_where.split(/:/);
				
		app.splitfield_gridrow = [];
		for(var i=0, j=temp.length; i<j; i++ ){
			var row = {};
			var arr = temp[i].split(/\|/);
			
			if(arr.length==1){
				row.fieldValue = 0;
				row.fieldName = 0;
				row.fieldRule = arr[0];
			}else if(arr.length==2){
				row.fieldValue = arr[0];
				row.fieldRule = arr[1];
				for(var m=0,n=app.cbbdata.length; m<n; m++ ){
					if(row.fieldValue == app.cbbdata[m].value){
						row.fieldName = app.cbbdata[m].label;
						break;
					}
				}
			}else{
				alert("error!")
				return;
			}
			app.splitfield_gridrow.push(row);
		}
		
		//loadlocaldata
		$('#splitrule_grid_C3').datagrid('loadData', app.splitfield_gridrow );
	}else{
		$('#splitrule_grid_C3').datagrid('loadData', [] );
	}
	$('#dlg-migwhere_C3').dialog('open');
};

/** 拆分表格编辑 */
var splitC3_editIndex = undefined;
function splitC3_endEditing() {
	if (splitC3_editIndex == undefined) 
	{
		return true
	}
	if ($('#splitrule_grid_C3').datagrid('validateRow', splitC3_editIndex)) 
	{
		var ed = $('#splitrule_grid_C3').datagrid('getEditor', {
			index : splitC3_editIndex,
			field : 'fieldValue'
		});
		var fieldName = $(ed.target).combobox('getText');
		$('#splitrule_grid_C3').datagrid('getRows')[splitC3_editIndex]['fieldName'] = fieldName;
		$('#splitrule_grid_C3').datagrid('endEdit', splitC3_editIndex);
		splitC3_editIndex = undefined;
		return true;
	}
	else 
	{
		return false;
	}
};
function splitC3_onClickRow(index) {
	if (splitC3_editIndex != index) {
		if (splitC3_endEditing()) {
			$('#splitrule_grid_C3').datagrid('selectRow', index).datagrid('beginEdit', index);
			splitC3_editIndex = index;
		} else {
			$('#splitrule_grid_C3').datagrid('selectRow', splitC3_editIndex);
		}
	}
};

function splitC3_append() {
	if (splitC3_endEditing()) {
		$('#splitrule_grid_C3').datagrid('appendRow', { fieldValue: '',fieldName: '',fieldRule:''});
		splitC3_editIndex = $('#splitrule_grid_C3').datagrid('getRows').length - 1;
		$('#splitrule_grid_C3').datagrid('selectRow', splitC3_editIndex).datagrid('beginEdit',
				splitC3_editIndex);
	}
};
function splitC3_removeit() {
	if (splitC3_editIndex == undefined) {return}
	$('#splitrule_grid_C3').datagrid('cancelEdit', splitC3_editIndex).datagrid('deleteRow', splitC3_editIndex)
	splitC3_editIndex = undefined;
};
function splitC3_accept() {
	if (splitC3_endEditing()) {
		$('#splitrule_grid_C3').datagrid('acceptChanges');
	}
};
function splitC3_reject() {
	$('#splitrule_grid_C3').datagrid('rejectChanges');
	splitC3_editIndex = undefined;
};
</script>
	<div data-options="region:'south',border:false" style="text-align:right;padding:5px 5px 5px 0;background:#F4F4F4;">
		<a class="easyui-linkbutton" data-options="iconCls:'icon-ok'" href="javascript:void(0)" onclick="javascript:add.submitForm()" style="width:80px">Submit</a>
		<a class="easyui-linkbutton" data-options="iconCls:'icon-cancel'" href="javascript:void(0)" onclick="javascript:$('#win').dialog('close');" style="width:80px">Cancel</a>
	</div>
	
	<!-- 拆分规则对话框    ###########################-->
	<div id="dlg-migwhere_C3" class="easyui-dialog"
		title="Split File Rule" style="width:550px;height:320px;"
			data-options="
				modal:true,closed:true,
				iconCls: 'icon-edit',
				buttons: [{
					text:'Ok',
					iconCls:'icon-ok',
					handler:function(){
						//assemble
						var migwhere = '';
						var rows = $('#splitrule_grid_C3').datagrid('getRows');
						console.log( $.toJSON(rows) );
						for(var i=0, j = rows.length; i<j; i++ ){
							if( isNvl( rows[i].fieldValue ) || isNvl( rows[i].fieldRule ) ){
								console.log( $.toJSON(rows[i]) );
								alert('Neither Field index nor Field split rule can be null!');
								return;
							}
							if(rows[i].fieldValue == 0 ){
								migwhere += rows[i].fieldRule +':'
							}else{
								migwhere += rows[i].fieldValue +'|'+rows[i].fieldRule +':'
							}
						}
						$('#mig_where_C3').val( migwhere );
						$('#dlg-migwhere_C3').dialog('close');
					}
				},{
					text:'Cancel',
					handler:function(){
						$('#dlg-migwhere_C3').dialog('close');
					}
				}]
			">
		<div class="easyui-layout" data-options="fit:true">
			<div data-options="region:'center',border: false">
				<table id="splitrule_grid_C3" class="easyui-datagrid" 
					data-options="rownumbers:true,
					fit : true,
					onClickCell : splitC3_onClickRow,
					singleSelect:true,
					showHeader: true, 
					showFooter: false, 
					selectOnCheck:true,
					checkOnSelect:false,
					idField: 'fieldName',
					url:'',
					method:'post',
					toolbar: [ {
						text : 'New',
						disabled: false,
						iconCls : 'icon-add',
						handler : function() {
							splitC3_append();
							return false;
						}
					}, '-', {
						text : 'Remove',
						disabled: false,
						iconCls : 'icon-remove',
						handler : function() {
							splitC3_removeit();
							return false;
						}
					} , '-', {
						text : 'Save',
						disabled: false,
						iconCls : 'icon-save',
						handler : function() {
							splitC3_accept();
							return false;
						}
					}, '-', {
						text : 'Cancel',
						disabled: false,
						iconCls : 'icon-undo',
						handler : function() {
							splitC3_reject();
							return false;
						}
					}]">
					<thead>
						<tr>
<!-- 							<th data-options="field:'ck',checkbox:true"></th> -->
							<th data-options="field:'fieldValue',width:200,
							formatter : function( value, row ) { return row.fieldName; },
							editor : { type : 'combobox',
								options:{
									valueField: 'value',
									textField: 'label',
									editable : false,
									data: app.cbbdata
								} }">Split Field</th>
							<th data-options="field:'fieldRule',width:200,editor : { type : 'text' }">Rule</th>
						</tr>
					</thead>
				</table>
			</div>
		</div>
	</div>
</div>
</body>
</html>
