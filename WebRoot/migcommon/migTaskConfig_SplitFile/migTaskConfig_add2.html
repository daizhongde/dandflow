	    			<td>

						<input class="easyui-combobox"

		                        editable:false,
		                        required: true,

	    			<td>Pending Split File:</td>

	</div>
    </div>
<script type="text/javascript">
var add = VIRTUE.add;

app.replaceidfield_gridrow = [];
app.splitfield_gridrow = [];

add.submitForm = function (){
	if( ! $('#c_form').form("validate") )
	{
		return;
	}
	
	var formData = $('#c_form').form( 'getData');
// 	if( formData["mig_dst_conn"].replace(/ /g, "")=="" || formData["mig_where"].replace(/ /g, "")=="" ){
// 		alert("ID Replacement Rule and Split Rule all are requird!");
// 		return;
// 	}
	add.init();
	for (var field in formData) {
		add.jdata.data[field] = formData[field];
	}

	jQuery.post( getContextPath()+"/curd/migTaskConfigCURDadd.action", 
		{
			tableName : tableName,
			authorColumnName : "mig_author",
			jdata : $.toJSON( add.jdata )
		},
		function(oResponse, status){
			alert(oResponse.msg);

			if(oResponse.success == true){
				$('#grid').datagrid('reload',{
					tableName : tableName,
					jdata: encodeURI($.toJSON( query.jdata ) ) 
				} );
				$('#win').window('close');
			}
	});
};
add.clearForm = function (){
	$('#c_form').form('clear');
};
add.open_dialog_migdstconn = function(){
	var mig_dst_conn = $('#mig_dst_conn_C').val();
	if( mig_dst_conn.length>2 
			&& mig_dst_conn.indexOf(':') !=-1 
			&& mig_dst_conn.indexOf(';') !=-1){
		mig_dst_conn = mig_dst_conn.substring(0,mig_dst_conn.length-1);
				
		var temp = mig_dst_conn.split(/;/);
		
		app.replaceidfield_gridrow = [];
		for(var i=0, j=temp.length; i<j; i++ ){
			var row = {};
			row.fieldValue = temp[i].split(/:/)[0];
			row.tableiName = temp[i].split(/:/)[1];
			for(var m=0,n=app.cbbdata.length; m<n; m++ ){
				if(row.fieldValue == app.cbbdata[m].value){
					row.fieldName = app.cbbdata[m].label;
					break;
				}
			}
			app.replaceidfield_gridrow.push(row);
		}
		
		//loadlocaldata
		$('#replacerule_grid_C2').datagrid('loadData', app.replaceidfield_gridrow );
		
	}else{
		$('#replacerule_grid_C2').datagrid('loadData', [] );
	}
	$('#dlg-migdstconn').dialog('open');
};
add.open_dialog_migwhere = function(){
	var mig_where = $('#mig_where_C2').val();
	if( mig_where != '' 
		&& mig_where.indexOf(':') !=-1 
		&& mig_where.indexOf('$') !=-1){
		mig_where = mig_where.substring(0,mig_where.length-1);
		
		var temp = mig_where.split(/:/);
				
		app.splitfield_gridrow = [];
		for(var i=0, j=temp.length; i<j; i++ ){
			var row = {};
			var arr = temp[i].split(/\|/);
			
			if(arr.length==1){
				row.fieldValue = 0;
				row.fieldName = 0;
				row.fieldRule = arr[0];
			}else if(arr.length==2){
				row.fieldValue = arr[0];
				row.fieldRule = arr[1];
				for(var m=0,n=app.cbbdata.length; m<n; m++ ){
					if(row.fieldValue == app.cbbdata[m].value){
						row.fieldName = app.cbbdata[m].label;
						break;
					}
				}
			}else{
				alert("error!")
				return;
			}
			app.splitfield_gridrow.push(row);
		}
		
		//loadlocaldata
		$('#splitrule_grid_C2').datagrid('loadData', app.splitfield_gridrow );
	}else{
		$('#splitrule_grid_C2').datagrid('loadData', [] );
	}
	$('#dlg-migwhere_C2').dialog('open');
};

/** 替换表格编辑 */
var replacefield_editIndex = undefined;
function replacefield_endEditing() {
	if (replacefield_editIndex == undefined) 
	{
		return true
	}
	if ($('#replacerule_grid_C2').datagrid('validateRow', replacefield_editIndex)) 
	{
		var ed = $('#replacerule_grid_C2').datagrid('getEditor', {
			index : replacefield_editIndex,
			field : 'fieldValue'
		});
		var fieldName = $(ed.target).combobox('getText');
		$('#replacerule_grid_C2').datagrid('getRows')[replacefield_editIndex]['fieldName'] = fieldName;
		$('#replacerule_grid_C2').datagrid('endEdit', replacefield_editIndex);
		replacefield_editIndex = undefined;
		return true;
	}
	else 
	{
		return false;
	}
};
function replacefield_onClickRow(index) {
	if (replacefield_editIndex != index) {
		if (replacefield_endEditing()) {
			$('#replacerule_grid_C2').datagrid('selectRow', index).datagrid('beginEdit', index);
			replacefield_editIndex = index;
		} else {
			$('#replacerule_grid_C2').datagrid('selectRow', replacefield_editIndex);
		}
	}
};

function replacefield_append() {
	if (replacefield_endEditing()) {
		$('#replacerule_grid_C2').datagrid('appendRow', { fieldValue: '',fieldName: '', tableiName:'' });
		replacefield_editIndex = $('#replacerule_grid_C2').datagrid('getRows').length - 1;
		$('#replacerule_grid_C2').datagrid('selectRow', replacefield_editIndex).datagrid('beginEdit',
				replacefield_editIndex);
	}
};
function replacefield_removeit() {
	if (replacefield_editIndex == undefined) {return}
	$('#replacerule_grid_C2').datagrid('cancelEdit', replacefield_editIndex).datagrid('deleteRow', replacefield_editIndex)
	replacefield_editIndex = undefined;
};
function replacefield_accept() {
	if (replacefield_endEditing()) {
		$('#replacerule_grid_C2').datagrid('acceptChanges');
	}
};
function replacefield_reject() {
	$('#replacerule_grid_C2').datagrid('rejectChanges');
	replacefield_editIndex = undefined;
};

/** 拆分表格编辑 */
var split_editIndex = undefined;
function split_endEditing() {
	if (split_editIndex == undefined) 
	{
		return true
	}
	if ($('#splitrule_grid_C2').datagrid('validateRow', split_editIndex)) 
	{
		var ed = $('#splitrule_grid_C2').datagrid('getEditor', {
			index : split_editIndex,
			field : 'fieldValue'
		});
		var fieldName = $(ed.target).combobox('getText');
		$('#splitrule_grid_C2').datagrid('getRows')[split_editIndex]['fieldName'] = fieldName;
		$('#splitrule_grid_C2').datagrid('endEdit', split_editIndex);
		split_editIndex = undefined;
		return true;
	}
	else 
	{
		return false;
	}
};
function split_onClickRow(index) {
	if (split_editIndex != index) {
		if (split_endEditing()) {
			$('#splitrule_grid_C2').datagrid('selectRow', index).datagrid('beginEdit', index);
			split_editIndex = index;
		} else {
			$('#splitrule_grid_C2').datagrid('selectRow', split_editIndex);
		}
	}
};

function split_append() {
	if (split_endEditing()) {
		$('#splitrule_grid_C2').datagrid('appendRow', { fieldValue: '',fieldName: '',fieldRule:''});
		split_editIndex = $('#splitrule_grid_C2').datagrid('getRows').length - 1;
		$('#splitrule_grid_C2').datagrid('selectRow', split_editIndex).datagrid('beginEdit',
				split_editIndex);
	}
};
function split_removeit() {
	if (split_editIndex == undefined) {return}
	$('#splitrule_grid_C2').datagrid('cancelEdit', split_editIndex).datagrid('deleteRow', split_editIndex)
	split_editIndex = undefined;
};
function split_accept() {
	if (split_endEditing()) {
		$('#splitrule_grid_C2').datagrid('acceptChanges');
	}
};
function split_reject() {
	$('#splitrule_grid_C2').datagrid('rejectChanges');
	split_editIndex = undefined;
};
</script>
	<div data-options="region:'south',border:false" style="text-align:right;padding:5px 5px 5px 0;background:#F4F4F4;">
		<a class="easyui-linkbutton" data-options="iconCls:'icon-ok'" href="javascript:void(0)" onclick="javascript:add.submitForm()" style="width:80px">Submit</a>
		<a class="easyui-linkbutton" data-options="iconCls:'icon-cancel'" href="javascript:void(0)" onclick="javascript:$('#win').dialog('close');" style="width:80px">Cancel</a>
	</div>
	
	<!-- ID 替换规则对话框    ###########################-->
	<div id="dlg-migdstconn" class="easyui-dialog"
		title="ID Replacement Rule" style="width:550px;height:320px;"
			data-options="
				modal:true,closed:true,
				iconCls: 'icon-edit',
				buttons: [{
					text:'Ok',
					iconCls:'icon-ok',
					handler:function(){
						if( ! $('#migdstconn_form').form('validate') )
						{
							return;
						}
						
						//assemble
						var migdstconn='';

						var rows= $('#replacerule_grid_C2').datagrid('getRows');
						for(var i=0, j = rows.length; i<j; i++ ){
							console.log('rows[i].fieldValue:'+rows[i].fieldValue);
							if( isNvl( rows[i].fieldValue ) || isNvl( rows[i].tableiName ) ){
								alert('Field name can\'t be null!');
								return;
							}
							migdstconn += rows[i].fieldValue + ':' + rows[i].tableiName+';';
						}
						$('#mig_dst_conn_C').val( migdstconn );
						$('#dlg-migdstconn').dialog('close');
					}
				},{
					text:'Cancel',
					handler:function(){
						$('#dlg-migdstconn').dialog('close');
					}
				}]
			">
		<div class="easyui-layout" data-options="fit:true">
			<form id="migdstconn_form" method="post" style="margin:0;padding:0;">
<!-- 			<div data-options="region:'north',split:false,border:false" style="height:50px;padding:5px 0 0 0px"> -->
<!-- 				<table id="addTable0" width="100%" cellpadding="2"> -->
<!-- 					<tr> -->
<!-- 						<td style='width:130px'>Table I Name</td> -->
<!-- 						<td><input id="tableiName" class="easyui-textbox" -->
<!-- 							data-options="required: true" type="text" name="tableiName" -->
<!-- 							style='width:90%;' value="" /></td> -->
<!-- 					</tr> -->
<!-- 				</table> -->
<!-- 			</div> -->
			<div data-options="region:'center',border: false">
				<table id="replacerule_grid_C2" class="easyui-datagrid" 
					data-options="rownumbers:true,
					fit : true,
					onClickCell : replacefield_onClickRow,
					singleSelect:true,
					showHeader: true, 
					showFooter: false, 
					selectOnCheck:true,
					checkOnSelect:false,
					idField: 'fieldValue',
					url:'',
					method:'post',
					toolbar: [ {
						text : 'New',
						disabled: false,
						iconCls : 'icon-add',
						handler : function() {
							replacefield_append();
							return false;
						}
					}, '-', {
						text : 'Remove',
						disabled: false,
						iconCls : 'icon-remove',
						handler : function() {
							replacefield_removeit();
							return false;
						}
					} , '-', {
						text : 'Save',
						disabled: false,
						iconCls : 'icon-save',
						handler : function() {
							replacefield_accept();
							return false;
						}
					}, '-', {
						text : 'Cancel',
						disabled: false,
						iconCls : 'icon-undo',
						handler : function() {
							replacefield_reject();
							return false;
						}
					}]">
					<thead>
						<tr>
<!-- 							<th data-options="field:'ck',checkbox:true"></th> -->

							<th data-options="field:'tableiName',width:200,editor : { type : 'text' }">Table I Name</th>
							<th data-options="field:'fieldValue',width:200,
							formatter : function( value, row ) { return row.fieldName; },
							editor : { type : 'combobox',
								options:{
									valueField: 'value',
									textField: 'label',
									editable : false,
									data: app.cbbdata.slice(1)
								} }">Replace Field</th>
						</tr>
					</thead>
				</table>
			</div>
			</form>
		</div>
	</div>
	
	<!-- 拆分规则对话框    ###########################-->
	<div id="dlg-migwhere_C2" class="easyui-dialog"
		title="Split File Rule" style="width:550px;height:320px;"
			data-options="
				modal:true,closed:true,
				iconCls: 'icon-edit',
				buttons: [{
					text:'Ok',
					iconCls:'icon-ok',
					handler:function(){
						//assemble
						var migwhere = '';
						var rows = $('#splitrule_grid_C2').datagrid('getRows');
						console.log( $.toJSON(rows) );
						for(var i=0, j = rows.length; i<j; i++ ){
							if( isNvl( rows[i].fieldValue ) || isNvl( rows[i].fieldRule ) ){
								console.log( $.toJSON(rows[i]) );
								alert('Neither Field index nor Field split rule can be null!');
								return;
							}
							if(rows[i].fieldValue == 0 ){
								migwhere += rows[i].fieldRule +':'
							}else{
								migwhere += rows[i].fieldValue +'|'+rows[i].fieldRule +':'
							}
						}
						$('#mig_where_C2').val( migwhere );
						$('#dlg-migwhere_C2').dialog('close');
					}
				},{
					text:'Cancel',
					handler:function(){
						$('#dlg-migwhere_C2').dialog('close');
					}
				}]
			">
		<div class="easyui-layout" data-options="fit:true">
			<div data-options="region:'center',border: false">
				<table id="splitrule_grid_C2" class="easyui-datagrid" 
					data-options="rownumbers:true,
					fit : true,
					onClickCell : split_onClickRow,
					singleSelect:true,
					showHeader: true, 
					showFooter: false, 
					selectOnCheck:true,
					checkOnSelect:false,
					idField: 'fieldValue',
					url:'',
					method:'post',
					toolbar: [ {
						text : 'New',
						disabled: false,
						iconCls : 'icon-add',
						handler : function() {
							split_append();
							return false;
						}
					}, '-', {
						text : 'Remove',
						disabled: false,
						iconCls : 'icon-remove',
						handler : function() {
							split_removeit();
							return false;
						}
					} , '-', {
						text : 'Save',
						disabled: false,
						iconCls : 'icon-save',
						handler : function() {
							split_accept();
							return false;
						}
					}, '-', {
						text : 'Cancel',
						disabled: false,
						iconCls : 'icon-undo',
						handler : function() {
							split_reject();
							return false;
						}
					}]">
					<thead>
						<tr>
<!-- 							<th data-options="field:'ck',checkbox:true"></th> -->
							<th data-options="field:'fieldValue',width:200,
							formatter : function( value, row ) { return row.fieldName; },
							editor : { type : 'combobox',
								options:{
									valueField: 'value',
									textField: 'label',
									editable : false,
									data: app.cbbdata
								} }">Split Field</th>
							<th data-options="field:'fieldRule',width:200,editor : { type : 'text' }">Rule</th>
						</tr>
					</thead>
				</table>
			</div>
		</div>
	</div>
</div>
