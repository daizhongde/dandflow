<script type="text/javascript">
var app = {};
	
var query = VIRTUE.query;
var exp = VIRTUE.exp;
var noquery = VIRTUE.noquery;
var OPE = VIRTUE.operator;

//actually this variable is not used in background. When we use common query interface, we need define this.
var tableName = "mig_auditf_field_result";

var domains = ajaxReqRespText("/cbb/dicCBBgetDicByType.action?dicType=Busi-Domain");
	domains = eval("(" + domains + ")");

fmtDomain = function(value,row, index ){
	for(var i=0, j=domains.length; i<j; i++){
		if( domains[i].code == value ){
			return domains[i].value;
		}
	}
	return value;
};

function enterKeyDown(event)
{
    if(event.keyCode==13)
    {
    	submitForm();
	}
};

/** validate and assign value **/
function PackingParameter(){
	var formData = $('#s_form').form( 'getData');
	query.init();
	for (var field in formData) {
		if( formData[field] !== "" ){
			query.jdata.condition[field] = formData[field];
			query.jdata.operator[field] = OPE.EQUAL;
		}
	}
	exp.jdata.condition = query.jdata.condition;
	exp.jdata.operator = query.jdata.operator;
	return true;
};

/** search data ,reload data  **/
function submitForm(){
   	if(!PackingParameter()){
   		return;
   	}
   	$('#grid').datagrid( 'reload', {
//    		tableName : tableName,
   		jdata: encodeURI( $.toJSON( query.jdata ) ) 
   	} );
};
/**  清空  **/
function clearForm(){
	$('#s_form').form('clear');
};
/** Export file by selected file extension name  */
function exportSimply()
{
	//You must Packing parameter at last
	if(!PackingParameter()){
   		return;
   	}
	
	var form = document.createElement("form");
	form.action = "../../exp/migAuditfFieldResultEXPexportXLS.action?_="+(new Date).getTime();
	
    document.body.appendChild(form);
    var i = document.createElement("input");
    i.type = "hidden";
    i.name = "jdata";
    i.value = encodeURI($.toJSON( exp.jdata ) );
    form.appendChild(i);

    form.method = "post";
    
//  一提交disable和show的效果立马就不见了哦
    form.submit();
};
var read = {};
read.jdata = { act: "read",
		condition: {faudit_main_id: "", faudit_sub_index: ""}, 
		operator : {faudit_main_id : OPE.EQUAL, faudit_sub_index : OPE.EQUAL} 
	};

function browseRecord() {
	var row = $('#grid').datagrid('getSelected');
	if (row) {
		$('#win').window('open').window('setTitle', 'View');
		read.jdata.condition.faudit_main_id = row.faudit_main_id;
		read.jdata.condition.faudit_sub_index = row.faudit_sub_index;
		$('#win').window("refresh", getContextPath()+"/curd/migAuditfFieldResultCURDbrowse.action?jdata="+encodeURI($.toJSON( read.jdata )));
	}
};

var toolbar = [{
	text:'查看',
	iconCls:'icon-search',
	disabled: true,
	handler:function(){
		browseRecord(); 
	}
}];

$(function(){
	$('#grid').datagrid({

		width : 938,
		height : 720,

		striped : true,

		  { field : 'current_result_rate', title : 'Result CRate', width : 100, align: 'right', formatter: fmtRate,sortable : true },
		  { field : 'effect_content_rate', title : 'Ept Content CRate', width : 100, align: 'right', formatter: fmtRate,sortable : true },
		  { field : 'effect_result_rate', title : 'Ept Result CRate', width : 100, align: 'right', formatter: fmtRate,sortable : true },
		  { field : 'create_time', title : 'Create Time', width : 130, sortable : true }

	var fares_main_items = ajaxReqRespText("/query/migAuditfMainCBBQUERYdfind.action");
	fares_main_items = eval("(" + fares_main_items + ")");
	fares_main_items = fares_main_items.rows;
	//console.log(fares_main_items);
	
	$('#fares_main_id').combobox({
		//url : "../../query/migAuditfMainCBBQUERYdfind.action",
		data : fares_main_items,
		required : true,
		valueField : 'faudit_id',
		textField : 'faudit_name',
		onChange: function(newValue, oldValue){
// 			alert("newValue:"+newValue+",oldValue:"+oldValue);
// 			var g = $('#fares_main_id').combogrid('grid');	// get datagrid object
// 			app.auditMainRow = g.datagrid('getSelected');	// get the selected row
			submitForm();
		}
	});
	
	/*$('#fares_main_id').combogrid({
		url : "../../query/migAuditfMainCBBQUERYdfind.action",
		panelWidth : 150,
		panelHeight : 200,
		idField : 'faudit_id',
		textField : 'faudit_name',
		pagination : true,
		fitColumns : false,
		required : true,
// 		editable : false,
		rownumbers : true,
		mode : 'remote',
		delay : 500,
		sortName : 'faudit_name',
		sortOrder : 'asc',
		pageSize : 5,
		pageList : [ 5, 10 ],
		onChange: function(newValue, oldValue){
// 			alert("newValue:"+newValue+",oldValue:"+oldValue);
// 			var g = $('#fares_main_id').combogrid('grid');	// get datagrid object
// 			app.auditMainRow = g.datagrid('getSelected');	// get the selected row
			submitForm();
		},
		frozenColumns: [[
               {
       			field : 'faudit_id',
       			title : 'ID',
       			width : 100,
       			hidden : true
       		}, {
       			field : 'faudit_name',
       			title : 'Audit Item',
       			width : 100,
       			sortable : true
       		}
   		]],
		columns : [ [ {
			field : 'faudit_srctable_name',
			title : 'Source Table',
			width : 100,
			sortable : true
		}, {
			field : 'faudit_dsttable_name',
			title : 'Target Table',
			width : 100,
			sortable : true
		}] ],
        onChange: function(newValue, oldValue){
        	submitForm();
        }
	});*/
	
	$('#fares_dryrun_id').combogrid({
		url : "../../query/commonCBBQUERYdfind.action",
		queryParams : {
			tableName : "v_dryrun_config",
			columns: "mig_dryrun_name"
		},
		panelWidth : 500,
		panelHeight : 200,
		idField : 'mig_dryrun_id',
		textField : 'mig_dryrun_name',
		pagination : true,
		fitColumns : false,
		required : true,
		rownumbers : true,
		mode : 'remote',
		delay : 500,
		sortName : 'mig_dryrun_id',
		sortOrder : 'desc',
		pageSize : 5,
		pageList : [ 5, 10 ],
		onSelect: function(index,row){
			submitForm();
		},
		columns : [ [
			{ title : 'ID', field : 'mig_dryrun_id',width : 90, sortable: true }, 
			{ title : 'Dry Run', field : 'mig_dryrun_name', width : 120, sortable: true }, 
			{ title : 'Description', field : 'remark',  width : 300 } 
		] ],
        onChange: function(newValue, oldValue){
        	submitForm();
        }
	});
});
</script>

<body rightmargin="0" bottommargin="0" leftmargin="0" topmargin="0" class="easyui-layout">
    <div data-options="region:'north',border:true,split:true" style="height:92px;background:#B3DFDA;" title="Quality Audit>>(FA)Field Compare Report" >
