<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
<title>合法性稽核作业管理</title>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<link rel="stylesheet" type="text/css" href="../../scripts/jquery-easyui/1.4.1/themes/default/easyui.css"/>
<link rel="stylesheet" type="text/css" href="../../scripts/jquery-easyui/1.4.1/themes/icon.css"/>
<script type="text/javascript" src="../../scripts/jquery-easyui/1.4.1/jquery.min.js"></script>

<script type="text/javascript" src="../../scripts/jquery-easyui/1.4.1/jquery.easyui.min.js"></script>
<!-- <script type="text/javascript" src="../../scripts/jquery-easyui/1.4.1/locale/easyui-lang-zh_CN.js"></script> -->
<script type="text/javascript" src="../../scripts/json/jquery.json-2.2.min.js"></script>
<script type="text/javascript" src="../../scripts/virtue/virtue.js"></script>
<script type="text/javascript" src="../../scripts/const/const.js"></script>
<script type="text/javascript" src="../../scripts/utils/commonUtil.js"></script>

<script type="text/javascript">
var noquery = VIRTUE.noquery;
var query = VIRTUE.query;
var OPE = VIRTUE.operator;
var del = VIRTUE.del;

var app={};
app.selectedRow = {};//记录数据表格中选择中的行

var jobType = ajaxReqRespText("/cbb/dicCBBgetDicByType.action?dicType=job_type" );
jobType = eval ("(" + jobType + ")");

VIRTUE.query.jdata = { act: VIRTUE.act.QUERY, condition:  {type:4}, operator : {type: OPE.EQUAL} };
VIRTUE.query.init = function(){
	VIRTUE.query.jdata = { act: VIRTUE.act.QUERY, condition: {type:4}, operator : {type: OPE.EQUAL} };
};

function enterKeyDown(event)
{
    if(event.keyCode==13)
    {
    	submitForm();
	}
};

/** validate and assign value **/
function PackingParameter(){
	var formData = $('#s_form').form( 'getData');

	query.init();
	for (var field in formData) {
		if( formData[field] !== "" ){
			query.jdata.condition[field] = formData[field];
			query.jdata.operator[field] = OPE.CONTAIN;
		}
	}
	return true;
};

/** search data ,reload data  **/
function submitForm(){
   	if(!PackingParameter()){
   		return;
   	}
//  jdata = { act: 'query',condition: {'t1.nmlevel': [0,1,2,3]},operator : {'t1.nmlevel' : 13} };
   	$('#grid').datagrid( 'reload', { jdata: encodeURI( $.toJSON( query.jdata ) ) } );
};
/**  清空  **/
function clearForm(){
	$('#s_form').form('clear');
};

/** format level **/
function fmtStatus( n ){
// 	n = new String(n);
	return JSTATENAME[n]==undefined ? n : JSTATENAME[n];
};

/** 删除作业示例，系统不支持此功能   **/
function destroyJob(){
	var row = $('#grid').datagrid('getSelected');
	if ( row && row.status != JSTATE.EXECUTING  ) {
		app.selectedRow = row;
		$.messager.confirm('Confirm','Confirm Remove?',function(r){
			if (r){
				del.init();
				del.jdata.condition.id = row.id;
				del.jdata.operator.id = OPE.EQUAL;

				$.ajax({
				   type: "POST",
				   url: "../../curd/migJobInfoCURDdelete.action",
				   async: false,
				   data: {
					   jdata: encodeURI($.toJSON( del.jdata ))
				   },
				   success: function(oResponse){
// 						alert( oResponse.msg );
	 					if (oResponse.success){
	 						$('#grid').datagrid('reload',{jdata: encodeURI( $.toJSON( query.jdata ) ) } );	// reload data
	 					}
				   }
				});
			}
		});
	}
};


/** 启动作业  **/
function startJob(){
	var row = $('#grid').datagrid('getSelected');
	var index = $('#grid').datagrid('getRowIndex', row);

	if (row && ( row.status == JSTATE.UNEXECUTE || row.status == JSTATE.PAUSE ) ) {
		app.selectedRow = row;
		
		var jdata = { jobId: row.job_id, job_ins_id: row.job_ins_id };
		$.ajax({
		   type: "POST",
		   url: "../../busi/migJobProcessBUSIstartJob.action",
		   async: false,
		   data: {
			   jdata: encodeURI( $.toJSON( jdata ) )
		   },
		   success: function(oResponse){
			   oResponse = eval("("+oResponse+")");
				alert( oResponse.msg );
				if (oResponse.success){
					$('#grid').datagrid('reload',{jdata: encodeURI( $.toJSON( query.jdata ) ) } );	// reload data
				}
		   }
		});
	}
};
/** 暂停作业  **/
function pauseJob(){
	var row = $('#grid').datagrid('getSelected');
	if (row && row.status == JSTATE.EXECUTING ) {
		app.selectedRow = row;
		
		var jdata = { jobId: row.job_id, job_ins_id: row.job_ins_id };
		$.ajax({
		   type: "POST",
		   url: "../../busi/migJobProcessBUSIpauseJob.action",
		   async: false,
		   data: {
			   jdata: encodeURI( $.toJSON( jdata ) )
		   },
		   success: function(oResponse){
			   oResponse = eval("("+oResponse+")");
				alert( oResponse.msg );
				if (oResponse.success){
					$('#grid').datagrid('reload',{jdata: encodeURI( $.toJSON( query.jdata ) ) } );	// reload data
				}
		   }
		});
	}
};

/** 重置作业  **/
function resetJob(){
	var row = $('#grid').datagrid('getSelected');
	if (row ) {
		app.selectedRow = row;
		
		var jdata = { jobId: row.job_id, job_ins_id: row.job_ins_id };
		$.ajax({
		   type: "POST",
		   url: "../../busi/migJobInsBUSImodifyJobStatus2init.action",
		   async: false,
		   data: {
			   jdata: encodeURI( $.toJSON( jdata ) )
		   },
		   success: function(oResponse){
			   oResponse = eval("("+oResponse+")");
				alert( oResponse.msg );
				if (oResponse.success){
					$('#grid').datagrid('reload',{jdata: encodeURI( $.toJSON( query.jdata ) ) } );	// reload data
				}
		   }
		});
	}
};
/** 监控*/
function monitor(index, row){
	if (row ) {
		app.selectedRow = row;
		window.location.href="../../busi/migJobProcessBUSImonitor.action?id="+row.job_ins_id+"&jid="+row.job_id;
		return false;//to support IE6
	}
};
var toolbar = [{
	text:'Monitor',
	iconCls:'icon-monitor',
	handler: function(){
		var row = $('#grid').datagrid('getSelected');
		var index = $('#grid').datagrid('getRowIndex', row);
		monitor(index, row );
		return false;//to support IE6
	}
},{
	text:'Start',
	iconCls:'icon-run',
	handler: function(){
		startJob(); 
	}
},{
	text:'Pause',
	iconCls:'icon-pause',
	handler: function(){
		pauseJob();
	}
},{
	text:'Reset',
	iconCls:'icon-back',
	handler: function(){
		resetJob();
	}
}];
//program component
$(function(){
	$('#grid').datagrid({
		title: 'Search Result',
		//iconCls:'icon-reload',
		toolbar: toolbar,
		width: 938,
		height: 720,
		nowrap: true,
		striped: true,
		fit: true,
// 		collapsible: true,
		url: "../../query/migJobInsJEasyUIQUERYdfind.action",
		idField: "job_ins_id",
		remoteSort: true,
		sortName:"status",
		sortOrder:"desc",
		singleSelect: true,
		columns: [[
		            {title:'Instance ID',field:"job_ins_id", hidden: true},
		            {title:'Job ID',field:"job_id", hidden: true},
		            {
						title : 'Dryrun',
						field : "dryrun",
						width : 120
					},
				    {title:'Instance Name',field:"job_ins_name", width:180, sortable: true},
				    {title:'Instance Type',field:"type", width:120, sortable: true, formatter: function(value,row, index ){
						for(var i=0, j=jobType.length; i<j; i++){
							if( jobType[i].code == value ){
								return jobType[i].value
							}
						}
					} },
					{title:'Author',field:"author",width:80, sortable: true  },
				    {title:'Description',field:"remark",width:280 },
				    {title:'Status',field:"status",width:80, formatter: fmtStatus,sortable: true },
				    {title:'Last Update Time',field:"mtime",width:130 }
		]],
		rownumbers:true,
		pagination:true,
		pageSize: 20,
		queryParams:{
			jdata: encodeURI($.toJSON( query.jdata )) 
		},
		onDblClickRow: monitor
	});

	$('#dryrunId').combogrid({
		url : getContextPath()+"/query/commonCBBQUERYdfind.action",
		queryParams : {
			tableName : "v_dryrun_config",
			columns: "mig_dryrun_name"
		},
		editable:false,
		panelWidth : 500,
		panelHeight : 200,
		idField : 'mig_dryrun_id',
		textField : 'mig_dryrun_name',
		pagination : true,
		fitColumns : false,
		required : true,
		rownumbers : true,
		mode : 'remote',
		delay : 500,
		sortName : 'mig_dryrun_name',
		sortOrder : 'asc',
		pageSize : 5,
		pageList : [ 5, 10 ],
		columns : [ [
			{ title : 'ID', field : 'mig_dryrun_id',width : 90, sortable: true }, 
			{ title : 'Dry Run名称', field : 'mig_dryrun_name', width : 120, sortable: true }, 
			{ title : '备注', field : 'remark',  width : 300 } 
		] ]
	});
});
</script>
</head>
<body rightmargin="0" bottommargin="0" leftmargin="0" topmargin="0" class="easyui-layout">
    <div data-options="region:'north',border:true,split:true" style="height:95px;background:#B3DFDA;" title="Search Condition" >
        <div style="padding:0px 0 0px 15px">  
        <form id="s_form" method="post">  
            <table>  
                <tr>
                	<td>Dryrun:</td>
					<td>
						<input id='dryrunId' name='dryrunId' />
					</td>
                    <td>Instance Name:</td>
                    <td>
                        <input id="jinsname" name="ins_name" value="" 
                        onkeydown="enterKeyDown(event)" style="width:100px;">
                    </td>
                    <td>Author:</td>
                    <td>
                        <input id="jauthor" name="author" value="" onkeydown="enterKeyDown(event)" style="width:100px;">
                    </td>
                	<td></td>
				</tr>
				<tr>
                    <td>Instance Status:</td>
                    <td>
                        <input class="easyui-combobox" 
		                        id='jstatus' name="status" value="" editable="false"
		                        data-options="valueField:'code', textField:'value',url:'../../cbb/dicCBBgetDicByType.action?dicType=job_status',
		                        method:'post'" 
		                        style="width:100px;">
                    </td>
                    <td>Instance Type:</td>
                    <td>
                    	<input class="easyui-combobox" 
	                        id='jtype' name="type"
	                        data-options="valueField:'code', textField:'value',disabled:true,value:4,
	                        data: jobType"/>
                    </td>
                    <td>
                    	<div style="padding:0px 0 0px 15px">
                        	<a href="javascript:void(0)" class="easyui-linkbutton" iconCls="icon-search" onclick="submitForm()">Search</a>
                        </div>
                    </td>
                </tr>
            </table>
        </form>
        </div>
    </div>
    
    <div data-options="region:'center',border:false" title="" style="overflow:hidden;" noheader="true">
		<table id="grid"></table>
	</div>
</body>
</html>
