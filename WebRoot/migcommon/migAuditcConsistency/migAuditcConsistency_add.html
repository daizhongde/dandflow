<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<title>新建</title>
</head>
<body>
<div class="easyui-layout" data-options="fit:true">
	<div data-options="region:'center',border:false" title="" noheader="true">
		<div style="padding:5px 0 5px 5px">
		    <form id="c_form" method="post" action="" style="margin:0;padding:0;">
		    	<table align="center">
					<tr>
		    			<td>Audit Item:</td>
		    			<td><input class="easyui-validatebox" type="text" id="audit_name_C" name="audit_name" data-options="required:true"></input></td>
		    		</tr>
		    		<tr>
		    			<td>Parameter Template:</td>
		    			<td><input class="easyui-validatebox" type="text" id="mig_sql_rep_C" name="mig_sql_rep" data-options="required:false"></input></td>
		    		</tr>
		    		<tr>
		    			<td>Audit SQL:</td>
		    			<td><textarea id="mig_sql_C" name="mig_sql" style="height:150px;width:420px;font-size: 12px;"
		    			 onclick="add.open_sqleditor()" readonly="readonly"></textarea></td>
		    		</tr>
		    		<tr>
		    			<td>DB Connection URL:</td>
			    		<td>
		    				<input id="src_db_connect_C" name="sql_db" type="text" value="" width="300px" ></input>
		    			</td>
	    			</tr>
		    	</table>
		    </form>
		</div>
    </div>
<script type="text/javascript">
var add = VIRTUE.add;

add.submitForm = function (){
	if( ! $('#c_form').form("validate")  )
	{
		return;
	}
	if($('#c_form #mig_sql_C').val() == ""){
		alert("Audit SQL is Required！");
		return;
	}
	var formData = $('#c_form').form( 'getData');
	add.init();
	for (var field in formData) {
		add.jdata.data[field] = formData[field];
	}

	jQuery.post( getContextPath()+"/curd/migAuditcConsistencyCURDadd.action", 
		{
			tableName : tableName,
			jdata : $.toJSON( add.jdata )
		},
		function(oResponse, status){
			alert(oResponse.msg);

			if(oResponse.success == true){
				$('#grid').datagrid('reload',{
					columnNames : "audit_id,audit_name,mig_sql,author,mig_sql_rep,sql_db",
					tableName : tableName,
					jdata: encodeURI($.toJSON( query.jdata ) ) 
				} );
				$('#win').window('close');
			}
	});
};
add.clearForm = function (){
	$('#c_form').form('clear');
};


add.SQLValue = "";

/** 打开sql编辑页面*/
add.open_sqleditor = function(){
	$("#dlg_audit_sql_C").dialog({
		title : "sql",
		href :  "sql_editor_C.html",
		iconCls : 'icon-edit',
		modal : true,
		closed : true,
		resizable: true,
		minimizable: true,
		maximizable: true,
		cache: false,
		width : 840,
		height : 380,
		buttons: [{
            text:'OK',
            iconCls:'icon-ok',
            handler:function(){
            	$("#mig_sql_C").val( add.editor.getValue() );
            	$("#dlg_audit_sql_C").dialog('close');
            }
        },{
            text:'Cancel',
            iconCls:'icon-cancel',
            handler:function(){
            	$("#dlg_audit_sql_C").dialog('close');
            }
        }]
	});
	add.SQLValue = $("#mig_sql_C").val();
	$("#dlg_audit_sql_C").dialog('open');
};
$(function(){
	$('#src_db_connect_C').combogrid({
		url : getContextPath()+"/query/commonCBBQUERYdfind.action",
		panelWidth : 500,
		panelHeight : 200,
		idField : 'url',
		textField : 'name',
		editable : false,
		pagination : false,
		fitColumns : false,
		required : true,
		rownumbers : true,
		mode : 'remote',
		delay : 500,
		sortName : 'url',
		sortOrder : 'asc',
		pageSize : 5,
		pageList : [ 5, 10 ],
		queryParams : {
			tableName : "mig_config_connection",
			columns: "url"
		},
		columns : [ [ {
			field : 'name',
			title : 'Name',
			width : 120,
			sortable : true
		},{
			field : 'url',
			title : 'Connection URL',
			width : 220,
			sortable : true
		}, {
			field : 'remark',
			title : 'Description',
			width : 220,
			sortable : false
		}, {
			field : 'ctime',
			title : 'Create Time',
			width : 130,
			sortable : true
		} ] ]
	});
});
</script>
	<div data-options="region:'south',border:false" style="text-align:right;padding:5px 5px 5px 0;background:#F4F4F4;">
		<a class="easyui-linkbutton" data-options="iconCls:'icon-ok'" href="javascript:void(0)" onclick="javascript:add.submitForm()" style="width:80px">Submit</a>
		<a class="easyui-linkbutton" data-options="iconCls:'icon-cancel'" href="javascript:void(0)" onclick="javascript:$('#win').dialog('close');" style="width:80px">Cancel</a>
	</div>
	
	<div id="dlg_audit_sql_C"></div>
	
</div>
</body>
</html>
