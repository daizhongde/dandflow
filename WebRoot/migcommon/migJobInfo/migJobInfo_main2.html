<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
<title>作业实例化(depecate)</title>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<link rel="stylesheet" type="text/css" href="../../scripts/jquery-easyui/1.4.1/themes/default/easyui.css"/>
<link rel="stylesheet" type="text/css" href="../../scripts/jquery-easyui/1.4.1/themes/icon.css"/>
<script type="text/javascript" src="../../scripts/jquery-easyui/1.4.1/jquery.min.js"></script>
<script type="text/javascript" src="../../scripts/jquery-easyui/1.4.1/jquery.easyui.min.js"></script>
<!-- <script type="text/javascript" src="../../scripts/jquery-easyui/1.4.1/locale/easyui-lang-zh_CN.js"></script> -->
<script type="text/javascript" src="../../scripts/json/jquery.json-2.2.min.js"></script>

<script type="text/javascript" src="../../scripts/jquery-easyui/1.4.1/plugins/easyuiExtends.js"></script>
<script type="text/javascript" src="../../scripts/virtue/virtue.js"></script>
<script type="text/javascript" src="../../scripts/const/const.js"></script>
<script type="text/javascript" src="../../scripts/utils/commonUtil.js"></script>

<script type="text/javascript">
var noquery = VIRTUE.noquery;
var query = VIRTUE.query;
var OPE = VIRTUE.operator;
var del = VIRTUE.del;

var app={};
app.selectedRow = {};//记录数据表格中选择中的行

var jobType = ajaxReqRespText("/cbb/dicCBBgetDicByType.action?dicType=job_type" );
jobType = eval ("(" + jobType + ")");

query.jdata.condition.type = '1';
query.jdata.operator.type = OPE.EQUAL;

/** validate and assign value **/
function PackingParameter(){
	var name = $('#jname').val();
	var type = $('#jtype').combobox("getValue");
	var author = $('#jauthor').val();
	
// 	alert("status:"+status);
	query.init();
	if(name != ""){
		query.jdata.condition.name = name;
		query.jdata.operator.name = OPE.CONTAIN;
	}
	if(type != "" && type != null){
		query.jdata.condition.type = type;
		query.jdata.operator.type = OPE.EQUAL;
	}
	if(author != ""){
		query.jdata.condition.author = author;
		query.jdata.operator.author = OPE.CONTAIN;
	}
	return true;
};

/** search data ,reload data  **/
function submitForm(){
   	if(!PackingParameter()){
   		return;
   	}
//  jdata = { act: 'query',condition: {'t1.nmlevel': [0,1,2,3]},operator : {'t1.nmlevel' : 13} };
   	$('#grid').datagrid( 'reload', { jdata: encodeURI( $.toJSON( query.jdata ) ) } );
};
/**  清空  **/
function clearForm(){
	$('#form').form('clear');
};

/** 实例化作业   **/
function instanceJob(){
	var row = $('#grid').datagrid('getSelected');
	if (row ) {
		app.selectedRow = row;

		$("#instanceJobParam").dialog({
			title : "Parameter Setting",
			href :  getContextPath()+'/migcommon/migJobPara/migJobPara_instance.html',
			iconCls : 'icon-edit',
			modal : true,
			closed : true,
			resizable: true,
			minimizable: true,
			maximizable: true,
			cache: false,
			width : 750,
			height : 450,
			buttons: [{
	            text:'OK',
	            iconCls:'icon-ok',
	            handler:function(){
	            	app.instanceJobParam( );
	            	return false;//for IE6 support
	            }
	        },{
	            text:'Cancel',
	            iconCls:'icon-cancel',
	            handler:function(){
	            	$("#instanceJobParam").dialog('close');
	            }
	        }]
		});
		$("#instanceJobParam").dialog('open');
	}
};

app.instanceJobParam = function(){
	if( ! $('#instanceJob_form').form("validate")
			|| app.jobparaloaded==false
			){
		return;
	}
	
	var formData = $('#instanceJob_form').form('getData', true);
	var rows = $('#jobparam_grid').datagrid( 'getRows');
	
	var jdata = {
		jobId: app.selectedRow.id, 
		type: app.selectedRow.type, 
		jobInsName: formData.jobInsName,
		dryrunId: formData.dryrunId,
		rows: rows
	};

	$.ajax({
	   type: "POST",
	   url: "../../busi/migJobInfoBUSIinstanceJob.action",
	   async: false,
	   data: {
		   jdata: $.toJSON( jdata )
	   },
		success: function(oResponse){
			oResponse = eval("("+oResponse+")");
			alert( oResponse.msg );
// 			console.log(oResponse.success);
// 			$("#instanceJobParam").dialog('close');
			if (oResponse.success){
// 				$('#grid').datagrid('reload',{jdata: encodeURI( $.toJSON( query.jdata ) ) } );	// reload data
				$("#instanceJobParam").dialog('close');
			}
	   }
	});
};
/** 查看作业  **/
function view(){
	var row = $('#grid').datagrid('getSelected');
	if (row) {
		app.selectedRow = row;
		window.location.href="../../curd/migJobInfoCURDbrowse.action?id="+row.id;
		return false;//to support IE6
	}
};
var toolbar = [{
	text:'View Job',
	iconCls:'icon-search',
	handler:function(){
		view();
		return false;
	}
},{
	text:'Instance Job',
	iconCls:'icon-redo',
	handler: function(){ 
		instanceJob(); 
	}
}];
//program component
$(function(){
	$('#grid').datagrid({
		title: 'Search Result',
		//iconCls:'icon-reload',
		toolbar: toolbar,
		width: 938,
		height: 720,
		nowrap: true,
		striped: true,
		fit: true,
// 		collapsible: true,
		url: "../../query/migJobInfoJEasyUIQUERYdfind.action",
		idField: "id",
		remoteSort: true,
		sortName:"id",
		sortOrder:"desc",
		singleSelect: true,
		columns: [[
            {title:'ID',field:"id", hidden: true},
		    {title:'Job Name',field:"name", width:280, sortable: true},
		    {title:'Job Type',field:"type", width:120, sortable: true, formatter: function(value,row, index ){
				for(var i=0, j=jobType.length; i<j; i++){
					if( jobType[i].code == value ){
						return jobType[i].value
					}
				}
			} },
			{title:'Author',field:"author",width:80, sortable: true  },
		    {title:'Description',field:"remark",width:280  },
		    {title:'Last Update Time',field:"updatetime",width:130 }
		]],
		rownumbers:true,
		pagination:true,
		pageSize: 20,
		queryParams:{
			jdata: encodeURI($.toJSON( query.jdata )) 
		},
		onDblClickRow: view
	});

});
</script>
</head>
<body rightmargin="0" bottommargin="0" leftmargin="0" topmargin="0" class="easyui-layout">
    <div data-options="region:'north',border:true,split:true" style="height:70px;background:#B3DFDA;" title="Search Condition" >  
        <div style="padding:0px 0 0px 15px">  
        <form id="form" method="post">  
            <table>  
                <tr>
                    <td>Job Name:</td>
                    <td>
                        <input id="jname" name="name" value="" style="width:100px;">
                    </td>
                    <td>Job Type:</td>
                    <td>
						<input class="easyui-combobox" 
	                        id='jtype' name="type" value="" editable="false"
	                        data-options="valueField:'code', textField:'value',value:'1',
	                        data: jobType"/>
                    </td>
                    <td>Author:</td>
                    <td>
                        <input id="jauthor" name="author" value="" style="width:100px;">
                    </td>
                    <td>
                    	<div style="padding:0px 0 0px 15px">
                        	<a href="javascript:void(0)" class="easyui-linkbutton" iconCls="icon-search" onclick="submitForm()">Search</a>
                        	<a href="javascript:void(0)" class="easyui-linkbutton" iconCls="icon-clear" onclick="clearForm()">Clear</a>
                        </div>
                    </td>
                </tr>
            </table>
        </form>
        </div>
    </div>
    
    <div data-options="region:'center',border:false" title="" style="overflow:hidden;" noheader="true">
		<table id="grid"></table>
	</div>
	
	<div id="instanceJobParam"></div>
</body>
</html>
