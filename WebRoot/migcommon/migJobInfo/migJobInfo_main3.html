<html>
<head>
<title>作业选择界面</title>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<style type="text/css">

</style>
<script type="text/javascript" src="../../scripts/jquery-easyui/1.4.1/jquery.min.js"></script>
<script type="text/javascript" src="../../scripts/jquery-easyui/1.4.1/jquery.easyui.min.js"></script>

</head>
<body>
<script type="text/javascript">
function enterKeyDown(event)
{
    if(event.keyCode==13)
    {
    	pubSubmitForm('job');
	}
};

</script>
<div class="easyui-layout" fit="true">
    <div data-options="region:'center', border:false" title="" style="overflow:hidden;" noheader="true">
		<table id="job_grid" class="easyui-datagrid" style="width:462px;height:268px"
			data-options="rownumbers:true,
			toolbar:'#tb',
			fit : true,
			showHeader: true, 
			showFooter: false, 
			selectOnCheck:true,
			checkOnSelect:true,
			singleSelect: true,
			idField: 'id',
			pagination : true,
			url:getContextPath()+'/query/migJobInfoJEasyUIQUERYdfind.action',
			method:'post',
			queryParams:{
				jdata : encodeURI( $.toJSON( {act:'',condition:{},operator:{}} ) )
			}">
			<thead>
				<tr>
					<th data-options="field:'ck', checkbox: true"></th>
					<th data-options="field:'name', width: 280">Job Name</th>
					<th data-options="field:'type', width: 120,formatter: 
					function(value,row, index ){
						for(var i=0, j=jobType.length; i<j; i++){if( jobType[i].code == value ){return jobType[i].value}}
					}">Job Type</th>
					<th data-options="field:'author', width: 120">Author</th>
					<th data-options="field:'remark', width:120">Description</th>
					<th data-options="field:'updatetime', width:120, sortable: true">Last Update Time</th>
				</tr>
			</thead>
		</table>
	</div>
	<div id="tb" style="padding:2px 5px;">
		<form id="job_sform" method="post" style="margin:0;padding:0;">
		Job Name: <input id="jname" name="name" value="" style="width:70px;" onkeydown="enterKeyDown(event)">
		Job Type: <input class="easyui-combobox" 
                        id='jtype' name="type" value="" editable="false" 
                        data-options="valueField:'code', textField:'value', data: jobType,
        onChange: function(newValue, oldValue){
        	pubSubmitForm('job');
        }"/>
		Author: <input id="jauthor" name="author" value="" style="width:70px;" onkeydown="enterKeyDown(event)">
		<a href="#" class="easyui-linkbutton" iconCls="icon-search" onclick="pubSubmitForm('job')">Search</a>
		</form>
	</div>
</div>
</body>
</html>
