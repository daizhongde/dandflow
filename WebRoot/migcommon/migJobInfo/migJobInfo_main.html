<html>
<head>
<title>作业定义管理</title>

	href="../../scripts/jquery-easyui/1.4.1/themes/icon.css" />

	src="../../scripts/jquery-easyui/1.4.1/jquery.min.js"></script>

<script type="text/javascript">
var noquery = VIRTUE.noquery;
var query = VIRTUE.query;
var OPE = VIRTUE.operator;
var del = VIRTUE.del;

var app = {};
app.selectedRow = {};//记录数据表格中选择中的行

var jobType = ajaxReqRespText("/cbb/dicCBBgetDicByType.action?dicType=job_type");
jobType = eval("(" + jobType + ")");

var author = ajaxReqRespText("/common/commonCommoncurrentUserLogname.action");

query.jdata.condition.type = '1';
query.jdata.operator.type = OPE.EQUAL;

var buttons = ajaxReqRespText("/curd/tAuthorityRmrelationCURDfindUserButton4tb.action?id=10036");
// console.log("buttons:"+buttons);
buttons = eval("(" + buttons + ")");

function enterKeyDown(event)
{
    if(event.keyCode==13)
    {
    	submitForm();
	}
};

/** validate and assign value **/
function PackingParameter() {
	var name = $('#jname').val();
	var type = $('#jtype').combobox("getValue");
	var author = $('#jauthor').val();

	query.init();
	if (name != "") {
		query.jdata.condition.name = name;
		query.jdata.operator.name = OPE.CONTAIN;
	}
	if (type != "" && type != null) {
		query.jdata.condition.type = type;
		query.jdata.operator.type = OPE.EQUAL;
	}
	if (author != "") {
		query.jdata.condition.author = author;
		query.jdata.operator.author = OPE.CONTAIN;
	}
	return true;
};

/** search data ,reload data  **/
function submitForm() {
	if (!PackingParameter()) {
		return;
	}
	$('#grid').datagrid('reload', {
		jdata : encodeURI($.toJSON(query.jdata))
	});
};
/**  清空  **/
function clearForm() {
	$('#form').form('clear');
};
/**  新增  **/
function create_Record(){
	window.location.href = "../../job/job_new.html";
	return false;
};
function update_Record() {
	var rows = $('#grid').datagrid('getSelections');	
  	if(rows.length!=1){	alert("Please select one row!");return false;}
  	var row = $('#grid').datagrid('getSelected');
  	if (row) {
		app.selectedRow = row;
		window.location.href = "../../curd/migJobInfoCURDinitModify.action?id="+ row.id;
		return false;//to support IE6
	}
};
function update_Record1() {
	var rows = $('#grid').datagrid('getSelections');	
  	if(rows.length!=1){	alert("Please select one row!");return false;}
  	var row = $('#grid').datagrid('getSelected');
  	if (row.author != author) {
		alert("You can't edit other's job!");
		return;
	};
  	if (row) {
		app.selectedRow = row;
		window.location.href = "../../curd/migJobInfoCURDinitModify.action?id="+ row.id;
		return false;//to support IE6
	}
};
function delete_Record(){
	var rows = $('#grid').datagrid('getSelections');
	
	if (rows.length != 0 ) {
		$.messager.confirm('Confirm', 'Confirm Remove?', function(r) {
			if (r) {
				var job_id = new Array();
				for(var i=0; i<rows.length; i++ ){
					job_id.push(rows[i].id);
				}
				
				var jdata = { job_id: job_id };
				$.ajax({
				   type: "POST",
				   url: "../../busi/migJobInfoBUSIremoveJob.action",
				   async: false,
				   data: {
					   jdata: encodeURI( $.toJSON( jdata ) )
				   },
				   success: function(oResponse){
					   oResponse = eval("("+oResponse+")");
						alert( oResponse.msg );
						if (oResponse.success){
							$('#grid').datagrid('reload',{jdata: encodeURI( $.toJSON( query.jdata ) ) } );	// reload data
						}
				   }
				});
			}
		});
	}
};
function delete_Record1(){
	var rows = $('#grid').datagrid('getSelections');
	
	if (rows.length != 0 ) {
		for(var i=0; i<rows.length; i++ ){
			if( rows[i].author != author ){
				alert("You can't remove other's job!");
				return;
			}
		}
		$.messager.confirm('Confirm', 'Confirm Remove?', function(r) {
			if (r) {
				var job_id = new Array();
				for(var i=0; i<rows.length; i++ ){
					job_id.push(rows[i].id);
				}
				
				var jdata = { job_id: job_id };
				$.ajax({
				   type: "POST",
				   url: "../../busi/migJobInfoBUSIremoveJob.action",
				   async: false,
				   data: {
					   jdata: encodeURI( $.toJSON( jdata ) )
				   },
				   success: function(oResponse){
					   oResponse = eval("("+oResponse+")");
						alert( oResponse.msg );
						if (oResponse.success){
							$('#grid').datagrid('reload',{jdata: encodeURI( $.toJSON( query.jdata ) ) } );	// reload data
						}
				   }
				});
			}
		});
	}
};
/** 查看作业  **/
function read_Record() {
	var rows = $('#grid').datagrid('getSelections');
	if(rows.length!=1){
		alert("Please select one row!");
		return false;
	};
	var row = $('#grid').datagrid('getSelected');
	if (row) {
		app.selectedRow = row;
		window.location.href = "../../curd/migJobInfoCURDbrowse.action?id="
				+ row.id;
		return false;//to support IE6
	}
};
/** 导入作业excel文件  */
function importJobExcelFile() {
	$("#importJobExcelFile").dialog(
			{
				title : "Import",
				href : getContextPath()
						+ "/migcommon/migJobInfo/migJobInfo_import.html",
				iconCls : 'icon-edit',
				modal : true,
				closed : true,
				resizable : true,
				minimizable : true,
				maximizable : true,
				cache : false,
				width : 800,
				height : 150,
				buttons : [ {
					id: 'imp_btn',
					text : 'OK',
					iconCls : 'icon-ok',
					handler : function() {
						btnExcelI_onClick();
						$('#imp_btn').linkbutton('disable');
						return false;//for IE6 support
					}
				}, {
					text : 'Cancel',
					iconCls : 'icon-cancel',
					handler : function() {
						$('#importJobExcelFile').dialog('close');
					}
				} ]
			});
	$("#importJobExcelFile").dialog('open');
};

/**  上传前检查，并从数据库获取该批次的社保机构号   **/
function btnExcelI_onClick() {
	var path = document.getElementById("upload").value;
	if (path == "") {
		alert("Please select file！");
		return;
	}
	ajaxFileUpload();
};

/**  上传  **/
function ajaxFileUpload() {
	$("#loading").ajaxStart(function() {
		$(this).show();
	}).ajaxComplete(function() {
		$(this).hide();
	});
	$("#loading").show();
	$.ajaxFileUpload({
		url : getContextPath() + "/imp/migJobInfoIMPimportXLS.action",
		secureuri : false,
		fileElementId : 'upload',
		//data: "",
		dataType : 'text',
		success : function(data, status) {
			data = eval("(" + data + ")");
			alert(data.msg);
			if (data.success) {
				$('#importJobExcelFile').dialog('close');
				submitForm();
			}
			$("#loading").hide();
		},
		error : function(data, status, e) {
			alert("Error:" + data + ",exception:" + e);
			$("#loading").hide();
		}
	});
};
/** 实例化作业   **/
function instanceJob(){
	var rows = $('#grid').datagrid('getSelections');
	if(rows.length!=1){
		alert("Please select one row!");
		return false;
	};
	var row = $('#grid').datagrid('getSelected');
	if (row ) {
		app.selectedRow = row;

		$("#instanceJobParam").dialog({
			title : "Parameter Setting",
			href :  getContextPath()+'/migcommon/migJobPara/migJobPara_instance.html',
			iconCls : 'icon-edit',
			modal : true,
			closed : true,
			resizable: true,
			minimizable: true,
			maximizable: true,
			cache: false,
			width : 750,
			height : 450,
			buttons: [{
	            text:'OK',
	            iconCls:'icon-ok',
	            handler:function(){
	            	app.instanceJobParam( );
	            	return false;//for IE6 support
	            }
	        },{
	            text:'Cancel',
	            iconCls:'icon-cancel',
	            handler:function(){
	            	$("#instanceJobParam").dialog('close');
	            }
	        }]
		});
		$("#instanceJobParam").dialog('open');
	}
};
app.instanceJobParam = function(){
	if( ! $('#instanceJob_form').form("validate")
			|| app.jobparaloaded==false
			){
		return;
	}
	
	var formData = $('#instanceJob_form').form('getData', true);
	var rows = $('#jobparam_grid').datagrid( 'getRows');
	
	var jdata = {
		jobId: app.selectedRow.id, 
		type: app.selectedRow.type, 
		jobInsName: formData.jobInsName,
		dryrunId: formData.dryrunId,
		rows: rows
	};

	$.ajax({
	   type: "POST",
	   url: "../../busi/migJobInfoBUSIinstanceJob.action",
	   async: false,
	   data: {
		   jdata: encodeURI( $.toJSON( jdata ) )
	   },
		success: function(oResponse){
			oResponse = eval("("+oResponse+")");
			alert( oResponse.msg );
			if (oResponse.success){
				$("#instanceJobParam").dialog('close');
			}
	   }
	});
};
/*  四层权限，方式一 
 * 使用了四 层权限的三个菜单：
 作业、实例、合法性稽核
 */
var tb={};
tb.create_btn = { text : 'New Job',iconCls : 'icon-add', disabled : false,handler : function(){ create_Record(); return false; }};
tb.update_btn = { text : 'Edit', iconCls : 'icon-edit', handler : function(){ update_Record(); return false; }};
tb.update_btn1 = { text : 'Edit1', iconCls : 'icon-edit', handler : function(){ update_Record1(); return false; }};
tb.read_btn = { text : 'View', iconCls : 'icon-search', handler : function(){ read_Record(); return false; } };
tb.delete_btn = { text : 'Remove', iconCls : 'icon-remove', handler : function(){ delete_Record(); }};
tb.delete_btn1 = { text : 'Remove1', iconCls : 'icon-remove', handler : function(){ delete_Record1(); }};
tb.import_btn = { text : 'Import Job', iconCls : 'icon-import',	handler : function(){ importJobExcelFile(); return false;}	};
tb.btn15 = { text : 'Instance Job', iconCls:'icon-redo', handler: function(){ instanceJob(); return false; } };

var toolbar = [];
if( buttons.create_btn==1 ){ toolbar.push(tb.create_btn) };
if( buttons.update_btn==1 ){ toolbar.push(tb.update_btn) };
if( buttons.update_btn1==1 ){ toolbar.push(tb.update_btn1) };
if( buttons.read_btn==1 ){ toolbar.push(tb.read_btn) };
if( buttons.delete_btn==1 ){ toolbar.push(tb.delete_btn) };
if( buttons.delete_btn1==1 ){ toolbar.push(tb.delete_btn1) };
if( buttons.import_btn==1 ){ toolbar.push(tb.import_btn) };
if( buttons.btn15==1 ){ toolbar.push(tb.btn15) };

// var toolbar = 
// [{ text : 'New Job',iconCls : 'icon-add', disabled : false,handler : function(){ create_Record(); return false; }},
// 	{ text : 'Edit Job', iconCls : 'icon-edit', handler : function(){ update_Record(); return false; }},
// 	{ text : 'Edit Job', iconCls : 'icon-edit', handler : function(){ update_Record1(); return false; }},
// 	{ text : 'View Job', iconCls : 'icon-search', handler : function(){ read_Record(); return false; } },
// 	{ text : 'Remove', iconCls : 'icon-remove', handler : function(){ delete_Record(); }},
// 	{ text : 'Remove1', iconCls : 'icon-remove', handler : function(){ delete_Record1(); }},
// 	{ text : 'Import Job', iconCls : 'icon-import',	handler : function(){ importJobExcelFile(); return false;}	},
// 	{ text : 'Instance Job', iconCls:'icon-redo', handler: function(){ instanceJob(); return false; } } 
// 	];

$(function() {
	$('#grid').datagrid({
		title : 'Search Result',
		toolbar : toolbar,
		width : 938,
		height : 720,
		nowrap : true,
		striped : true,
		fit : true,
		url : "../../query/migJobInfoJEasyUIQUERYdfind.action",
		idField : "id",
		remoteSort : true,
		sortName : "id",
		sortOrder : "desc",
		singleSelect : false,
		columns : [ [ {
			title : 'ID',
			field : "id",
			hidden : true
		}, {
			title : 'Job Name',
			field : "name",
			width : 280,
			sortable : true
		}, {
			title : 'Job Type',
			field : "type",
			width : 120,
			sortable : true,
			formatter : function(value, row, index) {
				for (var i = 0, j = jobType.length; i < j; i++) {
					if (jobType[i].code == value) {
						return jobType[i].value
					}
				}
			}
		}, {
			title : 'Author',
			field : "author",
			width : 80,
			sortable : true
		}, {
			title : 'Description',
			field : "remark",
			width : 280
		}, {
			title : 'Last Update Time',
			field : "updatetime",
			width : 130,
			sortable : true
		} ] ],
		rownumbers : true,
		pagination : true,
		pageSize : 20,
		queryParams : {
			jdata : encodeURI($.toJSON(noquery.jdata))
		},
		onDblClickRow: function(index,row){
			window.location.href = "../../curd/migJobInfoCURDinitModify.action?id="
					+ row.id;
			return false;//to support IE6
		},
		onLoadSuccess: function(pageNumber, pageSize){
			$('#grid').datagrid('clearSelections');
		}
	});

});
</script>
</head>
<body rightmargin="0" bottommargin="0" leftmargin="0" topmargin="0"
	class="easyui-layout">
	<div data-options="region:'north',border:true,split:true"
		style="height:70px;background:#B3DFDA;" title="Job definition management--Search Condition">
		<form id="form" method="post" style="margin:0;padding:0;">
			<div style="padding:0px 0 0px 5px">
				<table>
					<tr>
						<td>Job Name:</td>
						<td><input id="jname" name="name" value="" onkeydown="enterKeyDown(event)"
							style="width:100px;"></td>
						<td>Job Type:</td>
						<td><input class="easyui-combobox" id='jtype' name="type" 
							editable="false" 
							data-options="valueField:'code', textField:'value',value:'1',
                        data: jobType,
                        onChange: function(newValue, oldValue){
                        	submitForm();
                        }" />

						</td>
						<td>Author:</td>
						<td><input id="jauthor" name="author" value="" onkeydown="enterKeyDown(event)"
							style="width:100px;"></td>
						<td>
							<div style="padding:0px 0 0px 15px">
								<a href="javascript:void(0)" class="easyui-linkbutton"
									iconCls="icon-search" onclick="submitForm()">Search</a> <a
									href="javascript:void(0)" class="easyui-linkbutton"
									iconCls="icon-clear" onclick="clearForm()">Clear</a>
							</div>
						</td>
					</tr>
				</table>
			</div>
		</form>
	</div>

	<div data-options="region:'center',border:false" title=""
		style="overflow:hidden;" noheader="true">
		<table id="grid"></table>
	</div>

	<div id="importJobExcelFile"></div>

	<div id="instanceJobParam"></div>

</body>
