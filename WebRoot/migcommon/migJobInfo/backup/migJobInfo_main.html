<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
<title>作业定义管理</title>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
<link rel="stylesheet" type="text/css" href="../../scripts/jquery-easyui/1.4.1/themes/default/easyui.css"/>
<link rel="stylesheet" type="text/css" href="../../scripts/jquery-easyui/1.4.1/themes/icon.css"/>
<script type="text/javascript" src="../../scripts/jquery-1.4.4.min.js"></script>
<script type="text/javascript" src="../../scripts/jquery-easyui/1.4.1/jquery.easyui.min.js"></script>
<!-- <script type="text/javascript" src="../../scripts/jquery-easyui/1.4.1/locale/easyui-lang-zh_CN.js"></script> -->
<script type="text/javascript" src="../../scripts/json/jquery.json-2.2.min.js"></script>

<script type="text/javascript" src="../../scripts/virtue/virtue.js"></script>
<script type="text/javascript" src="../../scripts/const/const.js"></script>
<script type="text/javascript" src="../../scripts/utils/commonUtil.js"></script>
<script type="text/javascript" src="../../scripts/ajaxfileupload.js"></script>

<script type="text/javascript">
var noquery = VIRTUE.noquery;
var query = VIRTUE.query;
var OPE = VIRTUE.operator;
var del = VIRTUE.del;

var app={};
app.selectedRow = {};//记录数据表格中选择中的行

var jobType = ajaxReqRespText("/cbb/dicCBBgetDicByType.action?dicType=job_type" );
jobType = eval ("(" + jobType + ")");

/** validate and assign value **/
function PackingParameter(){
	var name = $('#jname').val();
// 	var type = $('#jtype').val();
	var type = $('#jtype').combobox("getValue");
	var author = $('#jauthor').val();
	
// 	alert("status:"+status);
	query.init();
	if(name != ""){
		query.jdata.condition.name = name;
		query.jdata.operator.name = OPE.CONTAIN;
	}
	if(type != "" && type != null){
		query.jdata.condition.type = type;
		query.jdata.operator.type = OPE.EQUAL;
	}
	if(author != ""){
		query.jdata.condition.author = author;
		query.jdata.operator.author = OPE.CONTAIN;
	}
	return true;
};

/** search data ,reload data  **/
function submitForm(){
   	if(!PackingParameter()){
   		return;
   	}
//  jdata = { act: 'query',condition: {'t1.nmlevel': [0,1,2,3]},operator : {'t1.nmlevel' : 13} };
   	$('#grid').datagrid( 'reload', { jdata: encodeURI( $.toJSON( query.jdata ) ) } );
};
/**  清空  **/
function clearForm(){
	$('#form').form('clear');
};

/** 删除作业   **/
function destroyJob(){
	var row = $('#grid').datagrid('getSelected');
	if ( row ) {
		app.selectedRow = row;
		$.messager.confirm('Confirm','Confirm Remove?',function(r){
			if (r){
				del.init();
				del.jdata.condition.id = row.id;
				del.jdata.operator.id = OPE.EQUAL;

				$.ajax({
				   type: "POST",
				   url: "../../curd/migJobInfoCURDdelete.action",
				   async: false,
				   data: {
					   jdata: encodeURI($.toJSON( del.jdata ))
				   },
				   success: function(oResponse){
	 					if (oResponse.success){
	 						$('#grid').datagrid('reload',{jdata: encodeURI( $.toJSON( query.jdata ) ) } );	// reload data
	 					}else{
	 						alert( oResponse.msg );
	 					}
				   }
				});
			}
		});
	}
};


/** 递归删除作业   **/
function destroyJobRecursion(){
	var row = $('#grid').datagrid('getSelected');
	if ( row ) {
		app.selectedRow = row;
		$.messager.confirm('Confirm','确认递归删除吗?',function(r){
			if (r){
				del.init();
				del.jdata.condition.id = row.id;
				del.jdata.operator.id = OPE.EQUAL;

				$.ajax({
				   type: "POST",
				   url: "../../curd/migJobInfoCURDdeleteRecursion.action",
				   async: false,
				   data: {
					   jdata: encodeURI($.toJSON( del.jdata ))
				   },
				   success: function(oResponse){
	 					if (oResponse.success){
	 						$('#grid').datagrid('reload',{jdata: encodeURI( $.toJSON( query.jdata ) ) } );	// reload data
	 					}else{
	 						alert( oResponse.msg );
	 					}
				   }
				});
			}
		});
	}
};

/** 查看作业  **/
function view(){
	var row = $('#grid').datagrid('getSelected');
	if (row) {
		app.selectedRow = row;
		window.location.href="../../curd/migJobInfoCURDbrowse.action?id="+row.id;
		return false;//to support IE6
	}
};
/** 导入作业excel文件 
 * 
 */
function importJobExcelFile(){
	$("#importJobExcelFile").dialog({
		title : "Import",
		href :  getContextPath()+"/migcommon/migJobInfo/migJobInfo_import.html",
		iconCls : 'icon-edit',
		modal : true,
		closed : true,
		resizable: true,
		minimizable: true,
		maximizable: true,
		cache: false,
		width : 800,
		height : 150,
		buttons: [{
            text:'OK',
            iconCls:'icon-ok',
            handler:function(){
            	btnExcelI_onClick();
            	return false;//for IE6 support
            }
        },{
            text:'Cancel',
            iconCls:'icon-cancel',
            handler:function(){
            	$('#importJobExcelFile').dialog('close');
            }
        }]
	});
	$("#importJobExcelFile").dialog('open');
};


/**  上传前检查，并从数据库获取该批次的社保机构号   **/
function btnExcelI_onClick(){
	var path = document.getElementById("upload").value;
	if(path==""){
		alert("Please select file！");
		return;
	}
	ajaxFileUpload();
};

/**  上传  **/
function ajaxFileUpload(){
	$("#loading")
	.ajaxStart(function(){
		$(this).show();
	})
	.ajaxComplete(function(){
		$(this).hide();
	});

	$.ajaxFileUpload({
		url: getContextPath()+"/imp/migJobInfoIMPimportXLS.action",
		secureuri:false,
		fileElementId:'upload',
		//data: "",
		dataType: 'text',
		success: function (data, status){
			data = eval ("(" + data + ")");
			alert(data.msg);
			if(data.success){
				$('#importJobExcelFile').dialog('close');
				submitForm();
			}
		},
		error: function (data, status, e){
			alert("Error:"+data+",exception:"+e);
// 			$('#dlg').dialog('close');
		}
	});
}

var toolbar = [{
	text:'New Job',
	iconCls:'icon-add',
	disabled: false,
	handler:function(){
		window.location.href="../../job/job_new.html";
// 		window.location.href="migJobInfo_add.html";
		return false;//to support IE6
	}
},{
	text:'Edit Job',
	iconCls:'icon-edit',
	handler:function(){
		var row = $('#grid').datagrid('getSelected');
		if (row) {
			app.selectedRow = row;
			window.location.href="../../curd/migJobInfoCURDinitModify.action?id="+row.id;
			return false;//to support IE6
		}
	}
},{
	text:'Remove Job',
	iconCls:'icon-remove',
	handler:function(){
		destroyJob();
	}
},{
	text:'View Job',
	iconCls:'icon-search',
	handler:function(){
		view();
		return false;
	}
},{
	text:'Import Job',
	iconCls:'icon-import',
	handler:function(){
		importJobExcelFile();
		return false;
	}
}];
//program component
$(function(){
	$('#grid').datagrid({
		title: 'Search Result',
		//iconCls:'icon-reload',
		toolbar: toolbar,
		width: 938,
		height: 720,
		nowrap: true,
		striped: true,
		fit: true,
// 		collapsible: true,
		url: "../../query/migJobInfoJEasyUIQUERYdfind.action",
		idField: "id",
		remoteSort: true,
		sortName:"id",
		sortOrder:"desc",
		singleSelect: true,
		columns: [[
            {title:'ID',field:"id", hidden: true},
		    {title:'Job Name',field:"name", width:180, sortable: true},
		    {title:'Job Type',field:"type", width:120, sortable: true, formatter: function(value,row, index ){
				for(var i=0, j=jobType.length; i<j; i++){
					if( jobType[i].code == value ){
						return jobType[i].value
					}
				}
			} },
			{title:'Author',field:"author",width:80, sortable: true  },
		    {title:'Description',field:"remark",width:280 },
		    {title:'Last Update Time',field:"updatetime",width:130, sortable: true }
		]],
		rownumbers:true,
		pagination:true,
		pageSize: 20,
		queryParams:{
			jdata: encodeURI($.toJSON( query.jdata )) 
		}
// 		onDblClickRow: view
	});

});
</script>
</head>
<body rightmargin="0" bottommargin="0" leftmargin="0" topmargin="0" class="easyui-layout">
    <div data-options="region:'north',border:true,split:true" style="height:70px;background:#B3DFDA;" title="Search Condition" >  
        <div style="padding:0px 0 0px 15px">  
        <form id="form" method="post">  
            <table>  
                <tr>
                    <td>Job Name:</td>
                    <td>
                        <input id="jname" name="name" value="" style="width:100px;">
                    </td>
                    <td>Job Type:</td>
                    <td>
                    <!-- 
                    	<select id="jtype" name="type">
					  <option value ="">-选择-</option>
					  <option value ="1">一般作业</option>
					  <option value ="2">字段级稽核作业</option>
					  <option value ="3">合法性稽核作业</option>
					  <option value ="4">一致性稽核作业</option>
					</select> 
					url:'../../cbb/dicCBBgetDicByType.action?dicType=job_type', method:'post'
					-->
					<input class="easyui-combobox" 
                        id='jtype' name="type" value="" editable="false"
                        data-options="valueField:'code', textField:'value',
                        data: jobType"/>
                        
                    </td>
                    <td>Author:</td>
                    <td>
                        <input id="jauthor" name="author" value="" style="width:100px;">
                    </td>
                    <td>
                    	<div style="padding:0px 0 0px 15px">
                        	<a href="javascript:void(0)" class="easyui-linkbutton" iconCls="icon-search" onclick="submitForm()">Search</a>
                        	<a href="javascript:void(0)" class="easyui-linkbutton" iconCls="icon-clear" onclick="clearForm()">Clear</a>
                        </div>
                    </td>
                </tr>
            </table>
        </form>
        </div>
    </div>
    
    <div data-options="region:'center',border:false" title="" style="overflow:hidden;" noheader="true">
		<table id="grid"></table>
	</div>
	
	<div id="importJobExcelFile"></div>
	
</body>
</html>
