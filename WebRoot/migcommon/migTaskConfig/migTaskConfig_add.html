<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<title>新建</title>
</head>
<body>
<div class="easyui-layout" data-options="fit:true">
	<div data-options="region:'center',border:false" title="" noheader="true">
	<div style="padding:10px 0 10px 5px">
	    <form id="c_form" method="post" action="" style="margin:0;padding:0;">
	    	<table align="center">
	    		<tr>
	    			<td>Config Type:</td>
	    			<td>
	    				<input class="easyui-combobox" 
		                        id='mig_config_type_C' name="mig_config_type" value="" 
		                        data-options="valueField:'code', textField:'value',
		                        editable:false,
								data:configType,
		                        required:true"/>
	    			</td>
	    		</tr>
	    		<tr>
	    			<td>Source File/Table:</td>
	    			<td>
	    				<textarea id="mig_src_C" name="mig_src" style="font-size: 12px;" rows="1" cols="60"></textarea>
	    			</td>
	    		</tr>
	    		<tr>
	    			<td>Target File/Table:</td>
	    			<td>
	    				<textarea id="mig_dst_C" name="mig_dst" style="font-size: 12px;" rows="1" cols="60"></textarea>
	    			</td>
	    		</tr>
	    		<tr>
	    			<td>Source DB Connection URL:</td>
	    			<td>
	    			<input id="mig_src_conn_C" name="mig_src_conn" type="text" value="" width="400px"></input>
	    			</td>
	    		</tr>
	    		<tr>
	    			<td>Target DB Connection URL:</td>
	    			<td>
	    			<input id="mig_dst_conn_C" name="mig_dst_conn" type="text" value="" width="400px"></input>
	    			</td>
	    		</tr>
	    		<tr>
	    			<td>Business Rules:</td>
	    			<td>
	    				<textarea id="mig_where_C" name="mig_where" style="font-size: 12px;" rows="2" cols="60"></textarea>
	    			</td>
	    		</tr>
	    		<tr>
	    			<td>Description:</td>
	    			<td><textarea id="mig_desc_C" name="mig_desc" style="font-size: 12px;" rows="2" cols="60"></textarea></td>
	    		</tr>
	    	</table>			
	    </form>
	</div>
    </div>
<script type="text/javascript">
var add = VIRTUE.add;

add.submitForm = function (){
	if( ! $('#c_form').form("validate") )
	{
		return;
	}
	
	var formData = $('#c_form').form( 'getData');
	add.init();
	for (var field in formData) {
		add.jdata.data[field] = formData[field];
	}

	jQuery.post( getContextPath()+"/curd/commonCURDaddWithId.action", 
		{
			tableName : tableName,
			authorColumnName : "mig_author",
			jdata : encodeURI($.toJSON( add.jdata )) 
		},
		function(oResponse, status){
			alert(oResponse.msg);

			if(oResponse.success == true){
				$('#grid').datagrid('reload',{
					tableName : tableName,
					jdata: encodeURI($.toJSON( query.jdata ) ) 
				} );
				$('#win').window('close');
			}
	});
};
add.clearForm = function (){
	$('#c_form').form('clear');
};
$(function(){
	$('#mig_src_conn_C').combogrid({
		url : getContextPath()+"/query/commonCBBQUERYdfind.action",
		panelWidth : 500,
		panelHeight : 200,
		idField : 'url',
		textField : 'url',
		pagination : false,
		fitColumns : true,
		required : true,
		rownumbers : true,
		mode : 'remote',
		delay : 500,
		sortName : 'url',
		sortOrder : 'asc',
		pageSize : 5,
		pageList : [ 5, 10 ],
		queryParams : {
			tableName : "mig_config_connection",
			columns: "url"
		},
		columns : [ [ {
			field : 'url',
			title : 'Connection URL',
			width : 220,
			sortable : true
		}, {
			field : 'remark',
			title : 'Description',
			width : 220,
			sortable : false
		}, {
			field : 'ctime',
			title : 'Create Time',
			width : 130,
			sortable : true
		} ] ]
	});
	$('#mig_dst_conn_C').combogrid({
		url : getContextPath()+"/query/commonCBBQUERYdfind.action",
		panelWidth : 500,
		panelHeight : 200,
		idField : 'url',
		textField : 'url',
		pagination : false,
		fitColumns : true,
		required : true,
		rownumbers : true,
		mode : 'remote',
		delay : 500,
		sortName : 'url',
		sortOrder : 'asc',
		pageSize : 5,
		pageList : [ 5, 10 ],
		queryParams : {
			tableName : "mig_config_connection",
			columns: "url"
		},
		columns : [ [ {
			field : 'url',
			title : 'Connection URL',
			width : 220,
			sortable : true
		}, {
			field : 'remark',
			title : 'Description',
			width : 220,
			sortable : false
		}, {
			field : 'ctime',
			title : 'Create Time',
			width : 130,
			sortable : true
		} ] ]
	});
});
</script>
	<div data-options="region:'south',border:false" style="text-align:right;padding:5px 5px 5px 0;background:#F4F4F4;">
		<a class="easyui-linkbutton" data-options="iconCls:'icon-ok'" href="javascript:void(0)" onclick="javascript:add.submitForm()" style="width:80px">Submit</a>
		<a class="easyui-linkbutton" data-options="iconCls:'icon-cancel'" href="javascript:void(0)" onclick="javascript:$('#win').dialog('close');" style="width:80px">Cancel</a>
	</div>
</div>
</body>
</html>
