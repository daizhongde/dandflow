<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<title>新建</title>

</head>
<body>
<div class="easyui-layout" data-options="fit:true">
	<div data-options="region:'center',border:false" title="" noheader="true">
		<div style="padding:5px 0 5px 5px">
		    <form id="c_form" method="post" action="" style="margin:0;padding:0;">
		    	<table align="center" width="100%">
		    		<tr>
		    			<td width="25%">Audit Item:</td>
		    			<td width="25%">
		    				<input class="easyui-validatebox" type="text" id="audit_name_C" name="audit_name" data-options="required:true"></input>
		    			</td>
		    			<td width="15%">Domain:</td>
		    			<td width="35%">
		    				<input class="easyui-combobox" 
		                        id='domain_C' name="domain" value=""
		                        data-options="valueField:'code', textField:'value',
		                        editable:false,
		                        required: true,
								data: domains" />
		    			</td>
		    		</tr>
		    		<tr>
		    			<td>Table Name:</td>
		    			<td>
		    				<input class="easyui-validatebox" type="text" id="table_name_C" name="table_name" data-options="required:true"/>
		    			</td>
		    			<td>Expectation:</td>
		    			<td>
		    				<input class="easyui-validatebox" id="audit_value_C" name="audit_value" data-options="required:true"/>
		    			</td>
		    		</tr>
		    		
		    		<tr>
		    			<td>DB Connection URL:</td>
		    			<td colspan="3">
		    				<input id="src_db_connect_C" name="src_db_connect" type="text" value="" width="300px" ></input>
		    			</td>
		    		</tr>
		    		<tr>
		    			<td>Parameter Template:</td>
		    			<td colspan="3">
		    				<textarea id="mig_sql_rep_C" name="mig_sql_rep" style="height:50px;width:95%;font-size: 12px;"></textarea>
		    			</td>
		    		</tr>
		    		<tr>
		    			<td>Operator:</td>
		    			<td><input class="easyui-validatebox" type="text" id="operator_C" name="operator" data-options="required:true"></input></td>
		    			<td>Auditor:</td>
		    			<td><input class="easyui-validatebox" type="text" id="audit_author_C" name="audit_author" data-options="required:true"></input></td>
		    		</tr>
		    		<tr>
		    			<td>Description:</td>
		    			<td colspan="3">
		    				<textarea id="remark_C" name="remark" style="height:50px;width:95%;font-size: 12px;"></textarea>
		    			</td>
		    		</tr>
		    		<tr>
		    			<td>Source Audit SQL:</td>
		    			<td colspan="3">
		    				<textarea id="src_audit_sql_C" name="src_audit_sql" style="height:100px;width:95%;font-size: 12px;" 
		    				onclick="add.open_sqleditor()" readonly="readonly"></textarea>
		    			</td>
		    		</tr>
		    	</table>
		    </form>
		</div>
	</div>
<script type="text/javascript"> 
var add = VIRTUE.add;

add.submitForm = function (){
	if( ! $('#c_form').form("validate")  )
	{
		return;
	}
	if($('#c_form #src_audit_sql_C').val() == ""){
		alert("Source Audit SQL is required！");
		return;
	}
	var formData = $('#c_form').form( 'getData');
	add.init();
	for (var field in formData) {
		add.jdata.data[field] = formData[field];
	}

	jQuery.post( getContextPath()+"/curd/migAuditvConfigCURDadd.action", 
		{
			tableName : tableName,
			jdata : $.toJSON( add.jdata ) 
		},
		function(oResponse, status){
			alert(oResponse.msg);

			if(oResponse.success == true){
				$('#grid').datagrid('reload',{
// 					columnNames : "audit_id,audit_name,mig_sql,author,mig_sql_rep",
					tableName : tableName,
					jdata: encodeURI($.toJSON( query.jdata ) ) 
				} );
				$('#win').dialog('close');
			}
	});
};
add.clearForm = function (){
	$('#c_form').form('clear');
};

add.SQLValue = "";

/** 打开sql编辑页面*/
add.open_sqleditor = function(){
	$("#dlg_audit_sql_C").dialog({
		title : "sql",
		href :  "sql_editor_C.html",
		iconCls : 'icon-edit',
		modal : true,
		closed : true,
		resizable: true,
		minimizable: true,
		maximizable: true,
		cache: false,
		width : 840,
		height : 380,
		buttons: [{
            text:'OK',
            iconCls:'icon-ok',
            handler:function(){
            	$("#src_audit_sql_C").val( add.editor.getValue() );
            	$("#dlg_audit_sql_C").dialog('close');
            }
        },{
            text:'Cancel',
            iconCls:'icon-cancel',
            handler:function(){
            	$("#dlg_audit_sql_C").dialog('close');
            }
        }]
	});
	add.SQLValue = $("#src_audit_sql_C").val();
	$("#dlg_audit_sql_C").dialog('open');
};

add.open_dialog_srcconn = function(){
	var mig_src_conn = $('#src_db_connect_C').combo( 'getValue' );	
	if( mig_src_conn != '' ){
		var temp = mig_src_conn.split(/\|/);
		if(temp.length==5){
			$('#dbtype_C').combobox("setValue", temp[0] );
			$('#ip_C').textbox("setValue", temp[1]);
			$('#username_C').textbox("setValue", temp[2]);
			$('#password_C').textbox("setValue", temp[3]);
			$('#instance_C').textbox("setValue", temp[4]);
		}
	}
	$('#dlg-migsrcconn').dialog('open');
};

$(function(){
	$('#src_db_connect_C').combogrid({
		url : getContextPath()+"/query/commonCBBQUERYdfind.action",
		panelWidth : 500,
		panelHeight : 200,
		idField : 'url',
		textField : 'name',
		editable : false,
		pagination : false,
		fitColumns : false,
		required : true,
		rownumbers : true,
		mode : 'remote',
		delay : 500,
		sortName : 'url',
		sortOrder : 'asc',
		pageSize : 5,
		pageList : [ 5, 10 ],
		queryParams : {
			tableName : "mig_config_connection",
			columns: "url"
		},
		columns : [ [ {
			field : 'name',
			title : 'Name',
			width : 120,
			sortable : true
		},{
			field : 'url',
			title : 'Connection URL',
			width : 220,
			sortable : true
		}, {
			field : 'remark',
			title : 'Description',
			width : 220,
			sortable : false
		}, {
			field : 'ctime',
			title : 'Create Time',
			width : 130,
			sortable : true
		} ] ]
	});
});
</script>
	<div data-options="region:'south',border:false" style="text-align:right;padding:5px 5px 5px 0;background:#F4F4F4;">
		<a class="easyui-linkbutton" data-options="iconCls:'icon-ok'" href="javascript:void(0)" onclick="javascript:add.submitForm()" style="width:80px">Submit</a>
		<a class="easyui-linkbutton" data-options="iconCls:'icon-cancel'" href="javascript:void(0)" onclick="javascript:$('#win').dialog('close');" style="width:80px">Cancel</a>
	</div>
	
	<div id="dlg_audit_sql_C"></div>
	
	<!-- 源数据库连接串   ########################### -->
	<div id="dlg-migsrcconn" class="easyui-dialog"
		title="DB Connection URL Config" style="width:550px;height:180px;"
			data-options="
				modal:true,closed:true,
				iconCls: 'icon-edit',
				buttons: [{
					text:'Ok',
					iconCls:'icon-ok',
					handler:function(){
						if( ! $('#form-migsrcconn').form('validate') )
						{
							return;
						}
						var migsrcconn = '';
						var formData = $('#form-migsrcconn').form( 'getData');
						migsrcconn = formData['dbtype']+'|'+formData['ip']+'|'+formData['username']+'|'
							+formData['password']+'|'+formData['instance'];
						$('#src_db_connect_C').combogrid( 'setValue', migsrcconn );
						$('#dlg-migsrcconn').dialog('close');
					}
				},{
					text:'Cancel',
					handler:function(){
						$('#dlg-migsrcconn').dialog('close');
					}
				}]
			">
		<form id="form-migsrcconn" method="post" action="" style="margin:0;padding:0;">
	    	<table align="center" width="100%" border="1">
				<tr>
	    			<td>DB Type:</td>
	    			<td colspan='3'>
	    				<input class='easyui-combobox' id="dbtype_C"  name='dbtype' data-options="valueField:'code',textField:'value', 
							editable:false,url:'../../cbb/dicCBBgetDic2ByType.action?dicType=db-type',method:'post',required:true"/>
	    			</td>
	    		</tr>
	    		<tr>
	    			<td>IP:</td>
	    			<td>
	    				<input class="easyui-textbox" type="text" id="ip_C" name="ip" data-options="required:true"></input>
	    			</td>
	    			<td>Instance:</td>
	    			<td>
	    				<input class="easyui-textbox" type="text" id="instance_C" name="instance" data-options="required:true"></input>
	    			</td>
	    		</tr>
	    		<tr>
	    			<td>Username:</td>
	    			<td>
	    				<input class="easyui-textbox" type="text" id="username_C" name="username" data-options="required:true"></input>
	    			</td>
	    			<td>Password:</td>
	    			<td>
	    				<input class="easyui-textbox" type="text" id="password_C" name="password" data-options="required:true"></input>
	    			</td>
	    		</tr>
	    	</table>			
	    </form>
	</div>

</div>

</body>
</html>
