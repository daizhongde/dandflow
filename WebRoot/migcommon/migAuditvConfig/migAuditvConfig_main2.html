<head>
<title>合法性稽核配置(domain leader)--已经不需要了(目前权限管理可到按钮)</title>

<script type="text/javascript">
var app={};
var query = VIRTUE.query;
var OPE = VIRTUE.operator;

var domains = ajaxReqRespText("/cbb/dicCBBgetDicByType.action?dicType=Busi-Domain");
	domains = eval("(" + domains + ")");

var author = ajaxReqRespText("/common/commonCommoncurrentUserLogname.action");

var tableName = "mig_auditv_config";

/** validate and assign value **/
function PackingParameter(){
	var formData = $('#s_form').form( 'getData');

	query.init();
	for (var field in formData) {
		if( formData[field] !== "" && field != "ope" ){
			query.jdata.condition[field] = formData[field];
			query.jdata.operator[field] = OPE.CONTAIN;
			if( field=="audit_name" && formData["ope"] != "" ){
				query.jdata.operator[field] = formData["ope"];
			}
		}
	}
	return true;
};

/** search data ,reload data  **/
function submitForm(){
   	if(!PackingParameter()){
   		return;
   	}
   	$('#grid').datagrid( 'reload', {
//    		columnNames : "audit_id,audit_name,mig_sql,author,mig_sql_rep",
   		tableName : tableName,
   		jdata: encodeURI( $.toJSON( query.jdata ) ) 
   	} );
};
/**  清空  **/
function clearForm(){
	$('#s_form').form('clear');
};

function newRecord(){  //使用一个window
	$('#win').dialog('open').window('setTitle', 'New');
	$('#win').dialog("refresh", "migAuditvConfig_add.html");
}

var read = {};
read.jdata = { act: "read",condition: {audit_id: ""}, operator : {audit_id:1} };
function editRecord() {
	var row = $('#grid').datagrid('getSelected');
	if (row) {
		if (row.audit_author != author) {
			alert("You can't edit other's job!");
			return;
		};
		read.jdata.condition.audit_id = row.audit_id;
		$('#win').dialog('open').window('setTitle', 'Edit');
		$('#win').dialog("refresh", getContextPath()+"/curd/commonCURDinitModify.action?tableName="+tableName+"&jdata="+encodeURI($.toJSON( read.jdata )));
	}
};

function browseRecord() {
	var row = $('#grid').datagrid('getSelected');
	if (row) {
		$('#win').dialog('open').dialog('setTitle', 'View');
		read.jdata.condition.audit_id = row.audit_id;
		$('#win').dialog("refresh", getContextPath()+"/curd/migAuditvConfigCURDbrowse.action?tableName="+tableName+"&jdata="+encodeURI($.toJSON( read.jdata )));
	}
};

var del = {};
del.jdata = {act: "del",condition: { audit_id: "" },operator : {audit_id : 1} };
function destroyRecord(){
	var row = $('#grid').datagrid('getSelected');
	if (row){
		if (row.audit_author != author) {
			alert("You can't remove other's job!");
			return;
		};
		$.messager.confirm('Confirm','Confirm Remove?',function(r){
			if (r){
				del.jdata.condition.audit_id = row.audit_id;
				$.post( getContextPath()+"/curd/commonCURDdelete.action", {
					tableName : tableName,
					jdata: encodeURI($.toJSON( del.jdata )) 
				}, function(result, status){
					alert(result.msg);
					if (result.success){
						$('#grid').datagrid('reload',{
// 							columnNames : "audit_id,audit_name,mig_sql,author,mig_sql_rep",
							tableName : tableName,
							jdata: encodeURI( $.toJSON( query.jdata ) )
						} );	// reload data
					}
				});
			}
		});
	}
};

del.jdata2 = {act: "del",condition: { audit_author: "" },operator : {audit_author : 1} };
function destroyAllMyRecords(){
	$.messager.confirm("Confirm","Confirm Remove all "+author+"'s config ?",function(r){
		if (r){
			del.jdata2.condition.audit_author = author;
			$.post( getContextPath()+"/curd/commonCURDdelete.action", {
				tableName : tableName,
				jdata: encodeURI($.toJSON( del.jdata2 )) 
			}, function(result, status){
				alert(result.msg);
				if (result.success){
					$('#grid').datagrid('reload',{
						tableName : tableName,
						jdata: encodeURI( $.toJSON( query.jdata ) )
					} );	// reload data
				}
			});
		}
	});
};
/** Import legality audit config excel文件  */
function importAuditvCfgFile() {
	$("#importAuditvCfgFile").dialog(
			{
				title : "Import",
				href : getContextPath()
						+ "/migcommon/migAuditvConfig/migAuditvConfig_import.html",
				iconCls : 'icon-edit',
				modal : true,
				closed : true,
				resizable : true,
				minimizable : true,
				maximizable : true,
				cache : false,
				width : 800,
				height : 150,
				buttons : [ {
					id: 'imp_btn',
					text : 'OK',
					iconCls : 'icon-ok',
					handler : function() {
						btnExcelI_onClick();
						$('#imp_btn').linkbutton('disable');
						return false;//for IE6 support
					}
				}, {
					text : 'Cancel',
					iconCls : 'icon-cancel',
					handler : function() {
						$('#importAuditvCfgFile').dialog('close');
					}
				} ]
			});
	$("#importAuditvCfgFile").dialog('open');
};
/**  上传前检查，并从数据库获取该批次的社保机构号   **/
function btnExcelI_onClick() {
	var path = document.getElementById("upload").value;
	if (path == "") {
		alert("Please select file！");
		return;
	}
	ajaxFileUpload();
};

/**  上传  **/
function ajaxFileUpload() {
	$("#loading").ajaxStart(function() {
		$(this).show();
	}).ajaxComplete(function() {
		$(this).hide();
	});
	$("#loading").show();
	$.ajaxFileUpload({
		url : getContextPath() + "/imp/migAuditvConfigIMPimportXLS.action",
		secureuri : false,
		fileElementId : 'upload',
		//data: "",
		dataType : 'text',
		success : function(data, status) {
			data = eval("(" + data + ")");
			alert(data.msg);
			if (data.success) {
				$('#importAuditvCfgFile').dialog('close');
				submitForm();
			}
			$("#loading").hide();
		},
		error : function(data, status, e) {
			alert("Error:" + data + ",exception:" + e);
			$("#loading").hide();
		}
	});
};

var toolbar = [{
	text:'New Config',
	iconCls:'icon-add',
	handler:function(){
		newRecord();
	}
},{
	text:'Edit Config',
	iconCls:'icon-edit',
	handler:function(){
		editRecord();
	}
},{
	text:'Remove Config',
	iconCls:'icon-remove',
	handler:function(){
		destroyRecord();
	}
},{
	text:'Remove All My config',
	iconCls:'icon-remove',
	handler:function(){
		destroyAllMyRecords();
	}
},{
	text:'View Config',
	iconCls:'icon-search',
	handler:function(){ 
		browseRecord(); 
	}
}, {
	text : 'Import Config',
	iconCls : 'icon-import',
	handler : function() {
		importAuditvCfgFile();
		return false;
	}
}];

$(function(){
	$('#grid').datagrid({
		title : 'Search Result',
		toolbar : toolbar,
		width : 938,
		height : 720,
		nowrap : true,
		striped : true,
		fit : true,
		collapsible : true,
		url: getContextPath()+"/query/commonJEasyUIQUERYdfind.action",
		idField : "audit_id",
		remoteSort: true,
		multiSort : false,
		singleSelect : true,
		columns : [ [
			{ title : 'Audit ID', field : 'audit_id',width : 90,hidden: true  },
			{ title : 'domain', field : 'domain', width : 80, sortable: true, formatter: function(value,row, index ){
				for(var i=0, j=domains.length; i<j; i++){
					if( domains[i].code == value ){
						return domains[i].value;
					}
				}
				return value;
			} },
			{ title : 'Item', field : 'audit_name', width : 120, sortable: true  },
			{ title : 'Source DB Connection URL', field : 'src_db_connect', width : 220  },
			{ title : 'Source Audit SQL', field : 'src_audit_sql', width : 120  },
			{ title : 'Expectation', field : 'audit_value', width : 120  },
			{ title : 'Operator', field : 'operator', width : 120  },
			{ title : 'Auditor', field : 'audit_author', width : 60  },
			{ title : 'Description', field : 'remark', width : 200, 
				formatter: function(value,row, index ){
					return value.length<=120 ? value : value.substring(0,120)+"...";
				}
			},
			{ title : 'Parameter Template', field : 'mig_sql_rep', width : 200, 
				formatter: function(value,row, index ){
					return value.length<=120 ? value : value.substring(0,120)+"...";
				}
			}, {
				title : 'Create time',
				field : "ctime",
				width : 130,
				sortable : true
			}
		] ],
		pagination : true,
		rownumbers : false,
		queryParams : {
			tableName : tableName,
			jdata: encodeURI( $.toJSON( query.jdata ) ) 
		}
	});
});

</script>
</head>
<body rightmargin="0" bottommargin="0" leftmargin="0" topmargin="0" class="easyui-layout">
    <div data-options="region:'north',border:true,split:true" style="height:92px;background:#B3DFDA;" title="(LA)Item configuration(domain leader)--Search Condition" >  
    	<form id="s_form" method="post" style="margin:0;padding:0;">
        <div style="padding:0px 0 0px 15px">
            <table width="100%">
                <tr>
                    <td>Audit Item:</td>
                    <td>
                    	<input class="easyui-combobox" 
		                        id='ope_C' name="ope"
		                        data-options="valueField:'value', textField:'label',
		                        value:VIRTUE.operator.STARTWITH,
		                        editable:false,
								data:VIRTUE.OPECBBDATA,width:120,
		                        required:true"/>
                        <input id="audit_name" name="audit_name" value="">
                    </td>
                    <td>Domain:</td>
                    <td>
                        <input class="easyui-combobox" 
		                        id='domain' name="domain" value="" 
		                        data-options="valueField:'code', textField:'value',
		                        editable:false,
								data: domains"/>
                    </td>
                    <td>Table Name:</td>
                    <td>
                        <input id="table_name" name="table_name" value="">
                    </td>
                    <td>Author:</td>
                    <td>
                        <input id="audit_author" name="audit_author" value="">
                    </td>
                </tr>
            </table>
        </div>
        <table width="100%" border="0" align="center">
			<tr bgcolor="#E2EEFE" valign="bottom">
				<td height="23"><div align="center"><!-- default height='21'  -->
					<a class="easyui-linkbutton" data-options="iconCls:'icon-search'" href="javascript:void(0)" 
               		onclick="submitForm()" style="width:80px">Submit</a>&nbsp;&nbsp;
               		<a class="easyui-linkbutton" data-options="iconCls:'icon-clear'" href="javascript:void(0)" 
               		onclick="clearForm()" style="width:80px">Clear</a>
				</div></td>
			</tr>
		</table>
		</form>
    </div>
    <div data-options="region:'center', border:false" title="" style="overflow:hidden;" noheader="true">
		<table id="grid"></table>
	</div>

	<div id="win" class="easyui-dialog" title="添加" style="width:600px;height:450px"  
        data-options="modal:true,closed:true,resizable:true">
	</div>
	<div id="importAuditvCfgFile"></div>

	</div>-->
</body>
