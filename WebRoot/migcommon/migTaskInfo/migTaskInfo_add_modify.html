<html>

	<body>

				<div title="参数" style="padding:10px">
					<table id="taskparam_grid"></table>
				</div>
				<div title="控件参数" style="padding:10px">
					<table id="comparaTable" width="100%" cellpadding="2">
<script type="text/javascript">
var taskpojo = nodes[app.zindex];
// var taskpojo = ${pojo};
jQuery(document).ready(function() {
	$("#modifyTask_form").form("load", taskpojo);
});

if( taskpojo.comInfos.length == 0 )
{//还没有设置过控件参数
	// var treeNode = $('#tt').tree( "find", taskpojo.controlId );

	var controlTPLS = $('#tt').tree( "find", taskpojo.controlId ).attributes.tpl;
// 	console.log( $.toJSON(controlTPLS) );

	for( var i=0,j = controlTPLS.length; i<j; i++ ){
		var controlTPL = controlTPLS[i];
		var row = "<tr>"
			+"<td style='width:120px'>"+ controlTPL.paraName+":</td>"
			+"<td><input class='easyui-validatebox' type='text' name='"+ controlTPL.id.paraId+"' style='width:90%;' value='"+controlTPL.defValue+"'/></td>"
			+"</tr>";
		
		$("#comparaTable").append(row);
	}
}
else
{
	var controlTPLS = $('#tt').tree( "find", taskpojo.controlId ).attributes.tpl;
	var comInfos = taskpojo.comInfos
	for( var i=0,j = controlTPLS.length; i<j; i++ ){
		var controlTPL = controlTPLS[i];
		var row = "<tr>"
			+"<td style='width:120px'>"+ controlTPL.paraName+":</td>"
			+"<td><input class='easyui-validatebox' type='text' name='" + controlTPL.paraId + "' style='width:90%;' value='" + comInfos[i].paraValue + "'/></td>"
			+"</tr>";
		
		$("#comparaTable").append(row);
	}
}
</script>
					</table>
				</div>
			</div>
		</div>
	</form>
	</div>
<script type="text/javascript">
/** 任务参数信息工具栏信息 */
app.taskparam_toolbar = [ {
	text : '新增',
	disabled: false,
	iconCls : 'icon-add',
	handler : function() {
		taskparam_append();
		return false;
	}
}, '-', {
	text : '删除',
	disabled: false,
	iconCls : 'icon-remove',
	handler : function() {
		taskparam_removeit();
		return false;
	}
} , '-', {
	text : '保存',
	disabled: false,
	iconCls : 'icon-save',
	handler : function() {
		taskparam_accept();
		return false;
	}
}, '-', {
	text : '撤销',
	disabled: false,
	iconCls : 'icon-undo',
	handler : function() {
		taskparam_reject();
		return false;
	}
}];
//用来控制提交：如果数据表格没有加载完，禁止提交。
app.taskparaloaded=false;
// 任务参数-表格
$('#taskparam_grid').datagrid({
	title : '',
	toolbar : app.taskparam_toolbar,
	width : 938,
	height : 720,
	nowrap : true,
	striped : true,
	fit : true,
	collapsible : true,
	url: getContextPath()+"/query/migJobParaJEasyUIQUERYdfind.action",
// 	idField : "nodeId",
	multiSort : true,
	singleSelect : true,
	onClickCell : taskparam_onClickRow,
	onLoadSuccess: function(){
		app.taskparaloaded=true;
		if( taskpojo.paras.length != 0 ){//还没有设置过任务参数
			for(var i=0; i < taskpojo.paras.length; i++ ){
				$('#taskparam_grid').datagrid('insertRow',{
					index: i,	// index start with 0
					row: taskpojo.paras[i]
				});
			}
		}
	},
	columns : [ [ 
		{ title : '节点ID', field : 'nodeId', hidden: true }, 
		{ title : '参数', field : 'para', editor : { type : 'text'}, width : 90 }, 
		{ title : '参数值', field : 'paraValue', editor : { type : 'text'}, width : 90 }, 
		{ title : '参数类型', field : 'paraType', editor : { type : 'text'}, width : 90 },
		{ title : '参数中文名', field : 'paraName', editor : { type : 'text'}, width : 90 } 
	] ],
	pagination : false,
	rownumbers : false,
	queryParams : {
		jdata : encodeURI($.toJSON({ act: VIRTUE.act.NOQUERY, condition: {nodeId: taskpojo.id }, operator : {} })),
	}
});

/** 任务参数表格编辑 */
var taskparam_editIndex = undefined;
function taskparam_endEditing() {
	if (taskparam_editIndex == undefined) 
	{
		return true
	}
	if ($('#taskparam_grid').datagrid('validateRow', taskparam_editIndex)) 
	{
		$('#taskparam_grid').datagrid('endEdit', taskparam_editIndex);
		taskparam_editIndex = undefined;
		return true;
	}
	else 
	{
		return false;
	}
};
function taskparam_onClickRow(index) {
	if (taskparam_editIndex != index) {
		if (taskparam_endEditing()) {
			$('#taskparam_grid').datagrid('selectRow', index).datagrid('beginEdit', index);
			taskparam_editIndex = index;
		} else {
			$('#taskparam_grid').datagrid('selectRow', taskparam_editIndex);
		}
	}
};

function taskparam_append() {
	if (taskparam_endEditing()) {
		$('#taskparam_grid').datagrid('appendRow', { nodeId: taskpojo.id });
		taskparam_editIndex = $('#taskparam_grid').datagrid('getRows').length - 1;
		$('#taskparam_grid').datagrid('selectRow', taskparam_editIndex).datagrid('beginEdit',
				taskparam_editIndex);
	}
};
function taskparam_removeit() {
	if (taskparam_editIndex == undefined) {return}
	$('#taskparam_grid').datagrid('cancelEdit', taskparam_editIndex).datagrid('deleteRow', taskparam_editIndex)
	taskparam_editIndex = undefined;
};
function taskparam_accept() {
	if (taskparam_endEditing()) {
		$('#taskparam_grid').datagrid('acceptChanges');
	}
};
function taskparam_reject() {
	$('#taskparam_grid').datagrid('rejectChanges');
	taskparam_editIndex = undefined;
};

</script>
	</body>
</html>
