<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
<title>任务选择界面</title>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

</head>
<body>
<script type="text/javascript">

</script>
<div class="easyui-layout" fit="true">
    <div data-options="region:'center', border:false" title="" style="overflow:hidden;" noheader="true">
		<table id="task_grid" class="easyui-datagrid" style="width:462px;height:268px"
			data-options="rownumbers:true,
			toolbar:'#tb',
			fit : true,
			showHeader: true, 
			showFooter: false, 
			selectOnCheck:true,
			checkOnSelect:true,
			singleSelect: false,
			idField: 'task_id',
			pagination : true,
			url:getContextPath()+'/query/migTaskInfoJEasyUIQUERYdfind.action',
			method:'post',
			queryParams:{
				jdata : encodeURI( $.toJSON( {act:'',condition:{},operator:{}} ) )
			}">
			<thead>
				<tr>
					<th data-options="field:'ck', checkbox: true"></th>
					<th data-options="field:'task_name', width: 120">Task Name</th>
					<th data-options="field:'com_id', width: 120">Com_ID</th>
					<th data-options="field:'control_id', width: 120,formatter: 
					function(value,row, index ){
						for(var i=0, j= controlData.length; i<j; i++){if( controlData[i].controlId == value ){return controlData[i].controlName}}
					}">Control</th>
					<th data-options="field:'task_author', width: 120">Author</th>
					<th data-options="field:'task_remark', width: 120">Description</th>
				</tr>
			</thead>
		</table>
	</div>
	<div id="tb" style="padding:2px 5px;">
		<form id="task_sform" method="post" style="margin:0;padding:0;">
		Task Name: <input id="tname" name="task_name" value="" style="width:70px;">
		Control Type: <input class="easyui-combobox" 
                        id='tcontrol_id' name="control_id" value="" editable="false" 
                        data-options="valueField:'controlId', textField:'controlName', data: controlData"/>
		Author: <input id="ttask_author" name="task_author" value="" style="width:70px;">
		<a href="#" class="easyui-linkbutton" iconCls="icon-search" onclick="pubSubmitForm('task')">Search</a>
		</form>
	</div>
</div>
</body>
</html>
