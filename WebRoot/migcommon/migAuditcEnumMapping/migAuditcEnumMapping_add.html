<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<title>新建</title>
</head>
<body>
<div class="easyui-layout" data-options="fit:true">
	<div data-options="region:'center',border:false" title="" noheader="true">
		<div style="padding:10px 0 10px 30px">
		    <form id="c_form" method="post" action="" style="margin:0;padding:0;">
		    	<table align="center">
		    		<tr>
		    			<td>Domain:</td>
		    			<td>
			    			<input class="easyui-combobox" 
			                        id='domain_C' name="entity" value=""
			                        data-options="valueField:'code', textField:'value',
			                        editable:false,
			                        required: true,
									data: domains" />
		    			</td>
		    		</tr>
		    		<tr>
		    			<td>Sub Domain:</td>
		    			<td><input class="easyui-validatebox" type="text" id="audit_name_C" name="audit_name" data-options="required:true"></input></td>
		    		</tr>
		    		<tr>
		    			<td>Source Enum:</td>
		    			<td><input class="easyui-validatebox" type="text" id="src_enum_C" name="src_enum" data-options="required:true"></input></td>
		    		</tr>
		    		<tr>
		    			<td>Target Enum:</td>
		    			<td><input class="easyui-validatebox" type="text" id="dst_enum_C" name="dst_enum" data-options="required:true"></input></td>
		    		</tr>
		    		<tr>
		    			<td>Description:</td>
		    			<td><textarea id="enum_desc_C" name="enum_desc" style="height:60px;font-size: 12px;"></textarea></td>
		    		</tr>
		    	</table>
		    </form>
		</div>
	</div>
<script type="text/javascript">
var add = VIRTUE.add;

add.submitForm = function (){
	if( ! $('#c_form').form("validate")  )
	{
		return;
	}
	if($('#c_form #enum_desc_C').val() == ""){
		alert("Enum Description is required！");
		return;
	}
	var formData = $('#c_form').form( 'getData');
	add.init();
	for (var field in formData) {
		add.jdata.data[field] = formData[field];
	}

	jQuery.post( getContextPath()+"/curd/commonCURDaddWithId.action", 
		{
			tableName : tableName,
			jdata : encodeURI($.toJSON( add.jdata )) 
		},
		function(oResponse, status){
			alert(oResponse.msg);

			if(oResponse.success == true){
				$('#grid').datagrid('reload',{
					tableName : tableName,
					jdata: encodeURI($.toJSON( query.jdata ) ) 
				} );
				$('#win').window('close');
			}
	});
};
add.clearForm = function (){
	$('#c_form').form('clear');
};
</script>
	<div data-options="region:'south',border:false" style="text-align:right;padding:5px 5px 5px 0;background:#F4F4F4;">
		<a class="easyui-linkbutton" data-options="iconCls:'icon-ok'" href="javascript:void(0)" onclick="javascript:add.submitForm()" style="width:80px">Submit</a>
		<a class="easyui-linkbutton" data-options="iconCls:'icon-cancel'" href="javascript:void(0)" onclick="javascript:$('#win').dialog('close');" style="width:80px">Cancel</a>
	</div>
</div>
</body>
</html>
