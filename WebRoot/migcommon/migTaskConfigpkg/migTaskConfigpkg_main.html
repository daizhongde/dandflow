<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
<title>SplitFile业务参数配置文件夹</title>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<link rel="stylesheet" type="text/css" href="../../scripts/jquery-easyui/1.4.1/themes/default/easyui.css"/>
<link rel="stylesheet" type="text/css" href="../../scripts/jquery-easyui/1.4.1/themes/icon.css"/>
<script type="text/javascript" src="../../scripts/jquery-easyui/1.4.1/jquery.min.js"></script>
<script type="text/javascript" src="../../scripts/jquery-easyui/1.4.1/jquery.easyui.min.js"></script>
<!-- <script type="text/javascript" src="../../scripts/jquery-easyui/1.4.1/locale/easyui-lang-zh_CN.js"></script> -->
<script type="text/javascript" src="../../scripts/json/jquery.json-2.2.min.js"></script>

<script type="text/javascript" src="../../scripts/jquery-easyui/1.4.1/plugins/easyuiExtends.js"></script>
<script type="text/javascript" src="../../scripts/virtue/virtue.js"></script>
<script type="text/javascript" src="../../scripts/utils/commonUtil.js"></script>

<script type="text/javascript">
var query = VIRTUE.query;
var OPE = VIRTUE.operator;

var tableName = "mig_task_configpkg";

var configType = ajaxReqRespText("/cbb/dicCBBgetDicByType.action?dicType=config_type" );
configType = eval ("(" + configType + ")");

/** validate and assign value **/
function PackingParameter(){
	var formData = $('#s_form').form( 'getData');
	query.init();
	for (var field in formData) {
		if( formData[field] !== "" ){
			query.jdata.condition[field] = formData[field];
			query.jdata.operator[field] = OPE.CONTAIN;
		}
	}
	return true;
};

/** search data ,reload data  **/
function submitForm(){
   	if(!PackingParameter()){
   		return;
   	}
   	$('#grid').datagrid( 'reload', {
   		tableName : tableName,
   		jdata: encodeURI( $.toJSON( query.jdata ) ) 
   	} );
};
/**  清空  **/
function clearForm(){
	$('#s_form').form('clear');
};

function newRecord(){  //使用一个window
	$('#win').window('open').window('setTitle', 'New');
	$('#win').window("refresh", "migTaskConfigpkg_add.html");
};

var read = {};
read.jdata = { act: "read",condition: {main_id: ""}, operator : {main_id:1} };
function editRecord() {
	var row = $('#grid').datagrid('getSelected');
	if (row) {
		read.jdata.condition.main_id = row.main_id;
		$('#win').window('open').window('setTitle', 'Edit');
		$('#win').window("refresh", getContextPath()+"/curd/commonCURDinitModify.action?tableName="+tableName+"&jdata="+encodeURI($.toJSON( read.jdata )));
	}
}

function browseRecord() {
	var row = $('#grid').datagrid('getSelected');
	if (row) {
		$('#win').window('open').window('setTitle', 'View');
		read.jdata.condition.main_id = row.main_id;
		$('#win').window("refresh", getContextPath()+"/curd/commonCURDbrowse.action?tableName="+tableName+"&jdata="+encodeURI($.toJSON( read.jdata )));
	}
}

var del = {};
del.jdata = {act: "del",condition: { main_id: "" },operator : {main_id : 1} };
function destroyRecord(){
	var row = $('#grid').datagrid('getSelected');
	if (row){
		$.messager.confirm('Remove','Confirm Remove?',function(r){
			if (r){
				del.jdata.condition.main_id = row.main_id;
				$.post( getContextPath()+"/curd/commonCURDdelete.action", {
					tableName : tableName,
					jdata: encodeURI($.toJSON( del.jdata )) 
				}, function(result, status){
					alert(result.msg);
					if (result.success){
						$('#grid').datagrid('reload',{
							tableName : tableName,
							jdata: encodeURI( $.toJSON( query.jdata ) )
						} );	// reload data
					}
				});
			}
		});
	}
};

var toolbar = [{
	text:'New Package',
	iconCls:'icon-add',
	handler:function(){
		newRecord();
	}
},{
	text:'Edit Package',
	iconCls:'icon-edit',
	handler:function(){
		editRecord();
	}
},{
	text:'Remove Package',
	iconCls:'icon-remove',
	handler:function(){
		destroyRecord();
	}
},{
	text:'View Package',
	iconCls:'icon-search',
	handler:function(){ 
		browseRecord(); 
	}
}];

$(function(){
	$('#grid').datagrid({
		title : '',
		toolbar : toolbar,
		width : 938,
		height : 720,
		nowrap : true,
		striped : true,
		fit : true,
		collapsible : true,
		url: getContextPath()+"/query/commonJEasyUIQUERYdfind.action",
		idField : "main_id",
		remoteSort: true,
		multiSort : false,
		singleSelect : true,
		columns : [ [
			{ title : 'ID', field : 'main_id',width : 90, sortable: true, hidden: true }, 
			{ title : 'Pkg Name', field : 'name', width : 120, sortable: true }, 
			{ title : 'Config Type', field : 'type', width : 110, sortable: true, formatter: function(value,row, index ){
				for(var i=0, j=configType.length; i<j; i++){
					if( configType[i].code == value ){
						return configType[i].value
					}
				}
				return value;
			} },
			{ title : 'Remark', field : 'remark',  width : 300 }
		] ],
		pagination : true,
		rownumbers : false,
		queryParams : {
			tableName : tableName,
			jdata: encodeURI( $.toJSON( query.jdata ) ) 
		}
	});
});

</script>
</head>
<body rightmargin="0" bottommargin="0" leftmargin="0" topmargin="0" class="easyui-layout">
    <div data-options="region:'north',border:true,split:true" style="height:66px;background:#B3DFDA;" title="Search Condition" >  
        <div style="padding:0px 0 0px 15px">  
        <form id="s_form" method="post">  
            <table>  
                <tr>
                    <td>Pkg Name:</td>
                    <td>
                        <input id="name" name="name" value="">
                    </td>
                    <td>Type:</td>
                    <td>
                        <input class="easyui-combobox" 
		                        id='mig_config_type' name="mig_config_type"
		                        data-options="valueField:'code', textField:'value',
		                        value:1,readonly:true,
		                        editable:false,
								data:configType,
		                        method:'post'"/>
                    </td>
                    <td>
                    	<div style="padding:0px 0 0px 15px">
                    		<input id='btnSearch' type='button' onclick="submitForm()" value='Search'/>&nbsp;
<!-- 							<input type='button' onclick="clearForm()" value='Clear'/> -->
                        </div>
                    </td>
                </tr>
            </table>
        </form>
        </div>
    </div>
    <div data-options="region:'center', border:false" title="" style="overflow:hidden;" noheader="true">
		<table id="grid"></table>
	</div>
	
	<div id="win" class="easyui-window" title="添加" style="width:600px;height:400px"  
        data-options="modal:true,closed:true">
	</div>
</body>
</html>
