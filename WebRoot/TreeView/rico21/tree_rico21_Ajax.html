<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01//EN" "http://www.w3.org/TR/html4/strict.dtd">
<html>
<head>
<title>菜单树 by rico21 Ajax</title>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<link href="/rico21/examples/client/css/demo.css" type="text/css" rel="stylesheet" />
<script src="/rico21/src/prototype.js" type="text/javascript"></script>
<!-- <script src="/rico21/src/rico.js" type="text/javascript"></script> -->
<script src="/rico21/src/min.rico.js" type="text/javascript"></script>
<script type='text/javascript'>
//Rico.loadModule('Tree');
var tree1;

Rico.onLoad( function() {
  // initialize tree
  var options={
    showCheckBox : false,
    showLines    : false,
    showPlusMinus: false,
    showFolders  : true
  }

//   tree1=new Rico.TreeControl("1", "../../tree/tAuthorityModuleTREEquery_GubuSoft_Tree.action", options);
  tree1=new Rico.TreeControl("1", "serverJsonData.xml", options);
  
  tree1.setTreeDiv('tree1');
  tree1.open();
});

function TreeClick1(e) {
  var items=tree1.getCheckedItems();
  var msg=items.length==0 ? 'No items are checked' : items.join('\n');
  alert(msg);
}
</script>

<style type="text/css">
div.ricoTree {
  border:none;
}
.ricoTreeLevel0 {
  font-weight: bold;
  font-size: larger;
}
.ricoTreeBranch {
  margin-left: 10px;
}
</style>
</head>
<body>
<p><div id='tree1'></div>
</body>
</html>
