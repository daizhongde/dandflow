    var myTreeLoader = new Ext.tree.TreeLoader({
    	clearOnLoad: false,
		nodeParameter : "node",
// 		preloadChildren : false,
		requestMethod : "POST",
		dataUrl: sUrl
// 		dataUrl: "../../tree/tAuthorityModuleTREEquery_Ext3_Tree_Async.action"
	});

        useArrows: true,
        
        autoScroll: true,

        border: false,
        // auto create TreeLoader

		loader: myTreeLoader,
		
		
		listeners:{

//             hidden : true,
            text: '湖南社保金融卡省内前置系统',
            draggable: false            
        }
    });


 	//加载树数据
	function loadNodeData( node ){
		function callback ( oResponse ) {
           	//alert( oResponse.responseText );
//         	alert( "oResponse:"+oResponse );
           	var data = eval("(" + oResponse.responseText + ")");
//             alert( "data:"+data );
	    	
	    	node.childNodes = data;
	    	alert(data[0].id+","+data[0].text);
// 	    	for( var i=0, j=data.length; i<j; i++ ){
// 	    		alert(i);
				alert(1);
	    		tree.getNodeById( node.id ).appendChild(  data  );
	    		alert(2);
// 	    	}
		}
		
	    Ext.Ajax.request({
	    	url: sUrl,
	        success: callback,
	        params: { id: node.id }
	    });
	}
	myTreeLoader.on("beforeload", function(treeLoader, node) {
		treeLoader.baseParams.id = node.attributes.id;
//         alert("beforeload");
//         alert("node.id:"+node.id);
    }, this);
	
	myTreeLoader.on("load", function( treeLoader, node, response ) {
