<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01//EN" "http://www.w3.org/TR/html4/strict.dtd">
<html>
<head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
<title>菜单树 YUI2.9.1 normal</title>

<style type="text/css">
/*margin and padding on body element
  can introduce errors in determining
  element position and are not recommended;
  we turn them off as a foundation for YUI
  CSS treatments. */
body {
	margin:0;
	padding:0;
}
</style>
<link rel="stylesheet" type="text/css" href="/yui_2.9.0/build/fonts/fonts-min.css" />
<link rel="stylesheet" type="text/css" href="/yui_2.9.0/build/treeview/assets/skins/sam/treeview.css" />
<script type="text/javascript" src="/yui_2.9.0/build/yahoo-dom-event/yahoo-dom-event.js"></script>
<script type="text/javascript" src="/yui_2.9.0/build/connection/connection-min.js"></script>
<script type="text/javascript" src="/yui_2.9.0/build/treeview/treeview-min.js"></script>

<style>
    #treeDiv1 {background: #fff; padding:1em;}
</style>

</head>

<body class="yui-skin-sam">
<div id="treeDiv1"></div>
<script type="text/javascript">
var tree;
(function() {
	var tempNode;
	/**  recursive create node. author: daizhongde dep.IT**/
	function gNode( o, pNode )
	{
	   if(o.children===undefined){//create leaf node
           tempNode = new YAHOO.widget.TextNode(o.text, pNode, false);
           tempNode.data = o;
           tempNode.isLeaf = true;
           tempNode.href = o.url;
	   }else{//create noleaf node
		   var tempNode = new YAHOO.widget.TextNode(o.text, pNode, false);
		   tempNode.data = o;
	   }
	}
	
    function treeInit() {
    	var sUrl = "../../tree/tAuthorityModuleTREEquery_Dojo_Tree_Async.action";
//      var sUrl = "server1.json";
//      var sUrl2 = "server2.json";
     	
     	//加载树数据
    	function loadNodeData(node, fnLoadComplete){
    		var callback = {
   	            success: function(oResponse) {
   	            	//alert( oResponse.responseText );
   					var menuJsonData = eval("(" + oResponse.responseText + ")");
   	            	var childData = menuJsonData;
   	            	for (var k in childData){
   	            		gNode( childData[k], node );
   	            	}
   	             	fnLoadComplete();//very importment
   	            },
   	            timeout: 7000
   	        };
    		var id = encodeURI(node.data.id );  
//     		alert("node.data.id:" + node.data.id + ",id:"+id);
   	    	YAHOO.util.Connect.asyncRequest('POST', sUrl, callback, "id=" + id );
    	}
     	
    	//instantiate the tree:
        tree = new YAHOO.widget.TreeView("treeDiv1");
    	//turn dynamic loading on for entire tree:
        tree.setDynamicLoad( loadNodeData );
    	        
        var callback = {
            success: function(oResponse) {
				var menuJsonData = eval("(" + oResponse.responseText + ")");
                //get root node for tree:
                var root = tree.getRoot();
            	var childData = menuJsonData;
            	for (var k in childData){
            		gNode( childData[k], root );
            	}
                tree.draw();
            },
            timeout: 7000
        };
        YAHOO.util.Connect.asyncRequest('POST', sUrl, callback,"id=1");
    }
    YAHOO.util.Event.onDOMReady(treeInit);
})();
</script>
</body>
</html>
