<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<title>菜单树 ForestStoreModel</title>
    <style type="text/css">
        @import "/dojo-1.9.1/dijit/themes/tundra/tundra.css";
    </style>
    <!-- 
	http://ajax.googleapis.com/ajax/libs/dojo/1.9.1/dojo/dojo.js
	http://dojotoolkit.org/reference-guide/1.9/_static/js/dojo/dojo.js
	http://demos.dojotoolkit.org/dojo/dojo.js 
	/dojo-1.9.1/dojo/dojo.js
	 -->
    <script type="text/javascript" src="/dojo-1.9.1/dojo/dojo.js"  djConfig="parseOnLoad: true"></script>
    <script type="text/javascript">
       dojo.require("dojo.parser");
       dojo.require("dojo.data.ItemFileReadStore");
       //dojo.require("dojox.data.QueryReadStore");
       dojo.require("dijit.tree.ForestStoreModel");
       dojo.require("dijit.Tree");
       
     </script>
</head>
<body class="tundra">
   <!-- url="../../common/query_Dojo_TreeCommonmodule.action"    -->
   <div dojoType="dojo.data.ItemFileReadStore" 
        url="../../tree/tAuthorityModuleTREEquery_Dojo_Tree_NoRoot.action"
        jsId="ordJson"></div>
<!-- rootId="1", rootLabel="湖南社保金融卡省内前置系统" -->
   <div dojoType="dijit.tree.ForestStoreModel" 
   		rootId="1", rootLabel="湖南社保金融卡省内前置系统R"
        data-dojo-props="store: ordJson"
        childrenAttrs="children"   
        jsId="ordModel"></div>

   <div dojoType="dijit.Tree" id="ordTree" data-dojo-props="model: ordModel, showRoot: true"></div>
</body></html>
