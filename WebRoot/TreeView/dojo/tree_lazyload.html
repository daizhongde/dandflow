<title>菜单树 lazyload - TreeStoreModel</title>
<style type="text/css">
@import "/dojo-1.9.1/dijit/themes/tundra/tundra.css";
</style>
<!--

<script type="text/javascript" src="/dojo-1.9.1/dojo/dojo.js"
	djConfig="parseOnLoad: true"></script>
<script type="text/javascript">
	dojo.require("dojo.parser");
	dojo.require("dojo.data.ItemFileReadStore");
	dojo.require("dojox.data.QueryReadStore");
	dojo.require("dojox.data.JsonRestStore");
	dojo.require("dijit.tree.TreeStoreModel");
	dojo.require("dijit.tree.ForestStoreModel");
	dojo.require("dijit.Tree");
	//dojo.require("dojo/domReady!");

	var booksDataStore = new dojox.data.JsonRestStore({
		target : "../../tree/tAuthorityModuleTREEquery_Dojo_Tree.action",
		labelAttribute : "name"
	});

	var treeModel = new dijit.tree.ForestStoreModel({
		store : booksDataStore,
		deferItemLoadingUntilExpand : true,
		rootLabel : "Subjects",
		childrenAttrs : [ "children" ]
	});

	// 		};

	// 	}
	// 	});
</script>
</head>
<body class="tundra">
	<div dojoType="dijit.Tree" model="treeModel" persist="false"
		id="booksDataTree">
</body>
