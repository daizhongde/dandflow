var rx = 0;//光标相对工作区的坐标

/** 箭头起点  **/

/** 箭头终点 **/

/** 上次画线终点 **/

/** 画线开关 **/

/** 计算相对坐标（工作区中的坐标）   **/
function calcPosition(obj){
	obj.top = obj.top + py;
	obj.left = obj.left + px;
// 	alert( $.toJSON(obj) );
	return obj;
};
/** 专门记录鼠标的坐标   **/
function showPosition(e) {
	var e = e || window.event;

	x = e.clientX
			+ document.body.scrollLeft
			+ document.documentElement.scrollLeft;
	y = e.clientY
			+ document.body.scrollTop + document.documentElement.scrollTop;
	rx = x-px;
	ry = y-py;
	
	document.getElementById("x").value = rx;
	document.getElementById("y").value = ry;
	
	//如果划线开关为开，鼠标移动时就划线，线以s为起点，以鼠标当前位置e为终点
	if( drawflag && (rx != b4.x || ry != b4.y) ){
		//如果与最近一次画线终点不等，就画
		e.x = rx;
		e.y = ry;
		
// 		line.drawArrowLine(s.x, s.y, e.x, e.y);//画新
		b4.x = rx; 
		b4.y = ry;
	}
};

    }
    if (d.top + $(d.target).outerHeight() > $(d.parent).height()){
        d.top = $(d.parent).height() - $(d.target).outerHeight();
    }
};

var app={};
var connections,dragger,move,up,r,shapes;

$(function () {
    //用来存储节点的顺序
    connections = [];
    //拖动节点开始时的事件
    dragger = function () {
        this.ox = this.attr("x");
        this.oy = this.attr("y");
        this.animate({ "fill-opacity": .2 }, 500);
    };
    //拖动事件
    move = function (dx, dy) {
        var att = { x: this.ox + dx, y: this.oy + dy };
        this.attr(att);
        $("#task" + this.id).offset( calcPosition( { top: this.oy + dy + 10, left: this.ox + dx + 10 } ) );
        for (var i = connections.length; i--; ) {
            r.drawArr(connections[i]);
        }
    };
    //拖动结束后的事件
    up = function () {
        this.animate({ "fill-opacity": 0 }, 500);
    };
    //创建绘图对象
    r = Raphael("holder", $(window).width(), $(window).height());
//     var r = Raphael("holder", $('#workspace').width()-5, $('#workspace').height()-5 );
    //绘制节点
    shapes = [
               r.rect(190, 100, 60, 40, 4),
               r.rect(290, 80, 60, 40, 4),
               r.rect(290, 180, 60, 40, 4),
               r.rect(450, 100, 60, 40, 4)
            ];
    //定位节点上的文字
//     $("#task1").offset( calcPosition( { top: 100 + 10, left: 190 + 10 } ) );
//     $("#task2").offset( calcPosition( { top: 80 + 10, left: 290 + 10 } ) );
//     $("#task3").offset( calcPosition( { top: 180 + 10, left: 290 + 10 } ) );
//     $("#task4").offset( calcPosition( { top: 100 + 10, left: 450 + 10 } ) );
    //为节点添加样式和事件，并且绘制节点之间的箭头
    for (var i = 0, ii = shapes.length; i < ii; i++) {
        var color = Raphael.getColor();
        shapes[i].attr({ fill: color, stroke: color, "fill-opacity": 0, "stroke-width": 2, cursor: "move" });
        shapes[i].id = i + 1;
        shapes[i].drag(move, dragger, up);
        shapes[i].dblclick(function () { alert(this.id) })
    }
    //存储节点间的顺序
    connections.push(r.drawArr({ obj1: shapes[0], obj2: shapes[1] }));
    connections.push(r.drawArr({ obj1: shapes[1], obj2: shapes[2] }));
    connections.push(r.drawArr({ obj1: shapes[2], obj2: shapes[3] }));
});
//随着节点位置的改变动态改变箭头
Raphael.fn.drawArr = function (obj) {
    var point = getStartEnd(obj.obj1, obj.obj2);
// 	var path1 = getArr(point.start.x, point.start.y, point.end.x, point.end.y, 8);
// 	var path1 = ["M", x1, y1, "L", x2, y2, "L", x2a, y2a, "M", x2, y2, "L", x2b, y2b];
	var path1 = ["M", point.start.x, point.start.y, "L", point.end.x, point.end.y ];
    if (obj.arrPath) {
//     	obj.arrPath.attr({ path: path1  });
        obj.arrPath.attr({ path: path1,
        	'arrow-end':'open-wide-long',
      	  stroke: "#f00",
      	  "stroke-width": 2
      	  });
    } else {
        obj.arrPath = this.path(path1);
        obj.arrPath.attr({
      	  'arrow-end':'open-wide-long',
      	  stroke: "#f00",
      	  "stroke-width": 2
      	})
    }
    return obj;
};
/** 动态确定起点和终点  **/
function getStartEnd(obj1, obj2) {
    var bb1 = obj1.getBBox(),
        bb2 = obj2.getBBox();
    var p = [
            { x: bb1.x + bb1.width / 2, y: bb1.y - 1 },
            { x: bb1.x + bb1.width / 2, y: bb1.y + bb1.height + 1 },
            { x: bb1.x - 1, y: bb1.y + bb1.height / 2 },
            { x: bb1.x + bb1.width + 1, y: bb1.y + bb1.height / 2 },
            { x: bb2.x + bb2.width / 2, y: bb2.y - 1 },
            { x: bb2.x + bb2.width / 2, y: bb2.y + bb2.height + 1 },
            { x: bb2.x - 1, y: bb2.y + bb2.height / 2 },
            { x: bb2.x + bb2.width + 1, y: bb2.y + bb2.height / 2 }
        ];
    var d = {}, dis = [];
    for (var i = 0; i < 4; i++) {
        for (var j = 4; j < 8; j++) {
            var dx = Math.abs(p[i].x - p[j].x),
                dy = Math.abs(p[i].y - p[j].y);
            if (
                 (i == j - 4) ||
                 (((i != 3 && j != 6) || p[i].x < p[j].x) &&
                 ((i != 2 && j != 7) || p[i].x > p[j].x) &&
                 ((i != 0 && j != 5) || p[i].y > p[j].y) &&
                 ((i != 1 && j != 4) || p[i].y < p[j].y))
               ) {
                dis.push(dx + dy);
                d[dis[dis.length - 1]] = [i, j];
            }
        }
    }
    if (dis.length == 0) {
        var res = [0, 4];
    } else {
        res = d[Math.min.apply(Math, dis)];
    }
    var result = {};
    result.start = {};
    result.end = {};
    result.start.x = p[res[0]].x;
    result.start.y = p[res[0]].y;
    result.end.x = p[res[1]].x;
    result.end.y = p[res[1]].y;
    return result;
}
/** 获取组成箭头的三条线段的路径
@param size 箭头大小
**/
function getArr(x1, y1, x2, y2, size) {
    var angle = Raphael.angle(x1, y1, x2, y2);//得到两点之间的角度
    var a45 = Raphael.rad(angle - 45);//角度转换成弧度
    var a45m = Raphael.rad(angle + 45);
    var x2a = x2 + Math.cos(a45) * size;
    var y2a = y2 + Math.sin(a45) * size;
    var x2b = x2 + Math.cos(a45m) * size;
    var y2b = y2 + Math.sin(a45m) * size;
    var result = ["M", x1, y1, "L", x2, y2, "L", x2a, y2a, "M", x2, y2, "L", x2b, y2b];
    return result;
};

/** 在工作区指定位置创建一个可拖放的元素   
 * x 相对于工作区的X坐标
 * y 相对于工作区的Y坐标
 */
function createNode2(x, y){
	newCtrlNum ++;

	var shape = r.rect(x, y, 60, 40, 4);
	var color = Raphael.getColor();
    shape.attr({ fill: color, stroke: color, "fill-opacity": 0, "stroke-width": 2, cursor: "move" });
    shape.id = newCtrlNum;
    shape.drag(move, dragger, up);
    shape.dblclick(function () { alert(this.id) } );
    
    //拖进来就变成1的前置
    connections.push(r.drawArr({ obj1: shape, obj2: shapes[0] }));
    
    var c = r.path("M10 10L90 90").attr({
    	  'arrow-end':'block-wide-long',
    	  stroke: "#f00",
    	  "stroke-width": 2
    	});
};
