function showPosition(e) {
	var x, y;
	var e = e || window.event;

	document.getElementById("x").value = e.clientX
			+ document.body.scrollLeft
			+ document.documentElement.scrollLeft;
	document.getElementById("y").value = e.clientY
			+ document.body.scrollTop + document.documentElement.scrollTop

}

	function createNode(){
		var i = document.createElement("div");
		i.id="dd1";
		i["class"] = "easyui-draggable";
		i["data-options"] = "onDrag:onDrag";
		i.style="width:50px;height:50px;background:#fafafa;border:1px solid #ccc;";	
		return i;
	}

		+"</div>";
		
		return i;
