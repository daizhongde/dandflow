<script type="text/javascript">
var newCtrlNum=0;
var x = 0;//光标绝对坐标
var y = 0;//光标绝对坐标
var px = 0;//工作区的坐标-取工作区左上角的坐标
var py = 0;//工作区的坐标

var rx = 0;//光标相对工作区的坐标
var ry = 0;//光标相对工作区的坐标

/** 箭头起点  **/
var s = {x:0,y:0};//shift按下并且左键单击时初始化
/** 箭头终点 **/
var e = {x:0,y:0};//鼠标移动时实时更新
/** 上次画线终点 **/
var b4 = {x:0,y:0};//没次画完线更新

/** 画线开关 **/
var drawflag = false;

/** 专门记录鼠标的坐标   **/
function showPosition(e) {
	var e = e || window.event;

	x = e.clientX
			+ document.body.scrollLeft
			+ document.documentElement.scrollLeft;
	y = e.clientY
			+ document.body.scrollTop + document.documentElement.scrollTop;
	rx = x-px;
	ry = y-py;
	
	document.getElementById("x").value = rx;
	document.getElementById("y").value = ry;
	
	//如果划线开关为开，鼠标移动时就划线，线以s为起点，以鼠标当前位置e为终点
	if(drawflag){
		
		var line = new Line();   
		line.drawArrowLine(s.x, s.y, e.x, e.y);
	}
};
window.onkeydown=showkeyCode;
/** 显示按键代码  **/
function showkeyCode(e){
	document.getElementById("dcode").value=e.keyCode;
};
/** 在工作区指定位置创建一个可拖放的元素   
 * pageX 相对于工作区的X坐标
 * pageY 相对于工作区的Y坐标
 */
function createNode2(pageX, pageY){
	newCtrlNum ++;
	var i = "<div id='dd" + newCtrlNum + "' class='easyui-draggable' data-options='onDrag:onDrag' "
	+"style='width:34px;height:34px;background:#fafafa;border:1px solid #ccc; "
	+"position: absolute; left: "+pageX+"px; top: "+pageY+"px;'>"
	+"</div>";
	
	return i;
};

};
</script>

	if(e.shiftKey==1){
		s.x = rx;
		s.y = ry;
		drawflag = true;
	}
};

function onDragTask(e){
   var d = e.data; 
    if (d.left < 0){d.left = 0}
    if (d.top < 0){d.top = 0}
    if (d.left + $(d.target).outerWidth() > $(d.parent).width()){
        d.left = $(d.parent).width() - $(d.target).outerWidth();
    }
    if (d.top + $(d.target).outerHeight() > $(d.parent).height()){
        d.top = $(d.parent).height() - $(d.target).outerHeight();
    }
};
