<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>工作区</title>
	<link rel="stylesheet" type="text/css" href="../scripts/jquery-easyui/1.4.1/themes/default/easyui.css">
	<link rel="stylesheet" type="text/css" href="../scripts/jquery-easyui/1.4.1/themes/icon.css">
	<script type="text/javascript" src="../scripts/jquery-easyui/1.4.1/jquery.min.js"></script>
	<script type="text/javascript" src="../scripts/jquery-easyui/1.4.1/jquery.easyui.min.js"></script>
</head>
<body class="easyui-layout">
	<div data-options="region:'center',title:'noheader',iconCls:'icon-add'" noheader="true" class="easyui-droppable targetarea">
    	<div class="easyui-draggable" data-options="onDrag:onDrag" style="width:50px;height:50px;background:#fafafa;border:1px solid #ccc;">
        </div>
	</div>
	
<script>
   function onDrag(e){
       var d = e.data;
       if (d.left < 0){d.left = 0}
       if (d.top < 0){d.top = 0}
       if (d.left + $(d.target).outerWidth() > $(d.parent).width()){
           d.left = $(d.parent).width() - $(d.target).outerWidth();
       }
       if (d.top + $(d.target).outerHeight() > $(d.parent).height()){
           d.top = $(d.parent).height() - $(d.target).outerHeight();
       }
   }
</script>
</body>
</html>
