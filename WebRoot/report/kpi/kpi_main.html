<script type="text/javascript">
var noquery = VIRTUE.noquery;
var query = VIRTUE.query;
var OPE = VIRTUE.operator;
var del = VIRTUE.del;

var app={};
app.selectedRow = {};//记录数据表格中选择中的行

var jobType = ajaxReqRespText("/cbb/dicCBBgetDicByType.action?dicType=job_type" );
jobType = eval ("(" + jobType + ")");

function enterKeyDown(event)
{
    if(event.keyCode==13)
    {
    	submitForm();
	}
};

/** validate and assign value **/
function PackingParameter(){
	var job_ins_name = $('#jinsname').val();
	var type = $('#jtype').combobox("getValue");
	var author = $('#jauthor').val();
	var status = $('#jstatus').combobox('getValue');
	
	query.init();
	if(job_ins_name != ""){
		query.jdata.condition.job_ins_name = job_ins_name;
		query.jdata.operator.job_ins_name = OPE.CONTAIN;
	}
	if(type != "" && type != null){
		query.jdata.condition.type = type;
		query.jdata.operator.type = OPE.EQUAL;
	}
	if(author != ""){
		query.jdata.condition.author = author;
		query.jdata.operator.author = OPE.CONTAIN;
	}
	if(status != ""){
		query.jdata.condition["status"] = status;
		query.jdata.operator["status"] = OPE.EQUAL;
	}
	return true;
};

/** search data ,reload data  **/
function submitForm(){
   	if(!PackingParameter()){
   		return;
   	}
//  jdata = { act: 'query',condition: {'t1.nmlevel': [0,1,2,3]},operator : {'t1.nmlevel' : 13} };
   	$('#grid').datagrid( 'reload', { jdata: encodeURI( $.toJSON( query.jdata ) ) } );
};
/**  清空  **/
function clearForm(){
	$('#form').form('clear');
};

/** format level **/
function fmtStatus( n ){
// 	n = new String(n);
	return JSTATENAME[n]==undefined ? n : JSTATENAME[n];
};

/** 启动作业  **/
function startJob(){
	var rows = $('#grid').datagrid('getSelections');
	if(rows.length!=1){
		alert("Please select one row!");
		return false;
	};
	var row = $('#grid').datagrid('getSelected');
	var index = $('#grid').datagrid('getRowIndex', row);

	if (row && ( row.status == JSTATE.UNEXECUTE || row.status == JSTATE.PAUSE ) ) {
		app.selectedRow = row;
		
		var jdata = { jobId: row.job_id, job_ins_id: row.job_ins_id };
		$.ajax({
		   type: "POST",
		   url: "../../busi/migJobProcessBUSIstartJob.action",
		   async: false,
		   data: {
			   jdata: encodeURI( $.toJSON( jdata ) )
		   },
		   success: function(oResponse){
			   oResponse = eval("("+oResponse+")");
				alert( oResponse.msg );
				if (oResponse.success){
					$('#grid').datagrid('reload',{jdata: encodeURI( $.toJSON( query.jdata ) ) } );	// reload data
				}
		   }
		});
	}
};
/** 暂停作业  **/
function pauseJob(){
	var rows = $('#grid').datagrid('getSelections');
	if(rows.length!=1){
		alert("Please select one row!");
		return false;
	};
	var row = $('#grid').datagrid('getSelected');
	if (row && row.status == JSTATE.EXECUTING ) {
		app.selectedRow = row;
		
		var jdata = { jobId: row.job_id, job_ins_id: row.job_ins_id };
		$.ajax({
		   type: "POST",
		   url: "../../busi/migJobProcessBUSIpauseJob.action",
		   async: false,
		   data: {
			   jdata: encodeURI( $.toJSON( jdata ) )
		   },
		   success: function(oResponse){
			   oResponse = eval("("+oResponse+")");
				alert( oResponse.msg );
				if (oResponse.success){
					$('#grid').datagrid('reload',{jdata: encodeURI( $.toJSON( query.jdata ) ) } );	// reload data
				}
		   }
		});
	}
};

/** 重置作业  **/
function resetJob(){
	var rows = $('#grid').datagrid('getSelections');
	if(rows.length!=1){
		alert("Please select one row!");
		return false;
	};
	var row = $('#grid').datagrid('getSelected');
	if (row ) {
		app.selectedRow = row;
		
		var jdata = { jobId: row.job_id, job_ins_id: row.job_ins_id };
		$.ajax({
		   type: "POST",
		   url: "../../busi/migJobInsBUSImodifyJobStatus2init.action",
		   async: false,
		   data: {
			   jdata: encodeURI( $.toJSON( jdata ) )
		   },
		   success: function(oResponse){
			   oResponse = eval("("+oResponse+")");
				alert( oResponse.msg );
				if (oResponse.success){
					$('#grid').datagrid('reload',{jdata: encodeURI( $.toJSON( query.jdata ) ) } );	// reload data
				}
		   }
		});
	}
};
/** 监控*/
function monitor(index, row){
	app.selectedRow = row;
	window.location.href="../../busi/migJobProcessBUSImonitor.action?id="+row.job_ins_id+"&jid="+row.job_id;
	return false;//to support IE6
};
function removeInstance(){
// 	var row = $('#grid').datagrid('getSelected');
	var rows = $('#grid').datagrid('getSelections');
	
	if (rows.length != 0 ) {
		$.messager.confirm('Confirm', 'Confirm Remove?', function(r) {
			if (r) {
				var job_ins_id = new Array();
				for(var i=0; i<rows.length; i++ ){
					job_ins_id.push(rows[i].job_ins_id);
				}
				
				var jdata = { job_ins_id: job_ins_id };
				$.ajax({
				   type: "POST",
				   url: "../../busi/migJobInsBUSIremoveInstance.action",
				   async: false,
				   data: {
					   jdata: encodeURI( $.toJSON( jdata ) )
				   },
				   success: function(oResponse){
					   oResponse = eval("("+oResponse+")");
						alert( oResponse.msg );
						if (oResponse.success){
							$('#grid').datagrid('reload',{jdata: encodeURI( $.toJSON( query.jdata ) ) } );	// reload data
						}
				   }
				});
			}
		});
	}
};
/** 导入作业excel文件  */
function importKPIExcelFile() {
	$("#importKPIExcelFile").dialog(
			{
				title : "Import KPI Script",
				href : getContextPath()
						+ "/report/kpi/kpi_import.html",
				iconCls : 'icon-edit',
				modal : true,
				closed : true,
				resizable : true,
				minimizable : true,
				maximizable : true,
				cache : false,
				width : 800,
				height : 150,
				buttons : [ {
					id: 'imp_btn',
					text : 'OK',
					iconCls : 'icon-ok',
					handler : function() {
						btnExcelI_onClick();
						$('#imp_btn').linkbutton('disable');
						return false;//for IE6 support
					}
				}, {
					text : 'Cancel',
					iconCls : 'icon-cancel',
					handler : function() {
						$('#importKPIExcelFile').dialog('close');
					}
				} ]
			});
	$("#importKPIExcelFile").dialog('open');
};

/**  上传前检查，并从数据库获取该批次的社保机构号   **/
function btnExcelI_onClick() {
	var path = document.getElementById("upload").value;
	if (path == "") {
		alert("Please select file！");
		return;
	}
	ajaxFileUpload();
};

/**  上传  **/
function ajaxFileUpload() {
	$("#loading").ajaxStart(function() {
		$(this).show();
	}).ajaxComplete(function() {
		$(this).hide();
	});
	$("#loading").show();
	$.ajaxFileUpload({
		url : getContextPath() + "/imp/migJobInfoIMPimportKPIXLS.action",
		secureuri : false,
		fileElementId : 'upload',
		//data: "",
		dataType : 'text',
		success : function(data, status) {
			data = eval("(" + data + ")");
// 			alert(data.msg);
			if (data.success) {
				$('#importKPIExcelFile').dialog('close');
				downloadFile(data.path);
// 				submitForm();
			}
			$("#loading").hide();
		},
		error : function(data, status, e) {
			alert("Error:" + data + ",exception:" + e);
			$("#loading").hide();
		}
	});
};
/** export data, don't search   **/
function downloadFile(path){
    var form = document.createElement("form");
    document.body.appendChild(form);
    var i = document.createElement("input");
    i.type = "hidden";
    i.name = "tempFAbsPath";
    i.value = path;
    form.appendChild(i);
    form.action = "../../exp/downloadEXPdownloadXLS.action";
    form.method = "post";
    form.submit();
};
var toolbar = [{
	text:'Monitor',
	iconCls:'icon-monitor',
	handler: function(){
		var rows = $('#grid').datagrid('getSelections');
		if(rows.length!=1){
			alert("Please select one row!");
			return false;
		};
		
		var row = $('#grid').datagrid('getSelected');
		var index = $('#grid').datagrid('getRowIndex', row);
		
		monitor(index, row );
		return false;//to support IE6
	}
},{
	text:'Start',
	iconCls:'icon-run',
	handler: function(){
		startJob(); 
	}
},{
	text:'Pause',
	iconCls:'icon-pause',
	handler: function(){
		pauseJob();
	}
},{
	text:'Reset',
	iconCls:'icon-back',
	handler: function(){
		resetJob();
	}
},{
	text:'Remove',
	iconCls:'icon-remove',
	handler: function(){
		removeInstance();
	}
}, {
	text : 'Import KPI Script',
	iconCls : 'icon-import',
	handler : function() {
		importKPIExcelFile();
		return false;
	}
}];
//program component
$(function(){
	$('#grid').datagrid({
		title: 'Search Result',
		//iconCls:'icon-reload',
		toolbar: toolbar,
		width: 938,
		height: 720,
		nowrap: true,
		striped: true,
		fit: true,
// 		collapsible: true,
		url: "../../query/migJobInsJEasyUIQUERYdfind.action",
		idField: "job_ins_id",
		remoteSort: true,
		sortName:"job_ins_id",
		sortOrder:"desc",
		singleSelect: false,
		columns: [[
            {title:'Instance ID',field:"job_ins_id", hidden: true},
            {title:'Job ID',field:"job_id", hidden: true},
            {
				title : 'Dryrun',
				field : "dryrun",
				width : 120
			},
		    {title:'Instance Name',field:"job_ins_name", width:180, sortable: true},
		    {title:'Instance Type',field:"type", width:120, sortable: true, formatter: function(value,row, index ){
				for(var i=0, j=jobType.length; i<j; i++){
					if( jobType[i].code == value ){
						return jobType[i].value
					}
				}
			} },
			{title:'Author',field:"author",width:80, sortable: true  },
		    {title:'Description',field:"remark",width:280 },
		    {title:'Status',field:"status",width:80, formatter: fmtStatus,sortable: true },
		    {title:'Last Update Time',field:"mtime",width:130, sortable: true }
		]],
		rownumbers:true,
		pagination:true,
		pageSize: 20,
		queryParams:{
			jdata: encodeURI($.toJSON( noquery.jdata )) 
		},
		onDblClickRow: monitor
	});

	$('#dryrunId').combogrid({
		url : getContextPath()+"/query/commonCBBQUERYdfind.action",
		queryParams : {
			tableName : "v_dryrun_config",
			columns: "mig_dryrun_name"
		},
		editable:false,
		panelWidth : 500,
		panelHeight : 200,
		idField : 'mig_dryrun_id',
		textField : 'mig_dryrun_name',
		pagination : true,
		fitColumns : false,
		required : true,
		rownumbers : true,
		mode : 'remote',
		delay : 500,
		sortName : 'mig_dryrun_name',
		sortOrder : 'asc',
		pageSize : 5,
		pageList : [ 5, 10 ],
		columns : [ [
			{ title : 'ID', field : 'mig_dryrun_id',width : 90, sortable: true }, 
			{ title : 'Dry Run名称', field : 'mig_dryrun_name', width : 120, sortable: true }, 
			{ title : '备注', field : 'remark',  width : 300 } 
		] ]
	});
});
</script>
