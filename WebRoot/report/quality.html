<!DOCTYPE html>  
<html>  
<head>  
    <meta charset="UTF-8">  
    <title>字段级稽核报表（图）</title>  
<link rel="stylesheet" type="text/css" href="../scripts/jquery-easyui/1.4.1/themes/default/easyui.css"/>
<link rel="stylesheet" type="text/css" href="../scripts/jquery-easyui/1.4.1/themes/icon.css"/>
<script type="text/javascript" src="../scripts/jquery-easyui/1.4.1/jquery.min.js"></script>
<script type="text/javascript" src="../scripts/jquery-easyui/1.4.1/jquery.easyui.min.js"></script>
<script type="text/javascript" src="../scripts/json/jquery.json-2.2.min.js"></script>

<script type="text/javascript" src="../scripts/jquery-easyui/1.4.1/plugins/easyuiExtends.js"></script>
<script type="text/javascript" src="../scripts/virtue/virtue.js"></script>
<script type="text/javascript" src="../scripts/utils/commonUtil.js"></script>
<script type="text/javascript">
var noquery = VIRTUE.noquery;
var query = VIRTUE.query;
var OPE = VIRTUE.operator;
var del = VIRTUE.del;

/** validate and assign value **/
function PackingParameter(){
	var formData = $('#form').form( 'getData');
	query.init();
	for (var field in formData) {
		if( formData[field] !== "" ){
			query.jdata.condition[field] = formData[field];
			query.jdata.operator[field] = OPE.CONTAIN;
		}
	}
	return true;
};

/** search data ,reload data  **/
function submitForm(){
   	if(!PackingParameter()){
   		return;
   	}
    document.getElementById("report").src="quality_iframe.jsp?dryrunId="+ query.jdata.condition["dryrunId"];
	return true;
};
/**  清空  **/
function clearForm(){
	$('#form').form('clear');
};
$(function(){
	$('#dryrunId').combogrid({
		url : getContextPath()+"/query/commonCBBQUERYdfind.action",
		queryParams : {
			tableName : "v_dryrun_config",
			columns: "mig_dryrun_name"
		},
		editable:false,
		panelWidth : 500,
		panelHeight : 200,
		idField : 'mig_dryrun_id',
		textField : 'mig_dryrun_name',
		pagination : true,
		fitColumns : false,
		required : true,
		rownumbers : true,
		mode : 'remote',
		delay : 500,
		sortName : 'mig_dryrun_name',
		sortOrder : 'asc',
		pageSize : 5,
		pageList : [ 5, 10 ],
		columns : [ [
			{ title : 'ID', field : 'mig_dryrun_id',width : 90, sortable: true }, 
			{ title : 'Dry Run名称', field : 'mig_dryrun_name', width : 120, sortable: true }, 
			{ title : '备注', field : 'remark',  width : 300 } 
		] ]
	});
});

</script>
</head>  
<body rightmargin="0" bottommargin="0" leftmargin="0" topmargin="0" class="easyui-layout">
 <div data-options="region:'north',border:true,split:true" style="height:70px;background:#B3DFDA;" title="Quality" >  
        <div style="padding:0px 0 0px 15px;height:auto">  
            <form id="form" method="post">  
	            <table>  
	                <tr>
	                    <td>Dryrun:</td>
						<td>
							<input id='dryrunId' name='dryrunId' />
						</td>
	        			<td>
	                    	<div style="text-align:center;padding:0px 0 0px 15px">  
					            <a href="javascript:void(0)" class="easyui-linkbutton" iconCls="icon-search" onclick="submitForm()">Report</a>
					            <a href="javascript:void(0)" class="easyui-linkbutton" iconCls="icon-clear" onclick="clearForm()">Reset</a>
					        </div> 
	        			</td>
	                </tr>
	            </table>
	        </form>  
        </div>
    </div>
    <div data-options="region:'center',border:true" title="report1" style="overflow:hidden;" noheader="true">
		<iframe scrolling="yes" id = "report" name = "report" frameborder="0" src="blank2.html" style="width:100%;height:100%"></iframe>
	</div>
</body>  
</html>
