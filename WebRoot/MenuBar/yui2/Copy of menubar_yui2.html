<script type="text/javascript">
var app = {};

YAHOO.util.Event.onContentReady("productsandservices", function () {
	
	var oMenuBar = new YAHOO.widget.MenuBar("productsandservices", { 
        autosubmenudisplay: true, 
        hidedelay: 750, 
        lazyload: true });
	
    function onMenuClick(p_sType, p_aArgs, p_oValue) {
    	alert("p_sType:"+p_sType);
    	alert("p_aArgs:"+p_aArgs);
    	alert("p_oValue:"+p_oValue);
    };
    
    function onMenuItemClick(p_sType, p_aArgs, p_oValue) {
    	alert("index: " + this.index + 
                   ", text: " + this.cfg.getProperty("text") + 
                   ", value: " + p_oValue);
    };
    
	var sUrl = "../../tree/tAuthorityModuleTREEquery_YUI2_Menu.action";
// 	var sUrl = "menuJSONArray.json";
	var callback = {
		success: function(oResponse) {
			
			var aSubmenuData = eval("(" + oResponse.responseText + ")");

//		 	<li class="yuimenubaritem first-of-type">
//		 		<a class="yuimenubaritemlabel" href="#communication">系统管理</a>
//		 	</li>
//		 	<li class="yuimenubaritem">
//		 	    <a class="yuimenubaritemlabel" href="http://shopping.yahoo.com">开户机构维护</a>
//		 	</li>
			

	        var ua = YAHOO.env.ua,
	            oAnim;  // Animation instance
	        function onSubmenuBeforeShow(p_sType, p_sArgs) {
	            var oBody,
	                oElement,
	                oShadow,
	                oUL;
	            if (this.parent) {
	                oElement = this.element;
	                oShadow = oElement.lastChild;
	                oShadow.style.height = "0px";
	                if (oAnim && oAnim.isAnimated()) {
	                    oAnim.stop();
	                    oAnim = null;
	                }
	                oBody = this.body;
	
	                if (this.parent && 
	                    !(this.parent instanceof YAHOO.widget.MenuBarItem)) {
	                    if (ua.gecko || ua.opera) {
	                        oBody.style.width = oBody.clientWidth + "px";
	                    }
	                    if (ua.ie == 7) {
	                        oElement.style.width = oElement.clientWidth + "px";
	                    }
	                }
	                oBody.style.overflow = "hidden";
	                oUL = oBody.getElementsByTagName("ul")[0];
	                oUL.style.marginTop = ("-" + oUL.offsetHeight + "px");
	            }
	        }

	        function onTween(p_sType, p_aArgs, p_oShadow) {
	            if (this.cfg.getProperty("iframe")) {
	                this.syncIframe();
	            }
	            if (p_oShadow) {
	                p_oShadow.style.height = this.element.offsetHeight + "px";
	            }
	        }
	
	        function onAnimationComplete(p_sType, p_aArgs, p_oShadow) {
	            var oBody = this.body,
	                oUL = oBody.getElementsByTagName("ul")[0];
	
	            if (p_oShadow) {
	                p_oShadow.style.height = this.element.offsetHeight + "px";
	            }
	            oUL.style.marginTop = "";
	            oBody.style.overflow = "";
	
	            if (this.parent && 
	                !(this.parent instanceof YAHOO.widget.MenuBarItem)) {
	                if (ua.gecko || ua.opera) {
	                    oBody.style.width = "";
	                }
	                if (ua.ie == 7) {
	                    this.element.style.width = "";
	                }
	            }
	        }

	        function onSubmenuShow(p_sType, p_sArgs) {
	            var oElement,
	                oShadow,
	                oUL;
	        
	            if (this.parent) {
	                oElement = this.element;
	                oShadow = oElement.lastChild;
	                oUL = this.body.getElementsByTagName("ul")[0];
	                oAnim = new YAHOO.util.Anim(oUL, 
	                    { marginTop: { to: 0 } },
	                    .5, YAHOO.util.Easing.easeOut);
	
	                oAnim.onStart.subscribe(function () {
	                    oShadow.style.height = "100%";
	                });
	                oAnim.animate();
	                if (YAHOO.env.ua.ie) {
	                    oShadow.style.height = oElement.offsetHeight + "px";
	                    oAnim.onTween.subscribe(onTween, oShadow, this);
	                }
	                oAnim.onComplete.subscribe(onAnimationComplete, oShadow, this);
	            }
	        }
	            
	        oMenuBar.subscribe("beforeRender", function () {
				var nSubmenus = aSubmenuData.length, i;
				if (this.getRoot() == this) {
					for (i = 0; i < nSubmenus; i++) {
						this.getItem(i).cfg.setProperty("submenu", aSubmenuData[i]);
					}
				}
	        });
	        oMenuBar.subscribe("beforeShow", onSubmenuBeforeShow);
	        oMenuBar.subscribe("show", onSubmenuShow);
	        
	        oMenuBar.subscribe("click", onMenuClick);
	        
	        oMenuBar.render();
		},
        timeout: 7000
	};
	
	YAHOO.util.Connect.asyncRequest('POST', sUrl, callback);
});
        
        
YAHOO.example.doLayout = function() {

            //app.basefrm.set('height', (this.getSizes().center.h-74) + 'px');//114没有新增按钮,141:有button不在header,144有button在header,
            //app.basefrm._syncColWidths();
        }
    }, app.layout, true);
           
    app.layout.on('render', function() {
    	YAHOO.util.Dom.setStyle( app.basefrm , "height" , (this.getSizes().center.h-37) + 'px');//have reset.css -32  no reset.css -37
    	//app.basefrm.set('height', (this.getSizes().center.h-74) + 'px');
    }, app.layout, true);  
    
    app.layout.render();
	
    return {
    };
        
};
//YAHOO.example.DynamicData
YAHOO.util.Event.addListener(window, "load", YAHOO.example.doLayout);
