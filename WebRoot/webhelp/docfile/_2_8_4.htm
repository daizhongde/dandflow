</p>

<p class=MsoNormal style='text-indent:36.0pt'><span style='font-family:宋体'>文件管理支持文件查看、文件上传、删除文件等操作；当前选中的左侧文件列表中的文件夹为活动对象，所有操作都针对活动对象进行，即查看的为活动对象内文件或子文件夹，上传文件将被保存在活动对象内等等。</span></p>

<p class=MsoNormal style='text-indent:36.0pt'><span style='font-family:宋体'>如</span><span
lang=X-NONE>SplitFile</span><span style='font-family:宋体'>、</span><span
