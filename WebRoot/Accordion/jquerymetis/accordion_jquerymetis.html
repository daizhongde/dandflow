<script type="text/javascript">
$(document).ready(function () {
	if(jsonData.length==0){
		alert("没有找到根模块!");
	}

	/** recursive create node. author: daizhongde dep.IT  
	 * @param o       node
	 * @param pFolder parentDocument
	 * @param k       id
	 * @param level   menu level
	 */
	function gNode( o, pFolder, k, level )
	{
		if(o.children===undefined){//create leaf node
			pFolder.append("<li><a class=\"J_menuItem\" href=\""+o.url+"\")>"+o.text+"</a></li>");
		
		}else{//create noleaf node
			var levelclass = "";
			switch (level)
			{
			case 1:
			  	levelclass="nav nav-second-level";
			  	break;
			case 2:
			  	levelclass="nav nav-third-level";
			  	break;
			}
			pFolder.append("<li><a href=\"#\"><i class=\"fa "+o.iconcls+"\"></i><span class=\"nav-label\">"+o.text+"</span><span class=\"fa arrow\"></span></a>"
						  +"	<ul id='ulmenu"+o.id+"' class=\""+levelclass+"\"></ul>"
						  +"</li>");
			
			for (var i in o.children){//recursive call itself
				gNode( o.children[i], $("#ulmenu"+o.id), k, level+1 );
			}
		}
	};

	var childData = jsonData[0].children;
	for (var k in childData){
		//root level=0
		gNode( childData[k], $("#side-menu"), k, 1 );
	}
    // MetsiMenu
    $('#side-menu').metisMenu();
});
</script>
