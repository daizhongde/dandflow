<script type="text/javascript">

/** update right view panel  **/
function updateView( node ){
		
	jQuery('#id').val( node.id );
	jQuery('#name').val( node.text );
	jQuery('#code').val( node.attributes.code );
	jQuery('#level').combobox( 'setValue', node.attributes.level );
	
// 	jQuery('#type').combobox( 'setValue', node.attributes.type );
	document.getElementById("type").value= node.attributes.type;
// 	jQuery('#leaf').combobox( 'setValue', node.attributes.leaf );
	document.getElementById("leaf").value= node.attributes.leaf;
	
	jQuery('#superior').combotree( 'setValue', node.attributes.superior );//pojo.NIparent.NIid
	
	jQuery('#manager').val( node.attributes.manager );
	jQuery('#mtel').val( node.attributes.mtel );
	jQuery('#memail').val( node.attributes.memail );
	jQuery('#mqq').val( node.attributes.mqq );
	
	jQuery('#linkman').val( node.attributes.linkman );
	jQuery('#ltel').val( node.attributes.ltel );
	jQuery('#lemail').val( node.attributes.lemail );
	jQuery('#lqq').val( node.attributes.lqq );
	
	jQuery('#address').val( node.attributes.address ); 
	jQuery('#description').val( node.attributes.description ); 
};

/** update tree node's text  **/
function onChangeInstField( o ){
	var t = $('#tt');
	var node = t.tree('getSelected');
	
// 	alert("onChangeInstField!");
	if( node != null )
	{
// 		if(node.text != o.value ){
		if( o.id=='name' )
		{
			//Don't refresh tree every change, update node in front
// 			alert('name change excuted!');
// 			node.text = o.value;
			t.tree('update', {
				target: node.target,
				text: o.value
			});
		}
		
		//t.tree('reload');
		//do reload after updateModel when necessary
		node.attributes[o.id] = o.value;//node's attribute would be effected
		
		VIRTUE.update.init();
		VIRTUE.update.jdata.data[o.id] = o.value;
		VIRTUE.update.jdata.condition.id = node.id; 
		VIRTUE.update.jdata.operator.id = VIRTUE.operator.EQUAL;//default,this line can comment
		updateModel( VIRTUE.update.jdata );
	}
};

<script type="text/javascript">
/** add a module event hander */
function append() {
	newNodeCount ++;
	var t = $('#tt');
	var node = t.tree('getSelected');
	if(node.state=="closed")//deal with asyc node
	{
		appendFlag = 1;
		t.tree('expand', node.target);
	}
	else
	{
		append_F();
	}
};
/** add a module,append a node finally */
function append_F() {
	var t = $('#tt');
	var node = t.tree('getSelected');
	
	var newNode = {
		id: 'newNode' + newNodeCount,
		text : '新建机构' + newNodeCount,
		state: 'open',
		attributes :{
			code: "",
			level: node.attributes.level + 1,
			type: node.attributes.type + 1,
			leaf: 'true',
			superior: node.id
		}
	};
	
	t.tree('append', {
		parent : (node ? node.target : null),
		data : [ newNode ]
	} );
	
// 	find a node and then select it
	var newNode1 = t.tree( 'find', 'newNode'+newNodeCount );
// 	t.tree('select', newNode1.target);
// 	t.tree('scrollTo',newNode1.target);
// 	updateView( newNode1 );
	
	VIRTUE.add.init();
	VIRTUE.add.jdata.data.name = newNode1.text;
	VIRTUE.add.jdata.data.level = newNode1.attributes.level;
	VIRTUE.add.jdata.data.type = newNode1.attributes.type;
	VIRTUE.add.jdata.data.leaf = newNode1.attributes.leaf;
	VIRTUE.add.jdata.data.superior = newNode1.attributes.superior;
	
	createModel( VIRTUE.add.jdata, newNode1 );
}
 /**
  * del a module:
  	1:cud.jdata.del.rows.push(1);
  */
function removeit() {
	var node = $('#tt').tree('getSelected');
	
	VIRTUE.del.init();
	VIRTUE.del.jdata.condition.id = node.id; 
	VIRTUE.del.jdata.operator.id = VIRTUE.operator.EQUAL;//default,this line can comment
	destroyModel( VIRTUE.del.jdata, node );
// 	$('#tt').tree('remove', node.target);
}
function collapse() {
	var node = $('#tt').tree('getSelected');
	$('#tt').tree('collapse', node.target);
}
function expand() {
	var node = $('#tt').tree('getSelected');
	$('#tt').tree('expand', node.target);
};
function collapseAll() {
	$('#tt').tree('collapseAll');
}
function expandAll() {
	$('#tt').tree('expandAll');
}
/** create db model 
 *
 @param jdata for sqlassembel
 @param id new node's id
 */
function createModel( jdata, newNode1 ){
	var t = $('#tt');
	
	jQuery.post("../../curd/tAuthorityInstCURDaddRetId.action", {
		jdata : encodeURI( jQuery.toJSON( jdata ) )
	}, function(oResponse, status) {
// 		oResponse = eval("(" + oResponse + ")");
// 		alert(oResponse.msg);
		if (oResponse.success == true) {
			
			var code = new String("00000000"+oResponse.id);
			code = code.substring(code.length-9);
			
			t.tree('update', {
	 			target: newNode1.target,
	 			id: oResponse.id,
	 			state: 'open',
	 			attributes:{
	 				code: code,
	 				level: newNode1.attributes.level,
	 				type: newNode1.attributes.type,
	 				leaf: 'true'
	 			}
	 		});
			
			var newNode = t.tree( 'find', oResponse.id );
		 	t.tree('select', newNode.target);
		 	t.tree('scrollTo',newNode.target);
		 	updateView( newNode );
		 	
		}else{
			alert(oResponse.msg);
			t.tree( 'remove', newNode1.target );
		}
	});
};

/** update db model **/
function updateModel( jdata ){
	jQuery.post("../../curd/tAuthorityInstCURDmodify.action", {
		jdata : encodeURI( jQuery.toJSON( jdata ) )
	}, function(oResponse, status) {
		var t = jQuery('#tt');
// 		oResponse = eval("(" + oResponse + ")");
// 		alert(oResponse.msg);
		if (oResponse.success == true) {
			if( jdata.data.leaf != null && jdata.data.leaf != undefined ){
				t.tree( 'reload' );
			}
			//弹出一个层一秒钟后消失
		    document.getElementById("mylayer").style.display="inline";
		    var t=setTimeout("document.getElementById('mylayer').style.display='none'",1000);
		}else if (oResponse.success == false) {
			alert(oResponse.msg);
			t.tree( 'reload' );
		}
	});
};

/** delete db model 
 *@param jdata for sqlassembel
  @param node to judge whether delete node is last node
 */
function destroyModel( jdata, node ){
// 	t.tree( 'getData', node.target ).children.length

	/** there two post request, You can use a delete request do all back process, but it with Low efficiency  **/
	jQuery.post("../../curd/tAuthorityInstCURDdelete.action", {
// 		id : node.id,
		jdata : encodeURI( jQuery.toJSON( jdata ) )
	}, function(oResponse, status) {
		var t = $('#tt');
// 		oResponse = eval("(" + oResponse + ")");
// 		alert(oResponse.msg);
		if (oResponse.success == true) {
			t.tree( 'reload' );//for node icon
		}else{
			alert(oResponse.msg);
			t.tree( 'reload' );
		}
	});
};
