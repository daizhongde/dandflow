<script type="text/javascript">
var newNodeCount = 0;
var appendFlag = 0;

/** update right view panel  **/
function updateView( node ){
	/* alert( "id:" + node.id +",\n"+
			"text:" + node.text + ",\n"+
			"state:" + node.state + ",\n"+
			"checked:" + node.checked + ",\n"+
			"children:" + node.children + ",\n"+
			"attributes:" + node.attributes + ",\n"+
			"attributes.leaf:" + node.attributes.leaf + ",\n"+
			"attributes.level:" + node.attributes.level + ",\n"+
			"attributes.parent:" + node.attributes.parent + ",\n"+
			"attributes.order:" + node.attributes.order + ",\n"+
			"attributes.iconcls:" + node.attributes.iconcls + ",\n"+
			"attributes.expanded:" + node.attributes.expanded + ",\n"+
			"attributes.checked:" + node.attributes.checked + ",\n"+
			"attributes.url:" + node.attributes.url + ",\n"+
			"attributes.note:" + node.attributes.note );  // alert node text property when clicked
				alert( $.toJSON(node) );*/
	
	if(node.attributes.level==1){
		jQuery('#nrid').val( "" );
		jQuery('#crno').val( "" );
		jQuery('#crname').val( "" );
		jQuery('#nrlevel').combobox( 'setValue',  "" );
		jQuery('#crnote').val( "" ); 
		
	 	var mt = $('#mt');
	 	var mt_root = mt.tree( 'find', 1 );
	 	mt.tree('reload', mt_root.target );
		return;
	}else{
		jQuery('#nrid').val( node.id );
		jQuery('#crno').val( node.attributes.no );
		jQuery('#crname').val( node.text );
		jQuery('#nrlevel').combobox( 'setValue', node.attributes.rlevel );
//	 	document.getElementById("cmleaf").value= node.attributes.leaf;

		jQuery('#crnote').val( node.attributes.note ); 
//	 	$('#mt').attr("data-options","url:'../../tree/tAuthorityModuleTREEquery_JEasyUI_CheckBoxTree.action?roleId="+node.id+"',method:'get',animate:true,checkbox:true,onlyLeafCheck : true"); 
//	 	data-options="url:'../../tree/tAuthorityModuleTREEquery_JEasyUI_CheckBoxTree.action',method:'get',animate:true,checkbox:true,onlyLeafCheck : true"
	}
				
	//由于tree没有reload(url)方法，所以这里对原来的combotree做了覆盖
	$('#mt').tree({
		url : "../../tree/tAuthorityModuleTREEquery_JEasyUI_CheckBoxTree.action?roleId="+node.id,
		method:'post',
		animate : true,
		checkbox : true,
		onlyLeafCheck : true
	});
};


/** update tree node's role no.  **/
function onChangeCRno( o ){
	var t = $('#tt');
	var node = t.tree('getSelected');
	if( node != null ){
		node.attributes.url = o.value;
// 		alert('url change excuted!');
		VIRTUE.update.init();
		VIRTUE.update.jdata.data.no = o.value;
		VIRTUE.update.jdata.condition.id = node.id; 
		VIRTUE.update.jdata.operator.id = VIRTUE.operator.EQUAL;//default,this line can comment
		updateModel( VIRTUE.update.jdata );
	}
};

/** update tree node's text  **/
function onChangeCRname( o ){
	var t = $('#tt');
	var node = t.tree('getSelected');
	if( node != null && node.attributes.level != 1 ){
		node.text = o.value;
// 		alert('name change excuted!');
		t.tree('update', {
			target: node.target,
			text: o.value
		});
		//t.tree('reload');
		VIRTUE.update.init();
		VIRTUE.update.jdata.data.name = o.value;
		VIRTUE.update.jdata.condition.id = node.id; 
		VIRTUE.update.jdata.operator.id = VIRTUE.operator.EQUAL;//default,this line can comment
		updateModel( VIRTUE.update.jdata );
	}
};


/** update tree node's note  **/
function onChangeCRnote( o ){
	var t = $('#tt');
	var node = t.tree('getSelected');
	if( node != null && node.attributes.level != 1  ){
		node.attributes.note = o.value;
// 		alert('note change excuted!');
		VIRTUE.update.init();
		VIRTUE.update.jdata.data.note = o.value;
		VIRTUE.update.jdata.condition.id = node.id; 
		VIRTUE.update.jdata.operator.id = VIRTUE.operator.EQUAL;//default,this line can comment
		updateModel( VIRTUE.update.jdata );
	}
};

						left: e.pageX,
						top: e.pageY
					});
				},
				onExpand: function(node){
					if(appendFlag==1){
						append_F();
						appendFlag=0;

	<div id="mm" class="easyui-menu" style="width:120px;">

		<div onclick="collapseAll()">全部折叠</div>

<script type="text/javascript">
/** add a module event hander */
function append() {
	newNodeCount ++;
	var t = $('#tt');
	var node = t.tree('getSelected');
	if(node.state=="closed")//deal with asyc node
	{
		appendFlag = 1;
		t.tree('expand', node.target);
	}
	else
	{
		append_F();
	}
};
/** add a module,append a node finally */
function append_F() {
	var t = $('#tt');
	var node = t.tree('getSelected');

	if( node.attributes.level == 2  ){
		alert("请在角色类别下面添加角色!");
		return;
	}
	
	var newNode = {
		id: 'newNode' + newNodeCount,
		text : '新建角色' + newNodeCount,
		state: 'open',
		attributes :{
			leaf: 'true',
			parent: node.id,
			no: "",
			level: node.attributes.level + 1,//2
			rlevel : node.attributes.rlevel,
			note: ""
		}
	};
	
	t.tree('append', {
		parent : (node ? node.target : null),
		data : [ newNode ]
	} );
	
// 	find a node and then select it
	var newNode1 = t.tree( 'find', 'newNode'+newNodeCount );
	
	VIRTUE.add.init();
	VIRTUE.add.jdata.data.name = newNode1.text;
// 	VIRTUE.add.jdata.data.path = newNode1.attributes.url;
// 	VIRTUE.add.jdata.data.leaf = newNode1.attributes.leaf;
// 	VIRTUE.add.jdata.data.parent = newNode1.attributes.parent;
	VIRTUE.add.jdata.data.level = newNode1.attributes.rlevel;
// 	VIRTUE.add.jdata.data.order = newNode1.attributes.order;
	VIRTUE.add.jdata.data.note = newNode1.attributes.note;
	
	createModel( VIRTUE.add.jdata, newNode1 );
}
 /**
  * del a module:
  	1:cud.jdata.del.rows.push(1);
  */
function removeit() {
	var node = $('#tt').tree('getSelected');
	if( node.attributes.level == 1  ){
		alert("不能删除角色类别!");
		return;
	}
	
	VIRTUE.del.init();
	VIRTUE.del.jdata.condition.id = node.id; 
	VIRTUE.del.jdata.operator.id = VIRTUE.operator.EQUAL;//default,this line can comment
	destroyModel( VIRTUE.del.jdata, node );
	$('#tt').tree('remove', node.target);
}
function collapse() {
	var node = $('#tt').tree('getSelected');
	$('#tt').tree('collapse', node.target);
}
function expand() {
	var node = $('#tt').tree('getSelected');
	$('#tt').tree('expand', node.target);
};
function collapseAll() {
	$('#tt').tree('collapseAll');
}
function expandAll() {
	$('#tt').tree('expandAll');
}
/** create db model 
 *
 @param jdata for sqlassembel
 @param id new node's id
 */
function createModel( jdata, newNode1 ){
	var t = $('#tt');
// 	var newNode1 = t.tree( 'find', id );
	
	jQuery.post("../../curd/tAuthorityRoleCURDaddRetId.action", {
		jdata : encodeURI( jQuery.toJSON( jdata ) )
	}, function(oResponse, status) {
// 		oResponse = eval("(" + oResponse + ")");
// 		alert(oResponse.msg);
		if (oResponse.success == true) {
			var rno = new String("00"+oResponse.id);
			rno = rno.substring(rno.length-3);
			
			t.tree('update', {
	 			target: newNode1.target,
	 			id: oResponse.id,
	 			state: 'open',
	 			attributes:{
	 				leaf: 'true',
	 				no: rno,
	 				level: newNode1.attributes.level,//2,
	 				rlevel: newNode1.attributes.rlevel
	 			}
	 		});
			
			var newNode = t.tree( 'find', oResponse.id );
		 	t.tree('select', newNode.target);
		 	t.tree('scrollTo',newNode.target);
		 	updateView( newNode );
		}else{
			alert(oResponse.msg);
// 			t.tree( 'remove', newNode1.target );
			t.tree( 'reload' );
		}
	});
};

/** update db model **/
function updateModel( jdata, node ){
	jQuery.post("../../curd/tAuthorityRoleCURDmodify.action", {
		jdata : encodeURI( jQuery.toJSON( jdata ) )
	}, function(oResponse, status) {
		var t = jQuery('#tt');
// 		oResponse = eval("(" + oResponse + ")");
// 		alert(oResponse.msg);
		if (oResponse.success == true) {
			//弹出一个层一秒钟后消失
		    document.getElementById("mylayer").style.display="inline";
		    var t=setTimeout("document.getElementById('mylayer').style.display='none'",1000);
		}else if (oResponse.success == false) {
			alert(oResponse.msg);
			t.tree( 'reload' );
		}
	});
};
