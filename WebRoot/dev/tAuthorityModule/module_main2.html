<script type="text/javascript">

var appendFlag = 0;

var add = VIRTUE.add;

// var buttonCBBData = getDicBySQLName.action?dicType=buttonNo

var buttonCodeData = ajaxReqRespText("/cbb/tAuthorityFuncCBBgetCBBData_CodeAndName.action" );
// console.log("buttonCodeData:"+buttonCodeData)
buttonCodeData = eval ("(" + buttonCodeData + ")");

/** format field audit type  **/
function fmtButtonCode(n){
// 	n  = new String(n);
// 	n  = new Number(n);
	for(var i=0, j=buttonCodeData.length; i<j; i++ ){
		if( buttonCodeData[i].id == n ){
			return buttonCodeData[i].text;
		}
	}
	return n;
};

/** update right view panel  **/
function updateView( node ){	
	jQuery('#nmid').val( node.id );
	jQuery('#cmname').val( node.text );
	jQuery('#cmpath').val( node.attributes.url );
// 	jQuery('#cmleaf').combobox( 'setValue', node.attributes.leaf );
	document.getElementById("cmleaf").value= node.attributes.leaf;
	
	jQuery('#nmparent').combotree( 'setValue', node.attributes.parent );//pojo.NMparent.NMid
	jQuery('#nmorder').numberbox( 'setValue', node.attributes.order );
	jQuery('#nmlevel').combobox( 'setValue', node.attributes.level );
	if( node.id == 1 ){
		jQuery('#nmlevel').combobox( 'setValue', '0' );
	}
	jQuery('#cmnote').val( node.attributes.note ); 
};

/** update tree node's text  **/
function onChangeCMname( o ){
	var t = $('#tt');
	var node = t.tree('getSelected');
	if( node != null ){
		node.text = o.value;
// 		alert('name change excuted!');
		t.tree('update', {
			target: node.target,
			text: o.value
		});
		//t.tree('reload');
		VIRTUE.update.init();
		VIRTUE.update.jdata.data.name = o.value;
		VIRTUE.update.jdata.condition.id = node.id; 
		VIRTUE.update.jdata.operator.id = VIRTUE.operator.EQUAL;//default,this line can comment
		updateModel( VIRTUE.update.jdata );
	}
};

/** update tree node's url  **/
function onChangeCMpath( o ){
	var t = $('#tt');
	var node = t.tree('getSelected');
	if( node != null ){
		node.attributes.url = o.value;
// 		alert('url change excuted!');
		VIRTUE.update.init();
		VIRTUE.update.jdata.data.path = o.value;
		VIRTUE.update.jdata.condition.id = node.id; 
		VIRTUE.update.jdata.operator.id = VIRTUE.operator.EQUAL;//default,this line can comment
		updateModel( VIRTUE.update.jdata );
	}
};

/** update tree node's leaf  **/
function onChangeCMleaf( o ){
	var t = $('#tt');
	var node = t.tree('getSelected');
	if( node != null && o.value!='' ){
		node.attributes.leaf = o.value;
		
		VIRTUE.update.init();
		VIRTUE.update.jdata.data.leaf = o.value;
// 		VIRTUE.update.jdata.data.expanded = o.value;
		VIRTUE.update.jdata.condition.id = node.id; 
		VIRTUE.update.jdata.operator.id = VIRTUE.operator.EQUAL;//default,this line can comment
		updateModel( VIRTUE.update.jdata, node );
	}
};

/** update tree node's note  **/
function onChangeCMnote( o ){
	var t = $('#tt');
	var node = t.tree('getSelected');
	if( node != null ){
		node.attributes.note = o.value;
// 		alert('note change excuted!');
		VIRTUE.update.init();
		VIRTUE.update.jdata.data.note = o.value;
		VIRTUE.update.jdata.condition.id = node.id; 
		VIRTUE.update.jdata.operator.id = VIRTUE.operator.EQUAL;//default,this line can comment
		updateModel( VIRTUE.update.jdata );
	}
};
var btn_toolbar = [ {
	text : 'New',
	disabled: false,
	iconCls : 'icon-add',
	handler : function() {
		if(!$('#tt').tree('getSelected')){
			return false;
		}
		append();
		return false;
	}
}, '-', {
	text : 'Remove',
	disabled: false,
	iconCls : 'icon-remove',
	handler : function() {
		if(!$('#tt').tree('getSelected')){
			return false;
		}
		removeit();
		return false;
	}
} , '-', {
	text : 'Save',
	disabled: false,
	iconCls : 'icon-save',
	handler : function() {
		if(!$('#tt').tree('getSelected')){
			return false;
		}
		accept();
		return false;
	}
}, '-', {
	text : 'Cancel',
	disabled: false,
	iconCls : 'icon-undo',
	handler : function() {
		if(!$('#tt').tree('getSelected')){
			return false;
		}
		reject();
		return false;
	}
}, '-', {
	text : 'GetChanges',
	disabled: false,
	iconCls : 'icon-search',
	plain:true,
	handler : function() {
		getChanges();
		return false;
	}
}];
</script>

<script type="text/javascript">
/** add a module event hander */
function append() {
	newNodeCount ++;
	var t = $('#tt');
	var node = t.tree('getSelected');
	if(node.state=="closed")//deal with asyc node
	{
		appendFlag = 1;
		t.tree('expand', node.target);
	}
	else
	{
		append_F();
	}
};
/** add a module,append a node finally */
function append_F() {
	var t = $('#tt');
	var node = t.tree('getSelected');

	var newNode = {
		id: 'newNode' + newNodeCount,
		text : '新建模块' + newNodeCount,
		state: 'open',
		attributes :{
			url: 'test/new.html',
			leaf: 'true',
			parent: node.id,
			level: node.attributes.level + 1,
			order: t.tree( 'getData', node.target ).children.length + 1,
			note: '备注...'
		}
	};
	
	t.tree('append', {
		parent : (node ? node.target : null),
		data : [ newNode ]
	} );
	
// 	find a node and then select it
	var newNode1 = t.tree( 'find', 'newNode'+newNodeCount );
	
	VIRTUE.add.init();
	VIRTUE.add.jdata.data.name = newNode1.text;
	VIRTUE.add.jdata.data.path = newNode1.attributes.url;
	VIRTUE.add.jdata.data.leaf = newNode1.attributes.leaf;
	VIRTUE.add.jdata.data.parent = newNode1.attributes.parent;
	VIRTUE.add.jdata.data.level = newNode1.attributes.level;
	VIRTUE.add.jdata.data.order = newNode1.attributes.order;
	VIRTUE.add.jdata.data.note = newNode1.attributes.note;
	
	createModel( VIRTUE.add.jdata, newNode1 );
}
 /**
  * del a module:
  	1:cud.jdata.del.rows.push(1);
  */
function removeit() {
	var node = $('#tt').tree('getSelected');
	
	VIRTUE.del.init();
	VIRTUE.del.jdata.condition.id = node.id; 
	VIRTUE.del.jdata.operator.id = VIRTUE.operator.EQUAL;//default,this line can comment
	destroyModel( VIRTUE.del.jdata, node );
// 	$('#tt').tree('remove', node.target);
}
function collapse() {
	var node = $('#tt').tree('getSelected');
	$('#tt').tree('collapse', node.target);
}
function expand() {
	var node = $('#tt').tree('getSelected');
	$('#tt').tree('expand', node.target);
};
function collapseAll() {
	$('#tt').tree('collapseAll');
}
function expandAll() {
	$('#tt').tree('expandAll');
}
/** create db model 
 *
 @param jdata for sqlassembel
 @param id new node's id
 */
function createModel( jdata, newNode1 ){
	var t = $('#tt');
// 	var newNode1 = t.tree( 'find', id );
	
	jQuery.post("../../curd/tAuthorityModuleCURDaddRetId.action", {
		jdata : encodeURI( jQuery.toJSON( jdata ) )
	}, function(oResponse, status) {
// 		oResponse = eval("(" + oResponse + ")");
// 		alert(oResponse.msg);
		if (oResponse.success == true) {
			t.tree('update', {
	 			target: newNode1.target,
	 			id: oResponse.id
	 		});
			var newNode = t.tree( 'find', oResponse.id );
		 	t.tree('select', newNode.target);
		 	t.tree('scrollTo',newNode.target);
		 	updateView( newNode );
		}else{
			alert(oResponse.msg);
			t.tree( 'remove', newNode1.target );
		}
	});
};

/** update db model **/
function updateModel( jdata, node ){
	jQuery.post("../../curd/tAuthorityModuleCURDmodify.action", {
		jdata : encodeURI( jQuery.toJSON( jdata ) )
	}, function(oResponse, status) {
		var t = jQuery('#tt');
// 		oResponse = eval("(" + oResponse + ")");
// 		alert(oResponse.msg);
		if (oResponse.success == true) {
			//弹出一个层一秒钟后消失
		    document.getElementById("mylayer").style.display="inline";
		    var t=setTimeout("document.getElementById('mylayer').style.display='none'",1000);
		    
			if( node != null && node != undefined )
			{
				t.tree( 'reload' );
			}
		}else if (oResponse.success == false) {
			alert(oResponse.msg);
			t.tree( 'reload' );
		}
	});
};

/** delete db model 
 *@param jdata for sqlassembel
  @param node to judge whether delete node is last node
 */
function destroyModel( jdata, node ){
// 	t.tree( 'getData', node.target ).children.length

	jQuery.post("../../curd/tAuthorityModuleCURDremove.action", {
		id : node.id,
		jdata : encodeURI( jQuery.toJSON( jdata ) )
	}, function(oResponse, status) {
		var t = $('#tt');
// 		oResponse = eval("(" + oResponse + ")");
// 		alert(oResponse.msg);
		if (oResponse.success == true) {
// 			var parent = t.tree( 'getParent', node.target );
// 			var children = t.tree( 'getData', parent.target ).children;
// 			var order = node.attributes.order;
			t.tree( 'reload' );//for node icon
		}else{
			alert(oResponse.msg);
			t.tree( 'reload' );
		}
	});
};

/** 
 * move node.
 * @param target target id
 * @param source source id
 * @param point indicate the drop operation, posible values are: 'append','top' or 'bottom'. 
 */
function dndNode( target, source, point ){
	jQuery.post("../../tree/tAuthorityModuleTREEdndNode.action", {
		target : target,
		id : source,
		point : point
	}, function(oResponse, status) {
		oResponse = eval("(" + oResponse + ")");
		var t = $('#tt');
		if (oResponse.success == false) {
			alert(oResponse.msg);
// 			t.tree( 'reload' );
		}
// 		t.tree( 'reload' );
	});
};

/** node 模块树被选定的节点  */
function onSelectModule(node){
	var t = $('#tt');
	var mNode = t.tree('getSelected');
	
// 	console.log($.toJSON(mNode))
	query.jdata.condition.n_mid = node.id;
	$('#dg').datagrid( 'reload', { jdata: encodeURI( $.toJSON( query.jdata ) ) } );
};

/** 按钮信息表格编辑 */
var editIndex = undefined;
function endEditing() {
	if (editIndex == undefined) {
		return true
	}
	if ($('#dg').datagrid('validateRow', editIndex)) {
		$('#dg').datagrid('endEdit', editIndex);
		editIndex = undefined;
		return true;
	} else {
		return false;
	}
};
function onClickRow(index) {
	if (editIndex != index) {
		if (endEditing()) {
			$('#dg').datagrid('selectRow', index).datagrid('beginEdit', index);
			editIndex = index;
		} else {
			$('#dg').datagrid('selectRow', editIndex);
		}
	}
}

function append() {
	var moduleId = $('#tt').tree('getSelected').id;
// 	var buttonNo = $('#dg').datagrid('getRows').length-1;
	var buttonNo = $('#dg').datagrid('getRows').length;
	console.log("moduleId:"+moduleId+",buttonNo:"+buttonNo);
	
	if (endEditing()) {
		$('#dg').datagrid('appendRow', { NMid: moduleId, CBcode: buttonCodeData[buttonNo]["id"],
			CBname: buttonCodeData[buttonNo]["text"],
			url:"", remark:""});
		editIndex = $('#dg').datagrid('getRows').length - 1;
		$('#dg').datagrid('selectRow', editIndex).datagrid('beginEdit',
				editIndex);
	}
};
function removeit() {
	if (editIndex == undefined) {return}
	$('#dg').datagrid('cancelEdit', editIndex).datagrid('deleteRow', editIndex)
	editIndex = undefined;
}
function accept() {
// 	console.log("endEditing():"+endEditing());
	if (endEditing()) {
		var rows = $('#dg').datagrid('getChanges');
		$('#dg').datagrid('acceptChanges');
		if(rows.length>0){
			mergeRecords();
		}
	}
}
function reject() {
	$('#dg').datagrid('rejectChanges');
	editIndex = undefined;
}
function getChanges() {
	var rows = $('#dg').datagrid('getChanges');
	alert(rows.length + ' rows are changed!');
};
/** 将当前表格数据与后台数据合并  */
function mergeRecords(){
	var rows = $('#dg').datagrid('getRows');
	var moduleId = $('#tt').tree('getSelected').id;
	
	jQuery.post( getContextPath()+"/curd/tAuthorityButtonCURDmergeRecords.action", 
		{
			jdata : $.toJSON( rows ),
			id : moduleId
		},
		function(oResponse, status){
			if(oResponse.success == false){
				alert(oResponse.msg);
			}
			$('#dg').datagrid('reload',{
				jdata: encodeURI( $.toJSON( query.jdata ) )
			} );
	});
};
</script>
