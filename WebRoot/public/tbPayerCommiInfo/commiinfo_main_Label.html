/** validate and assign value **/
function PackingParameter(){
	var pay_id = $('#pay_id').val();
	var sign_name = $('#sign_name').val();
	var acc_id = $('#acc_id').val();
	var acc_card_id = $('#acc_card_id').val();
	var commi_inst_id = $('#commi_inst_id').val();
	var merch_id = $('#merch_id').val();
	
	query.init();
	if(pay_id !== ""){
		query.jdata.condition.pay_id = pay_id;
		query.jdata.operator.pay_id = OPE.EQUAL;
	}
	if(sign_name !== ""){
		query.jdata.condition.sign_name = sign_name;
		query.jdata.operator.sign_name = OPE.EQUAL;
	}
	if(acc_id !== ""){
		query.jdata.condition["acc_id"] = acc_id;
		query.jdata.operator["acc_id"] = OPE.EQUAL;
	}
	if(acc_card_id !== ""){
		query.jdata.condition.acc_card_id = acc_card_id;
		query.jdata.operator.acc_card_id = OPE.EQUAL;
	}
	if(commi_inst_id !== ""){
		query.jdata.condition.commi_inst_id = commi_inst_id;
		query.jdata.operator.commi_inst_id = OPE.EQUAL;
	}
	if(merch_id !== ""){
		query.jdata.condition.merch_id = merch_id;
		query.jdata.operator.merch_id = OPE.EQUAL;
	}
	
	exp.jdata.condition = query.jdata.condition;
	exp.jdata.operator = query.jdata.operator;
	return true;
};

/** custom export  */
function customExport(){
	$('#dlg2').dialog('close');
	
	var customColumns="";
	var table = $('#dlg2-dg'); 
	var rows = table.datagrid( 'getSelections');
	for(var i=0, j=rows.length; i<j; i++){
		if(i!=j-1){
			customColumns+=rows[i].name+"|";
		}else{
			customColumns+=rows[i].name;
		}
	}
	exportFile(getFileType(), customColumns);
};

/** export file  */
function exportFile(fileType, customColumns){
	if(!PackingParameter()){
   		return;
   	}
// 	alert("customColumns:"+customColumns);
	var action = "";
	if(fileType == "xls")
	{
		action = "../../exp/tbPayerCommiInfoEXPexportXLS.action?_="+(new Date).getTime();
	}
	else if(fileType == "txt")
	{
		action = "../../exp/tbPayerCommiInfoEXPexportTXT.action?_="+(new Date).getTime();
	}
    var form = document.createElement("form");
    document.body.appendChild(form);
    var i = document.createElement("input");
    i.type = "hidden";
    i.name = "jdata";
    i.value = encodeURI($.toJSON( exp.jdata ) );
    form.appendChild(i);
    
    if(customColumns!=undefined && customColumns!="" && customColumns!=null)
    {
    	var j = document.createElement("input");
        j.type = "hidden";
        j.name = "customColumns";
        j.value = customColumns;
        form.appendChild(j);
    }
    
    form.action = action;
    form.method = "post";
    
//  一提交disable和show的效果立马就不见了哦
    form.submit();
};

/** calc count  */
function calcCount(){
	$.ajax({
	   type: "POST",
	   url: "../../query/tbPayerCommiInfoJEasyUIQuerydfindTotal.action",
	   data: {jdata: encodeURI($.toJSON( query.jdata ) )},
	   async: false,//为了取函数返回值验证结果，这个是必须的
	   success: function(msg){
	     //alert( "Data got: " + msg );
	     //alert("msg.total:"+msg.total);
	     if(msg.total<=10000)
	     {
	    	 $('#dlg').dialog('open');
	     }
	     else if(msg.total>10000 && msg.total<=150000)
	     {
	     	 var r=confirm("记录超过1万条！确认要导出吗？");
			 if (r==true)
			 {
			 	$.messager.alert("提示","后台生成文件可能需要几分钟，请不要关闭浏览器！耐心等待......"); 
			 	$('#dlg').dialog('open');
			 }
	     }
	     else if(msg.total>150000 && msg.total<=600000)
	     {
	     	alert("记录超过15万条只能以文本形式导出！");
	     	document.getElementsByName("dataOptions")[1].checked="checked";
	     	$('#dlg').dialog('open');
	     }
	     else if(msg.total>600000)
	     {
	     	alert("记录超过60万条不能导出！请缩小查询范围！");
	     }
	     else
	     {
	     	alert("导出失败！详情："+msg);
	     }
	   }
	});
};

		$('#win').window('open').window('setTitle', '编辑代付签约');
		$('#win').window("refresh", "../../curd/tbPayerCommiInfoCURDinitModify.action?pojo.NMid="+row.id);

}

function browseModule() {
	var row = $('#grid').datagrid('getSelected');
	if (row) {
		$('#win').window('open').window('setTitle', '浏览代付签约');
		read.init();
		read.jdata.condition.id = row.id;
		read.jdata.operator.id = OPE.EQUAL;
		$('#win').window("refresh", "../../curd/tbPayerCommiInfoCURDbrowse.action?jdata="+encodeURI($.toJSON( read.jdata )));
	}
};

//del.jdata = {act: "del",condition: { id: "" },operator : {nmid : 1} };
function destroyModule(){
	var row = $('#grid').datagrid('getSelected');
	if (row){
		$.messager.confirm('确认','确认删除吗?',function(r){
			if (r){
				del.init();
				del.jdata.condition.id = row.id;
				del.jdata.operator.id = OPE.EQUAL;
				$.post("../../curd/tbPayerCommiInfoCURDdelete.action", { jdata: encodeURI($.toJSON( del.jdata )) }, function(result, status){
					alert(result.msg);
					if (result.success){
						$('#grid').datagrid('reload',{jdata: encodeURI( $.toJSON( query.jdata ) ) } );	// reload data
					}
				});
			}
		});
	}
};

		你可以定义一些附加的选项。（3/4）
		</span>
		<br/><br/><br/>
		<table cellpadding="0" cellspacing="0" border="0">
			<tr>
				<td><input id="selectCol" type='checkbox' name='selectCol' value='包含列的标题' checked="checked" disabled="disabled"/></td>
			    <td><span>包含列的标题</span></td>
		    </tr>
		</table>
		<div style="display: block;">
		<table cellpadding="0" cellspacing="0" border="0">
			<tr>
				<td width="130px"><span>记录分隔符:</span></td>
			    <td width="75px">
			    	<select id="recordseparator" name="recordseparator" style="width:65px;">
    					<option value="CRLF" selected="selected">CRLF</option>
                       	<option value="CR">CR</option>
                       	<option value="LF">LF</option>
					</select>
				</td>
			    <td></td>
		    </tr>
		    <tr>
		    	<td><span>栏位分隔符:</span></td>
				<td>
					<select id="fieldseparator" name="fieldseparator" style="width:65px;">
    					<option value="\t" selected="selected">定位</option>
                       	<option value=";">分号(;)</option>
                       	<option value=",">逗号(,)</option>
                       	<option value=" ">空格</option>
                       	<option value="">无</option>
                       	<option value="other">其他符号</option>
					</select>
				</td>
			    <td><input type="text" width="50px" size="2"/></td>
		    </tr>
		    <tr>
				<td><span>文本限定符:</span></td>
			    <td>
					<select id="fieldseparator" name="fieldseparator" style="width:65px;">
    					<option value="" selected="selected">无</option>
                       	<option value="\"">"</option>
                       	<option value="\'">'</option>
					</select>
				</td>
			    <td></td>
		    </tr>
		</table>
<!-- 	<form id="EXPdlg3Form" action=""> -->
		<fieldset title="格式">
			<legend>&nbsp;格式&nbsp;</legend>
			<table align="center" width="440px">
				<tr height="20px">
					<td align="right" width="140px">日期排序:</td>
		    		<td>
						<select id="dateorder" name="dateorder" style="width:65px;">
	    					<option value="MDY">MDY</option>
	                       	<option value="DMY">DMY</option>
	                       	<option value="YMD" selected="selected">YMD</option>
	                       	<option value="YDM">YDM</option>
	                       	<option value="DYM">DYM</option>
	                       	<option value="MYD">MYD</option>
						</select>
					</td>
		    	</tr>
		    	<tr height="20px">
		    		<td align="right">日期分隔符:</td>
		    		<td><input type='text' name='dateseparator' value='/' size="5"/></td>
		    	</tr>
		    	<tr height="20px">
		    		<td align="right">零填充日期:</td>
		    		<td>
						<select id="zerofilldate" name="zerofilldate" style="width:65px;">
	    					<option value="否" selected="selected">否</option>
	                       	<option value="是">是</option>
						</select>
					</td>
		    	</tr>
		    	<tr height="20px">
		    		<td align="right">时间分隔符:</td>
		    		<td><input type='text' name='timeseparator' value=':' size="5"/></td>
		    	</tr>
		    	<tr height="20px">
		    		<td align="right">小数点符号:</td>
		    		<td><input type='text' name='decimalsymbol' value='.' size="5"/></td>
		    	</tr>
		    	<tr height="20px">
		    		<td align="right">二进制数据编码:</td>
		    		<td>
						<select id="recordseparator" name="recordseparator" style="width:65px;">
	    					<option value="Base64" selected="selected">Base64</option>
	                       	<option value="">无</option>
						</select>
					</td>
		    	</tr>
		    </table>
		</fieldset>
<!-- 	</form> -->
		</div>
    </div>
    
    <div id="dlg3-buttons">
		<input type="button" value="<<&nbsp;" onclick="$('#dlg3').dialog('close');$('#dlg1').dialog('open');"/>
		&nbsp;
		<input type="button" value="<上一步" onclick="$('#dlg3').dialog('close');$('#dlg2').dialog('open');"/>
		&nbsp;&nbsp;
		<input type="button" value="下一步>" onclick="$('#dlg3').dialog('close');$('#dlg4').dialog('open');"/>
		&nbsp;
		<input type="button" value="&nbsp;>>" onclick="$('#dlg3').dialog('close');$('#dlg4').dialog('open');"/>
		&nbsp;&nbsp;
		<input type="button" value="&nbsp;&nbsp;取消&nbsp;&nbsp;" onclick="$('#dlg3').dialog('close');"/> 
	</div>

		iconCls:'icon-download',

			<tr>
		    	<td>已处理：<span id="done"></span></td>
			</tr>
			<tr>
		    	<td>时间：<span id="time"></span></td>
			</tr>
		</table>
		
		<textarea rows="10" cols="54"></textarea>

    <div id="dlg4-buttons">
		<input type="button" value="<<&nbsp;" onclick="$('#dlg4').dialog('close');$('#dlg1').dialog('open');"/>

		<input type="button" value="下一步>" disabled="disabled"/>
		&nbsp;
		<input type="button" value="&nbsp;>>" disabled="disabled"/>
