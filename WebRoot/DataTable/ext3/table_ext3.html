var app = {};

query.jdata = { act: "noquery", condition: {}, operator : {} };
var request = { query: query };
request.start = 0;
request.count = 25;

/** validate and assign value **/
function PackingParameter(){
	var nmlevel = document.getElementById("nmlevel").value;
	var cmleaf = document.getElementById("cmleaf").value;
	var nmparent = document.getElementById("nmparent").value;
	var cmname = document.getElementById("cmname").value;
// 	alert("nmlevel:"+nmlevel);
// 	alert("cmleaf:"+cmleaf);
// 	alert("nmparent:"+nmparent);
// 	alert("cmname:"+cmname);
	
	query.jdata.condition = {};//解决了IE6下,undefined传到后台的问题
	query.jdata.operator = {};
	if(nmlevel !== ""){
		query.jdata.condition.level = nmlevel;
		query.jdata.operator.level = 1;
	}
	if(cmleaf !== ""){
		query.jdata.condition.leaf = cmleaf;
		query.jdata.operator.leaf = 1;
	}
	if(nmparent !== ""){
		query.jdata.condition["t2.name"] = nmparent;
		query.jdata.operator["t2.name"] = 11;
	}
	if(cmname !== ""){
		query.jdata.condition.name = cmname;
		query.jdata.operator.name = 11;
	}
	return true;
};

/** search data ,reload data  **/
function submitForm(){
	query.jdata.act = "query";
   	if(!PackingParameter()){
   		return;
   	}
  	//Parameters are encoded as standard HTTP parameters using Ext.urlEncode.
    app.store.baseParams.jdata = Ext.util.JSON.encode( query.jdata ) ;
    app.store.reload({
    	params: {
	        start: request.start,          // specify params for the first page load if using paging
	        limit: request.count
		}
    });
};
/**  清空  **/
function clearForm(){
	document.getElementById("form").reset();
};
/** export data, don't search   **/
function exportData(){
	query.jdata.act = "exp";
	if(!PackingParameter()){
   		return;
   	}
    var form = document.createElement("form");
    document.body.appendChild( form );
    var i = document.createElement("input");
    i.type = "hidden";
    i.name = "jdata";
    i.value = encodeURI( Ext.util.JSON.encode( query.jdata ) );
    form.appendChild(i);
    form.action = "../../exp/tAuthorityModuleEXPexpModule.action";
    form.method = "post";
    form.submit();
};
