<script language="javascript" type="text/javascript"> 
    var LODOP; //声明为全局变量      
	function PrintOneURL(strID){
		LODOP=getLodop();  
		LODOP.PRINT_INIT("打印控件功能演示_Lodop功能_按网址打印");
		LODOP.ADD_PRINT_URL(30,20,746,"100%",document.getElementById(strID).value);
		LODOP.SET_PRINT_STYLEA(0,"HOrient",3);
		LODOP.SET_PRINT_STYLEA(0,"VOrient",3);
//		LODOP.SET_SHOW_MODE("MESSAGE_GETING_URL",""); //该语句隐藏进度条或修改提示信息
//		LODOP.SET_SHOW_MODE("MESSAGE_PARSING_URL","");//该语句隐藏进度条或修改提示信息
// 		LODOP.PRINT();//直接打印
// 		LODOP.PRINTA();//选择打印机
		LODOP.PREVIEW();//打印预览
// 		LODOP.PRINT_SETUP();//打印维护
	};
	/** 打印  */
	app.print = function (){
		var row = $('#grid').datagrid('getSelected');
		if (row) {
//		   document.form["erb_id"].value = getContextPath()+"/bms_rm/erb_printErb.action?erbId="+row.erbId;
		   document.form["erb_id"].value = "../../bms_rm/erb_printErb.action?data={erbId:"+row.erbId+"}";
//		   alert(document.form["erb_id"].value);
		   PrintOneURL("erb_id");
		}
	};
</script>

	                        style="width:120px;">
