<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
<title>数据表格 by jeasyui CURD</title>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<link rel="stylesheet" type="text/css" href="../../scripts/jquery-easyui/1.3.5/themes/default/easyui.css"/>
<link rel="stylesheet" type="text/css" href="../../scripts/jquery-easyui/1.3.5/themes/icon.css"/>
<script type="text/javascript" src="../../scripts/jquery-1.4.4.min.js"></script>

<script type="text/javascript" src="../../scripts/jquery-easyui/1.3.5/jquery.easyui.min.js"></script>
<script type="text/javascript" src="../../scripts/jquery-easyui/1.3.5/locale/easyui-lang-zh_CN.js"></script>
<!-- <script type="text/javascript" src="../../scripts/jquery-easyui/1.3.5/plugins/jquery.edatagrid.js"></script> -->
<script type="text/javascript" src="../../scripts/json/jquery.json-2.2.min.js"></script>
<script type="text/javascript" src="../../scripts/virtue/virtue.js"></script>

<script type="text/javascript">
var noquery = VIRTUE.noquery;
var query = VIRTUE.query;
var exp = VIRTUE.exp;

// alert($.toJSON( query.jdata ));
// query.init();
// alert($.toJSON( query.jdata ));

/** validate and assign value **/
function PackingParameter(){
	var nmlevel = $('#nmlevel').combobox('getValue');
	var cmleaf = $('#cmleaf').combobox('getValue');
	var nmparent = $('#nmparent').combotree('getValue');
	var cmname = $('#cmname').val();

	query.init();
	if(nmlevel !== ""){
		query.jdata.condition.nmlevel = nmlevel;
		query.jdata.operator.nmlevel = 1;
	}
	if(cmleaf !== ""){
		query.jdata.condition.cmleaf = cmleaf;
		query.jdata.operator.cmleaf = 1;
	}
	if(nmparent !== ""){
		query.jdata.condition["nmparent"] = nmparent;
		query.jdata.operator["nmparent"] = 1;
	}
	if(cmname !== ""){
		query.jdata.condition.cmname = cmname;
		query.jdata.operator.cmname = 11;
	}
	exp.jdata.condition = query.jdata.condition;
	exp.jdata.operator = query.jdata.operator;
	return true;
};

/** search data ,reload data  **/
function submitForm(){
   	if(!PackingParameter()){
   		return;
   	}
//  jdata = { act: 'query',condition: {'t1.nmlevel': [0,1,2,3]},operator : {'t1.nmlevel' : 13} };
   	$('#grid').datagrid( 'reload', { jdata: encodeURI( $.toJSON( query.jdata ) ) } );
};
/**  清空  **/
function clearForm(){
	$('#form').form('clear');
};
/** export data, don't search   **/
function exportData(){
	if(!PackingParameter()){
   		return;
   	}
    var form = document.createElement("form");
    document.body.appendChild(form);
    var i = document.createElement("input");
    i.type = "hidden";
    i.name = "jdata";
    i.value = encodeURI($.toJSON( exp.jdata ) );
    form.appendChild(i);
    form.action = "../../exp/tAuthorityModuleEXPmodule.action";
    form.method = "post";
//  一提交disable和show的效果立马就不见了哦
    form.submit();
    
    //导出后刷新表格数据
// 	$('#grid').datagrid('reload',{jdata: encodeURI($.toJSON( query.jdata ) ) } );
};
/** format level **/
function fmtNmlevel(n){
// 	n = new Number(n);
	switch(n){
		case 0: return '零级'; break;
		case 1: return '一级'; break;
		case 2: return '二级'; break;
		case 3: return '三级'; break;
		case 4: return '四级'; break;
		default: return n;
	}
};
/** format node type  **/
function fmtCmleaf(s){
	s = new String(s);
	if(s=="true"){
		return '叶子';
	}else if(s == "false"){
		return '非叶子';
	}else{
		return s;
	}
};

function newModule(){  //使用一个window
	$('#win').window('open').window('setTitle', '添加模块');
	$('#win').window("refresh", "../../common/tAuthorityModule/tAuthorityModule_add.html");
}

function editModule() {
	var row = $('#grid').datagrid('getSelected');
	if (row) {
		$('#win').window('open').window('setTitle', '编辑模块');
		$('#win').window("refresh", "../../curd/tAuthorityModuleCURDinitModify.action?pojo.NMid="+row.ID);
	}
}

var read = {};
read.jdata = { act: "read",condition: {nmid: ""},operator : {nmid:1} };
function browseModule() {
	var row = $('#grid').datagrid('getSelected');
	if (row) {
		$('#win').window('open').window('setTitle', '浏览模块');
		read.jdata.condition.nmid = row.ID;
		$('#win').window("refresh", "../../curd/tAuthorityModuleCURDbrowse.action?jdata="+encodeURI($.toJSON( read.jdata )));
	}
}

var del = {};
del.jdata = {act: "del",condition: { nmid: "" },operator : {nmid : 1} };
function destroyModule(){
	var row = $('#grid').datagrid('getSelected');
	if (row){
		$.messager.confirm('确认','确认删除吗?',function(r){
			if (r){
				del.jdata.condition.nmid = row.ID;
				$.post("../../curd/tAuthorityModuleCURDdelete.action", { jdata: encodeURI($.toJSON( del.jdata )) }, function(result, status){
					alert(result.msg);
					if (result.success){
						$('#grid').datagrid('reload',{jdata: encodeURI( $.toJSON( query.jdata ) ) } );	// reload data
					}
				});
			}
		});
	}
};

var toolbar = [{
	text:'添加模块',
	iconCls:'icon-add',
	handler:function(){
//		alert('add');
		newModule();
	}
},{
	text:'编辑模块',
	iconCls:'icon-edit',
	handler:function(){
// 		$('#winU').window('open');
		editModule();
	}
},{
	text:'删除模块',
	iconCls:'icon-remove',
	handler:function(){
// 		alert('remove')
		destroyModule();
	}
},{
	text:'查看模块',
	iconCls:'icon-search',
	handler:function(){ browseModule(); }
}];
//program component
$(function(){
	$('#grid').datagrid({
		title: '模块信息',
		//iconCls:'icon-reload',
// 		toolbar: toolbar,
		width: 938,
		height: 720,
		nowrap: true,
		striped: true,
		fit: true,
// 		collapsible: true,
		url: "../../query/tAuthorityModuleJEasyUIQUERYdfind.action",
		idField: "ID",
		remoteSort: true,
		sortName:"SUPER",
		sortOrder:"desc",
		singleSelect: true,
		frozenColumns: [[
            {title:'模块ID',field:"ID", hidden: true},
		    {title:'模块名称',field:"NAME", width:180}//,editor:"text"
		]],
		columns:[[
			{title:'模块级别',field:"LEVEL_",width:70, sortable: true, 
				formatter: fmtNmlevel },//,editor:"combobox"
		    {title:'模块类型',field:"LEAF",width:70, sortable: true, formatter: fmtCmleaf },
		    {title:'模块次序号',field:"ORDER_",width:65, sortable: true },
		    {title:'上级模块',field: "SUPER",width: 180, sortable: true },
		    {title:'链接目标',field:"TARGET",hidden: true},
		    {title:'模块图标样式',field:"ICONCLS",hidden: true},
		    {title:'展开状态',field:"EXPANDED",hidden: true},
		    {title:'选定状态',field:"CHECKED",hidden: true},
		    {title:'模块路径',field:"PATH",width:300},
		    {title:'模块备注',field:"NOTE",width:300},
		    {title:'创建时间',field:"CTIME",hidden: true},//,formatter: getCMctime},
		    {title:'创建者使用的IP',field:"CIP",hidden: true},
		    {title:'创建者',field:"CUSER",hidden: true},
		    {title:'最后修改时间',field:"MTIME",hidden: true},
		    {title:'最后修改者使用的IP',field:"MIP",hidden: true},
		    {title:'最后修改者',field:"MUSER",hidden: true}
		]],
		rownumbers:true,
		queryParams:{
			jdata: encodeURI($.toJSON( query.jdata )) 
		}
	});

});
</script>
</head>
<body rightmargin="0" bottommargin="0" leftmargin="0" topmargin="0" class="easyui-layout">
    <div data-options="region:'center',border:false" title="模块main" style="overflow:hidden;" noheader="true">
		<table id="grid"></table>
	</div>
</body>
</html>
