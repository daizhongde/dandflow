//search event , reload data 
function submitForm(){
	var nmlevel = $('#nmlevel').combobox('getValue');
	var cmleaf = $('#cmleaf').combobox('getValue');
	var nmparent = $('#nmparent').val();
	var cmname = $('#cmname').val();
// 	alert("nmlevel:"+nmlevel);
// 	alert("cmleaf:"+cmleaf);
// 	alert("nmparent:"+nmparent);
// 	alert("cmname:"+cmname);
	jdata.act = "query";
	jdata.condition = {};//解决了IE6下,undefined传到后台的问题
	jdata.operator = {};
	if(nmlevel !== ""){
		jdata.condition.nmlevel = nmlevel;
		jdata.operator.nmlevel = 1;
	}
// 	else{//在IE6和世界之窗的普通渲染模式下undefined会传到后台
// 		jdata.condition.nmlevel = undefined;	
// 		jdata.operator.nmlevel = undefined;
// 	}
	if(cmleaf !== ""){
		jdata.condition.cmleaf = cmleaf;
		jdata.operator.cmleaf = 1;
	}
	if(nmparent !== ""){
		jdata.condition["t2.cmname"] = nmparent;
		jdata.operator["t2.cmname"] = 11;
	}
	if(cmname !== ""){
		jdata.condition.cmname = cmname;
		jdata.operator.cmname = 11;
	}
	$('#agrid').datagrid('reload',{jdata: encodeURI($.toJSON(jdata))});
};
