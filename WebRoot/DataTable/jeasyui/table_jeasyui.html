/** validate and assign value **/
function PackingParameter(){
	var level = $('#level').combobox('getValue');
	var leaf = $('#leaf').combobox('getValue');
// 	var parent = $('#parent').val();
	var parent = $('#parent').combotree('getValue');
	var name = $('#name').val();

	query.init();
	if(level !== ""){
		query.jdata.condition.level = level;
		query.jdata.operator.level = OPE.EQUAL;
	}
// 	else{//在IE6和世界之窗的普通渲染模式下undefined会传到后台
// 		jdata.condition.nmlevel = undefined;	
// 		jdata.operator.nmlevel = undefined;
// 	}
	if(leaf !== ""){
		query.jdata.condition.leaf = leaf;
		query.jdata.operator.leaf = OPE.EQUAL;
	}
// 	if(nmparent !== ""){
// 		query.jdata.condition["t2.cmname"] = nmparent;
// 		query.jdata.operator["t2.cmname"] = 11;
// 	}
	if(parent !== ""){
		query.jdata.condition["parent"] = parent;
		query.jdata.operator["parent"] = OPE.EQUAL;
	}
	if(name !== ""){
		query.jdata.condition.name = name;
		query.jdata.operator.name = OPE.CONTAIN;
	}
	exp.jdata.condition = query.jdata.condition;
	exp.jdata.operator = query.jdata.operator;
	return true;
};

/** Get export file extension name */
function getRadioValue(radioName)
{
 	var robj1=document.getElementsByName( radioName );
	var fileType ="";
	// ==javascript读取radio的值==
	for(var i=0; i<robj1.length; i++)
	{
		if(robj1[i].checked)
		{
			fileType = robj1[i].value;
// 			console.log("radio value:"+robj1[i].value);
			break;
		}
	}
	return fileType;
};

/** Get export file extension name */
function getEXPFileType4Simplely()
{
	return getRadioValue("EXPFileType4Simplely");
};

/** Export file by selected file extension name  */
function exportSimply()
{
	var fileType = getEXPFileType4Simplely();

	//You must Packing parameter at last
	if(!PackingParameter()){
   		return;
   	}
	
	var form = document.createElement("form");
	if(fileType == "xls")
	{
		form.action = "../../exp/tAuthorityModuleEXPexportXLS.action?_="+(new Date).getTime();
	}
	else if(fileType == "txt")
	{
		form.action = "../../exp/tAuthorityModuleEXPexportTXT.action?_="+(new Date).getTime();
	}
    
    document.body.appendChild(form);
    var i = document.createElement("input");
    i.type = "hidden";
    i.name = "jdata";
    i.value = encodeURI($.toJSON( exp.jdata ) );
    form.appendChild(i);

    form.method = "post";
    
//  一提交disable和show的效果立马就不见了哦
    form.submit();
};

function editModule() {
	var row = $('#grid').datagrid('getSelected');
	if (row) {
		$('#win').window('open').window('setTitle', '编辑模块');
		$('#win').window("refresh", "../../curd/tAuthorityModuleCURDinitModify.action?pojo.NMid="+row.id);
	}
};

function browseModule() {
	var row = $('#grid').datagrid('getSelected');
	if (row) {
		$('#win').window('open').window('setTitle', '浏览模块');
		read.init();
		read.jdata.condition.id = row.id;
		read.jdata.operator.id = OPE.EQUAL;
		$('#win').window("refresh", "../../curd/tAuthorityModuleCURDbrowse.action?jdata="+encodeURI($.toJSON( read.jdata )));
	}
};

//del.jdata = {act: "del",condition: { id: "" },operator : {nmid : 1} };
function destroyModule(){
	var row = $('#grid').datagrid('getSelected');
	if (row){
		$.messager.confirm('确认','确认删除吗?',function(r){
			if (r){
				del.init();
				del.jdata.condition.id = row.id;
				del.jdata.operator.id = OPE.EQUAL;
				$.post("../../curd/tAuthorityModuleCURDdelete.action", { jdata: encodeURI($.toJSON( del.jdata )) }, function(result, status){
					alert(result.msg);
					if (result.success){
						$('#grid').datagrid('reload',{jdata: encodeURI( $.toJSON( query.jdata ) ) } );	// reload data
					}
				});
			}
		});
	}
};
