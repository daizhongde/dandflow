<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>自定义报表系统-有查询</title>
	<link rel="stylesheet" type="text/css" href="../../scripts/jquery-easyui/1.3.5/themes/default/easyui.css"/>
	<link rel="stylesheet" type="text/css" href="../../scripts/jquery-easyui/1.3.5/themes/icon.css"/>
	<style type="text/css">
	
	</style>
	<script type="text/javascript" src="../../scripts/jquery-1.4.4.min.js"></script>
	
	<script type="text/javascript" src="../../scripts/jquery-easyui/1.3.5/jquery.easyui.min.js"></script>
	<script type="text/javascript" src="../../scripts/jquery-easyui/1.3.5/locale/easyui-lang-zh_CN.js"></script>
	<script type="text/javascript" src="../../scripts/json/jquery.json-2.2.min.js"></script>
	<script type="text/javascript" src="../../scripts/virtue/virtue.js"></script>
	<script type="text/javascript" src="../../scripts/utils/commonUtil.js"></script>
</head>
<body rightmargin="0" bottommargin="0" leftmargin="0" topmargin="0" class="easyui-layout">
    <div data-options="region:'west',border:false" style="width:270px;">
		<ul class="easyui-tree" data-options="
					url:'tree_data1.json',
					method:'get',
					animate:true,
					formatter:function(node){
						var s = node.text;
						if (node.children){
							s += '&nbsp;<span style=\'color:blue\'>(' + node.children.length + ')</span>';
						}
						return s;
					}
				">
		</ul>
	</div>
	<div data-options="region:'center',iconCls:'icon-ok'" style="overflow:hidden;" >
		<div class="easyui-layout" data-options="fit:true">
			     <div data-options="region:'north',border:true,split:true" style="height:99px;background:#B3DFDA;" title="查询条件" >  
			    	<form id="form" method="post" style="margin:0;padding:0;">
						<div style="padding:0px 0 0px 5px">
							<table width="100%">
			                <tr>
			                    <td>月份:</td>
			                    <td>
			                        <input id="name" name="name" value="" style="width:140px;">
			                    </td>
			                </tr>
			            	</table>
						</div>
						
						<table width="100%" border="0" align="center">
						<tr bgcolor="#E2EEFE" valign="bottom">
							<td height="23"><div align="center"><!-- default height='21'  -->
								<input id='btnSearch' type='button' onclick='submitForm()' value='查 询'/>&nbsp;
								<input id='btnExpSimply' type='button' onclick="$('#EXPdlg').dialog('open')" value='导 出'/>&nbsp;
								<input id='btnPrintSimply' type='button' onclick="$('#EXPdlg').dialog('open')" value='打 印'/>&nbsp;
<!-- 								<input id='btnExpWizard' type='button' onclick="$('#EXPdlg1').dialog('open')" value='导出向导'/>&nbsp; -->
								<input type='button' onclick="clearForm()" value='清 空'/>
							</div></td>
						</tr>
						</table>
			        </form>
			    </div>
             <div data-options="region:'center'" style="overflow:hidden;" >
             	<iframe src='multi-sheet.htm' scrolling="yes" style="width:100%;height:100%" marginheight="0" marginwidth="0" frameborder="0"></iframe>
             </div>
         </div>
		
    </div>
</body>
</html>
