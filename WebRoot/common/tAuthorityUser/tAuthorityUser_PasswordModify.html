<script type="text/javascript">
var update = VIRTUE.update;
var OPE = VIRTUE.operator;

//获取指定请求参数的值
function getParameter(name){ 
  var paramStr=location.search; 
  if(paramStr.length==0)return null; 
  if(paramStr.charAt(0)!='?')return null; 
  paramStr=unescape(paramStr); 
  paramStr=paramStr.substring(1); 
  if(paramStr.length==0)return null; 
  var params=paramStr.split('&'); 
  //alert(params);
  var p = null;
  for(var i=0;i<params.length;i++){
      if(params[i].indexOf(name) >= 0){           
          p = params[i].split('=');
          p = p[1];         
      }
  }
  return p;
}
var uid="";
uid=getParameter("id");

function button_Save_onClick()
{
	var oldPwd = document.getElementById("editor_C_OLDMM").value;
	var newPwd = document.getElementById("editor_C_NEWMM").value;
	var newPwd2 = document.getElementById("editor_C_YGMM").value;
	
	if(oldPwd=="")
	{
		alert("Current Password is Required!");
		document.getElementById("editor_C_OLDMM").focus();
		return;
	}
	if(newPwd=="")
	{
		alert("New Password is Required!");
		document.getElementById("editor_C_NEWMM").focus();
		return;
	}
	if(newPwd2=="")
	{
		alert("Comfirm Password is Required!");
		document.getElementById("editor_C_YGMM").focus();
		return;
	}
	
	if ( newPwd != newPwd2 )
	{
		alert ("New Password must different from current's!");
		document.getElementById("editor_C_NEWMM").focus();
		return;
	}

	/* 	if (uid == "" || uid==undefined)
	{
		alert ("员工ID不能为空!");
		return;
	} */
	update.init();
// 	update.jdata.condition.id = uid;//userid get in action from session
// 	update.jdata.operator.id = OPE.EQUAL;
	update.jdata.condition.oldPwd = oldPwd;//userid get in action from session
	
	update.jdata.data.password = newPwd;
	
	jQuery.post( "../../curd/tAuthorityUserCURDmodifyPWD.action", 
	  { jdata: encodeURI($.toJSON( update.jdata )) }, 
	  function( oResponse, status )
	  {
// 		oResponse = eval("(" + oResponse + ")");
		alert(oResponse.msg);
		if(oResponse.success == true){
			window.close();
		}
	  }
	);
};

function button_Close_onClick()
{
	window.close();
};
</script>
</head>
<body>
	<form id="pwdModForm" action="" method="post"
		style="margin:0;padding:0;">
		<fieldset title="员工密码修改">
			<legend>&nbsp;Password Management&nbsp;</legend>
			<table>
				<tr>
					<td><label id="label_C_OLDMM" >Current Password：</label></td>
					<td><input type="password" id="editor_C_OLDMM"/></td>
				</tr>
				<tr>
					<td><label id="label_C_NEWMM">New Password：</label></td>
					<td><input type="password" id="editor_C_NEWMM"/></td>
				</tr>
				<tr>
					<td><label id="label_C_YGMM">Comfirm Password：</label></td>
					<td><input type="password" id="editor_C_YGMM"/></td>
				</tr>
			</table>
		</fieldset>
		
		<div id="pwdModForm-buttons">
			<input type="button" value="Submit" onclick="button_Save_onClick()"/>
			&nbsp;
			<input type="button" value="Close" onclick="button_Close_onClick()"/>
		</div>
	</form>
</body>
