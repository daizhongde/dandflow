<script type="text/javascript">
var noquery = VIRTUE.noquery;
var query = VIRTUE.query;
var exp = VIRTUE.exp;

var del = VIRTUE.del;
var read = VIRTUE.read;

var OPE = VIRTUE.operator;

var currentIId = 1;//1-省中心，2-长沙市-辖区，17-长沙市
//var currentICode = 1;//430000901-省中心，430100901-长沙市-辖区，430101901-长沙市
var selectedIId = currentIId; 
var selectedIPId = ""; 

query.jdata = { act: VIRTUE.act.QUERY, condition: {did: currentIId }, operator : {}  }; 

/** When click grid row update right role view panel's tree  **/
function updateUserView( rowIndex, rowData ){
	jQuery('#iid_V').html( rowData.iid );

	jQuery('#id_V').html( rowData.id );
	jQuery('#logname_V').html( rowData.logname );
	jQuery('#name_V').html( rowData.name );//text() is param is null, don't update view
	jQuery('#sex_V').html( rowData.sex );//pojo.NIparent.NIid
// 	alert(rowData.phone);
	jQuery('#phone_V').html( rowData.phone );
	jQuery('#tel_V').html( rowData.tel );
	jQuery('#fax_V').html( rowData.fax );
	jQuery('#email_V').html( rowData.email );
	jQuery('#qq_V').html( rowData.qq );
	jQuery('#addr_V').html( rowData.addr );
	
	jQuery('#note_V').html( rowData.note );
};
/** When select combobox update gridview  **/
function updateGridView( node ){
// 	alert("node.id:"+node.id);
	query.jdata.condition.did=node.id;
	$('#grid').datagrid( 'reload', { jdata: encodeURI( $.toJSON( query.jdata ) ) } );
	$('#grid').datagrid( 'unselectAll' );

};

function browseModule() {
	var row = $('#grid').datagrid('getSelected');
	if (row) {
		$('#win').window('open').window('setTitle', '浏览用户');
		read.init();
		read.jdata.condition.id = row.id;
		read.jdata.operator.id = OPE.EQUAL;
		$('#win').window("refresh", "../../curd/tAuthorityUserCURDbrowse.action?jdata="+encodeURI($.toJSON( read.jdata )));
// 		$('#win').window("refresh", "../../tAuthorityUserCURD.do?method=browsePOJO&jdata="+encodeURI($.toJSON( read.jdata )));
	}
};

var toolbar = [{
	text:'View User',
	iconCls:'icon-search',
	handler:function()
	{ 
		browseModule();
		return false;
	}
}];

//<input class='easyui-combotree' id='instCBT' name='pojo.NIid' style='width:260px;' >
$(function(){
	$('#grid').datagrid({
		title: "Select Institution<input class='easyui-combotree' id='instCBT' name='pojo.NIid' style='width:330px;' >",
		toolbar: toolbar,
		nowrap: true,
		striped: true,
		fit: true,
		collapsible: true,
// 		url: "../../query/tAuthorityUserJEasyUIQUERYdfind.action",
		url: "../../query/tAuthorityUserJEasyUIQUERYdfind_ExceptDev.action",
// 		url: "../../tAuthorityUserJEasyUIQUERY.do?method=dfind",
		idField: "id",
		remoteSort: true,
		sortName: "name",
		sortOrder: "asc",
		multiSort: false,
		singleSelect: true,	
		columns:[[
			{title: "Uer ID", field: "id", hidden: true },
			{title: "Login Name", field: "logname", width:80 },
			{title: "Real Name", field: "name", width:140, sortable: true },
		    {title: "Sex", field: "sex",width:60, sortable: true },
		    {title: "Mobile", field:"phone", hidden: true },
		    {title: "E-mail", field: "email", hidden: true },
		    {title: "QQ", field: "qq",hidden: true},
		    {title: "Contact Address",field:"addr", hidden: true},
		    {title: "Institution ID", field:"iid", hidden: true },
		    {title: "Department ID", field:"did", hidden: true }
		]],
		rownumbers:true,
		queryParams:{jdata: encodeURI($.toJSON( noquery.jdata )) },
		onSelect: updateUserView
	});
});
